は、拡張思考が優れる領域で、Claudeが結論の前に複数の角度から検討できます。B：リサーチは多数のツール呼び出しと複数ソースの統合が必要な包括的な情報収集向けで、短い事実確認には過剰です（Cだけ選ぶと不完全）。D：拡張思考単独はウェブを検索しないため、昨日の発表のような最新情報を確認する手段になりません。E：この検討に最新情報は不要で、検索を常に併用しても推論の質が上がる根拠はなく、機能を目的に合わせて選ぶ原則にも反します。", "source": "https://support.claude.com/ja/articles/11095361-ウェブ検索-拡張思考-リサーチはいつ使うべき", "created": "2026-11-21"}, {"id": "A3-q020", "statement_id": "A3-1", "pack": "gen", "angle": "find-error", "role": "教育", "scenario": "学習塾の教務担当者が、チーム向けにClaudeの「指示」「プロジェクト指示」「Skills」の使い分けルール案を作っています。リーダーが案をレビューし、設定の置き場所として不適切なものがないかを確認しています。", "question": "次の運用案のうち、不適切なものはどれですか。（2つ選択）", "choices": {"A": "「回答は常に敬体で簡潔に」という全般的な好みは、すべての会話に適用されるアカウント全体の指示に書く。", "B": "ある保護者面談資料の案件だけに必要な要件は、全会話に適用されるアカウント全体の指示にまとめて書く。", "C": "毎回同じ形式に整える教材の仕上げ作業は、Skillとして定義し、必要なときに呼び出して使う。", "D": "同じ案件の複数の会話で前提を保ちたいときは、プロジェクト指示に役割と要件を書いておく。", "E": "プロジェクト指示は他のチャットにも自動で効くため、全員共通のルールの置き場所として使う。"}, "answer": "B,E", "select_count": 2, "explanation": "B（不適切）：アカウント全体の指示はすべての会話に適用されるため、特定案件だけの要件を書くと無関係なチャットにも影響します。案件固有の要件はプロジェクト指示に置くのが適切です。E（不適切）：プロジェクト指示はそのプロジェクト内のチャットにのみ適用されるため、プロジェクト外も含む共通ルールの置き場所にはなりません。全般的な好みはアカウント全体の指示に書きます（Bだけ、Eだけを指摘すると不完全です）。A（適切）：全会話に効かせたい一般的な好みはアカウント全体の指示の用途です。C（適切）：反復可能な動作や書式をオンデマンドで適用するのはSkillsの用途です。D（適切）：同一プロジェクト内で一貫した文脈を維持するのがプロジェクト指示の用途です。", "source": "https://support.claude.com/ja/articles/10185728-claudeのパーソナライゼーション機能を理解する", "created": "2026-11-21"}, {"id": "A3-q021", "statement_id": "A3-1", "pack": "gen", "angle": "tradeoff", "role": "ナレッジワーカー", "scenario": "有料プランを使うナレッジワーカーが、新しいチャットを開くたびに文脈を説明し直す手間を減らしたいと考えています。先週の別のチャットで固めた資料の構成案の詳細を参照して作業を続けたいのですが、その内容は一時的なもので、記憶として残す必要はありません。一方、毎月使う報告書の書き方の好みは、今後も引き継がせたいと考えています。", "question": "手間を減らすのに最も適切な組み合わせはどれですか。（2つ選択）", "choices": {"A": "先週の構成案は、会話の全文を毎回コピーして新しいチャットに貼り付ける。過去のチャットは参照できない。", "B": "報告書の書き方の好みは、シークレットチャットで説明すれば、次回以降のチャットでも記憶されて引き継がれる。", "C": "先週の構成案は、過去のチャットを検索するようClaudeに依頼し、関連する会話の情報を参照させて続ける。", "D": "報告書の書き方の好みは、「これを覚えておいて」と伝えてメモリに保存させ、新しいチャットでも使えるようにする。", "E": "好みの引き継ぎには、書き方に加えて個人の政府ID番号もメモリへの保存を依頼し、毎回の入力を省く。"}, "answer": "C,D", "select_count": 2, "explanation": "C（正解）：過去のチャット検索は、以前の会話から関連情報を見つけて新しいチャットで参照させる機能で、一時的な内容をメモリに保存せずに引き継げます。D（正解）：継続して使う好みや作業スタイルは、「これを覚えておいて」と伝えてメモリに保存でき、新しいチャットにも引き継がれます（片方だけでは手間を十分に減らせません）。A：過去のチャットはClaudeに検索を依頼して参照できるため、全文の貼り付けは不要で非効率です。B：シークレットチャットは履歴にもメモリにも残らず、好みの引き継ぎとは逆の挙動です。E：政府ID番号などは、依頼してもメモリに保存されない情報です。また機微な情報を引き継ぎの目的で渡すのも不適切です。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A4-q001", "statement_id": "A4-1", "pack": "gen", "angle": "design-choice", "role": "マーケティング", "scenario": "マーケティング担当者が、新サービスへの参入可否を検討する提案書を作成します。市場動向、競合、顧客の声という複数の観点を調べ、根拠を示して提案にまとめる必要があり、提案書は社外の意思決定会議でも使われます。", "question": "リサーチから提案へのまとめ上げまでの進め方として、最も適切なものはどれですか。", "choices": {"A": "通常のチャットで市場動向を一度だけ尋ね、返ってきた回答をそのまま提案書の根拠として使う。", "B": "調査機能で出典付きに調べさせ、重要な主張は出典で確認してから、提案の骨子にまとめさせる。", "C": "先に提案の結論を決め、その結論を裏づける情報だけをClaudeに探させて引用をそろえる。", "D": "調査機能は使わず、Claudeの既存の知識で概況を書かせ、出典は提出後に探して付け足す。"}, "answer": "B", "select_count": 1, "explanation": "Bが正解です。調査機能は複数の検索を重ね、見つかった内容に基づいて次の調べる対象を決めながら質問を多角的に掘り下げるため、複数観点のリサーチに向いています。そのうえで、出典付きの主張を人が確認してから計画にまとめることで、社外にも使う成果物の責任を果たせます。Aは一度きりの回答では多角的な調査にならず、出典の確認もないため根拠として不十分です。Cは結論ありきで情報を集めるため、都合の悪い情報が抜け落ち、リサーチの目的に反します。Dは出典のない記述を先に書かせて後から出典を探す順序で、裏付けのない内容が混入しやすく、確認も後回しになります。", "source": "https://support.claude.com/ja/articles/11088861-claudeの調査機能を使用する", "created": "2026-11-21"}, {"id": "A4-q002", "statement_id": "A4-1", "pack": "gen", "angle": "troubleshoot", "role": "ナレッジワーカー", "scenario": "ナレッジワーカーが、社内のGoogle Docsにある議事録と最新のウェブ情報を合わせて競合動向をまとめるため、調査機能をオンにし、外出先でスマートフォンのアプリから調査を依頼しました。返ってきた結果はウェブ上の情報だけで、社内議事録の内容がまったく反映されておらず、エラーの表示もありませんでした。", "question": "社内議事録が反映されなかった原因として、最も妥当なものはどれですか。", "choices": {"A": "調査機能は、ウェブ検索をオフにしないとGoogle Docsなどのコネクタの情報を読み込めないため。", "B": "社内議事録の分量が多く、調査の途中でClaudeが自動的に調査対象から外してしまったため。", "C": "調査機能はGoogle Workspaceのコネクタには対応しておらず、ウェブ情報のみを対象とするため。", "D": "モバイルで開始した調査はウェブのみを検索し、コネクタが使われなくてもエラーが表示されないため。"}, "answer": "D", "select_count": 1, "explanation": "Dが正解です。Claude Mobileで調査を開始するとウェブのみが検索され、コネクタはスキップされますが、その旨のエラーや表示は出ません。ウェブとコネクタの両方を調べたい場合は、WebまたはDesktopで調査を開始します。Aは逆で、調査機能が動作するにはウェブ検索をオンにする必要があります。Bのような自動的な除外は教材に根拠がなく、症状（エラー表示なしでウェブ情報のみ）はモバイル開始の挙動と一致します。Cは誤りで、調査機能はGoogle Workspace（Gmail、Calendar、Docs）を含む接続済みツールも調査対象にできます。", "source": "https://support.claude.com/ja/articles/11088861-claudeの調査機能を使用する", "created": "2026-11-21"}, {"id": "A4-q003", "statement_id": "A4-1", "pack": "gen", "angle": "find-error", "role": "オペレーション", "scenario": "オペレーション担当者が、月次の売上CSVをClaudeのコード実行で分析し、傾向をまとめた資料を役員会に報告する予定です。次の4つは、担当者が検討した進め方の案です。", "question": "進め方として不適切なものはどれですか。", "choices": {"A": "集計結果と要約が読みやすい仕上がりなので、実行内容や元データとの突き合わせを省き、そのまま役員報告に使う。", "B": "分析の目的と見たい指標を先に伝え、CSVをアップロードしてコード実行で集計とグラフ化を依頼し、出てきた結果を確認の出発点にする。", "C": "Claudeが実行したスクリプトと集計手順の説明を読み、元データの数行を手計算して結果と照合する。", "D": "報告に使う前に、数値の根拠が確認できない箇所を洗い出し、必要に応じて修正を依頼して再分析させる。"}, "answer": "A", "select_count": 1, "explanation": "Aが不適切です。コード実行による分析でも、出力の確認は必要で、読みやすさは正確さの保証になりません。役員報告は誤りの影響が大きい用途であり、結果を使う人が責任を持って検証する必要があります。Bは目的と指標を具体的に伝えてからコード実行に任せる、適切な始め方です。Cは実行内容の説明を読み、元データと照合する独立した確認で、適切です。Dは根拠の確認できない箇所を特定して修正させる、報告前の検証として適切です。", "source": "https://support.claude.com/ja/articles/12111783-claudeでファイルを作成-編集する", "created": "2026-11-21"}, {"id": "A4-q004", "statement_id": "A4-1", "pack": "gen", "angle": "tradeoff", "role": "コンサルタント", "scenario": "コンサルタントが、顧客から預かった機密性の高い売上データ（CSV）を分析し、業界のベンチマークと比較する提案書を作っています。所属組織ではコード実行は使えますが、ネットワークアクセスは無効で、顧客データを外部に出すリスクは避ける必要があります。納期も迫っています。", "question": "機密性と納期の両方を満たしつつ、ベンチマーク比較を含める進め方として最も適切なものはどれですか。", "choices": {"A": "すべてのドメインへのネットワークアクセスを許可してもらい、Claudeに外部ベンチマークを自動取得させる。", "B": "ベンチマークとの比較は行わず、顧客データの集計だけを提案書にまとめ、外部との比較は結論から外す。", "C": "ネットワークは閉じたまま、信頼できる出典から人がベンチマークを取得してアップロードし、分析はコード実行で行う。", "D": "ネットワーク設定にかかわらずMCP経由なら通信できるため、MCPで外部の情報を取得し、分析も同じ接続で行う。"}, "answer": "C", "select_count": 1, "explanation": "Cが正解です。ネットワークアクセスを無効にしたままでも、コード実行とファイル作成の機能は使えます。外部データは人が信頼できる出典から取得して取り込めば、サンドボックスから外へデータが出るリスクを抑えつつ、比較分析も進められます。Aはすべてのドメインを許可する設定が最もリスクが高く、プロンプトインジェクションなどでデータが外部に送られる恐れがあるため、機密データには不適切です。Bは安全ですが、必要な比較を落として提案の価値を下げ、取れる手段があるのに目的を達成しません。DはMCP統合がネットワークエグレス設定に関係なく通信できる経路になる点を逆手に取るもので、組織の制限を回避することになり、別途評価すべきリスクを増やします。", "source": "https://support.claude.com/ja/articles/12111783-claudeでファイルを作成-編集する", "created": "2026-11-21"}, {"id": "A4-q005", "statement_id": "A4-1", "pack": "gen", "angle": "design-choice", "role": "教育", "scenario": "学年主任が、毎月、成績のCSVを集計し、学校指定の書式で所見をまとめたWordレポートを作っています。毎回、同じ手順と書式の説明を長いプロンプトに貼り付けていますが、貼り忘れや手順の抜けが出ています。この手順は、月次レポートの作成時にだけ使います。", "question": "この反復する作業を安定させるために、最も適切な方法はどれですか。", "choices": {"A": "手順と書式のすべてをカスタム指示に書き込み、月次レポート以外も含むあらゆる会話で常に適用されるようにする。", "B": "手順と書式、使う場面の説明をカスタムスキルとして作成し、月次レポートの依頼時にClaudeに読み込ませる。", "C": "前月のレポート作成のチャットを検索させ、毎回「前回の手順と書式と同じように作って」とだけ依頼する。", "D": "手順と書式をメモリに覚えさせ、どの会話でも自動的に月次レポートの形式で出力されるようにしておく。"}, "answer": "B", "select_count": 1, "explanation": "Bが正解です。スキルは特定の反復可能なタスクのための手順や指示をまとめたもので、関連するタスクのときにだけ動的に読み込まれます。使う場面を説明に具体的に書くことで、Claudeが適切なときに呼び出せます。Aのカスタム指示はすべての会話に広く適用されるため、月次レポート専用の手順には不向きです。Cは過去のチャットの検索結果に頼るため手順が毎回安定せず、前回の誤りも引き継ぎかねません。Dのメモリは作業の背景や好みを蓄積する仕組みで、特定タスクの手順を確実に実行させるためのものではなく、他の作業にも影響します。", "source": "https://support.claude.com/ja/articles/12512176-スキルとは何ですか", "created": "2026-11-21"}, {"id": "A4-q006", "statement_id": "A4-1", "pack": "gen", "angle": "troubleshoot", "role": "プロジェクト管理", "scenario": "プロジェクトマネージャーが、新しい社内システムの導入計画をまとめるため、Claudeに「導入計画を作ってください」とだけ依頼しました。返ってきた計画は一般論ばかりで、自社の状況に合わず、そのままでは実行に移せませんでした。目的、期限、関係者、利用できる体制、希望する形式は、依頼の中で伝えていませんでした。", "question": "実行可能な計画にならなかった原因として、最も妥当なものはどれですか。", "choices": {"A": "ウェブ調査の機能がオフのままだったため、自社の計画に必要な最新情報や外部の事例を網羅的に取得できなかったため。", "B": "計画書をWord形式で作らせたため、計画にはExcel形式で出力させる必要があったため。", "C": "目的や期限、関係者、制約、望む形式といった要件を整理して伝えず、Claudeが一般的な前提で補ったため。", "D": "一度の依頼で計画全体を求めたため、必ず複数のチャットに分けないと計画は作れないため。"}, "answer": "C", "select_count": 1, "explanation": "Cが正解です。何を、誰のために、どんな制約で、どんな形式で欲しいのかという要件を最初に整理して伝えること（目的の理解と、成果物・形式・読み手の指定）が、実行可能な計画につながります。伝えられなかった部分は、Claudeが一般的な前提で補うため、自社に合わない計画になります。Aは、自社固有の要件が伝わっていないことが問題であり、ウェブ調査の有無では解決しません。Bは、形式の指定が必要なのは事実ですが、形式の違いが一般論になる原因ではありません。Dは、段階的に進める方法はありますが、一度の依頼が原因とは言えず、複数に分けないと作れないという根拠もありません。", "source": "https://assets.claude.com/4396730ed190e691a3712cf2fd6bfe35509deca2.pdf", "created": "2026-11-21"}, {"id": "A4-q007", "statement_id": "A4-2", "pack": "gen", "angle": "troubleshoot", "role": "オペレーション", "scenario": "ある運用チームは、在庫が基準を下回ると取引先へ発注メールを送るまでの流れを、Claudeを使ったワークフローに置き換えました。導入後、在庫データの読み違えにより、不要な大口発注が取引先に送られる事故が2回起きました。担当者は発注内容を事前に見る機会がなく、送信後に初めて気づきました。", "question": "この問題の原因として最も妥当なものはどれですか。", "choices": {"A": "Claudeが在庫の判断に必要な知識を持っておらず、より新しいモデルに切り替えれば解消する性能の問題です。", "B": "発注メールの文面が丁寧すぎず、取引先に誤解を与えるような表現になっていたことが主な原因です。", "C": "在庫の集計をClaudeに任せたこと自体が誤りで、集計も人が手作業で行うべきだったという点です。", "D": "社外への送信という取り消しにくい重要なステップを、人のレビューなしにAIへ委任した過度な委任です。"}, "answer": "D", "select_count": 1, "explanation": "Dが正解です。取引先への発注は送信後に取り消しにくく、業務上の影響も大きいステップです。こうしたステップは、人が送信前にレビューするよう割り当てるべきで、レビューなしの委任が事故の原因です。Aはモデルの性能で片付けていますが、問題の本質は事前確認の設計にあります。Bは文面の問題ではなく、内容の誤りが原因です。Cは集計のような可逆的な作業まで人に戻す必要はなく、問題は送信前に確認がない点にあります。", "source": "https://assets.claude.com/4396730ed190e691a3712cf2fd6bfe35509deca2.pdf", "created": "2026-11-21"}, {"id": "A4-q008", "statement_id": "A4-2", "pack": "gen", "angle": "find-error", "role": "広報", "scenario": "広報チームが、プレスリリースの作成と公開のワークフローにClaudeを組み込む案を検討しています。案では、情報の整理、文案の作成、表現の言い換え案の提示、社外公開前の最終承認までの各ステップについて、人とClaudeの役割を割り当てています。", "question": "この案のうち、委任の基準に照らして最も不適切な割り当てはどれですか。", "choices": {"A": "公開前の最終承認はClaudeが行い、広報担当者は公開後に結果の報告を受けて確認します。", "B": "社内資料の情報整理はClaudeが実行し、担当者が元資料と照らして抜けがないか確認します。", "C": "文案の作成はClaudeが下書きし、担当者が事実関係と企業の方針に沿うかをレビューします。", "D": "表現の言い換え案の提示はClaudeが実行し、担当者がその中から採用するものを選びます。"}, "answer": "A", "select_count": 1, "explanation": "Aが正解（不適切な案）です。社外公開は取り消しが困難で、企業の信用に関わる重要な決定です。最終承認には人の判断と説明責任が必要で、事後の報告確認では誤りの公開を防げません。B、C、Dはいずれも、AIが下書きや整理を担い、人が確認・選択する構成になっており、可逆性と責任の所在が保たれた妥当な割り当てです。", "source": "https://assets.claude.com/4396730ed190e691a3712cf2fd6bfe35509deca2.pdf", "created": "2026-11-21"}, {"id": "A4-q009", "statement_id": "A4-2", "pack": "gen", "angle": "tradeoff", "role": "教育", "scenario": "講師が、受講生80名への学期末の個別フィードバックを、提出期限までの限られた時間で作成しなければなりません。その中には、成績不振で退学を迷っている受講生が数名含まれています。講師は、時間の制約と、受講生への配慮の両方を満たす進め方を探しています。", "question": "委任の基準に照らして、最も適切な進め方はどれですか。", "choices": {"A": "全員分のフィードバックをClaudeが作成してそのまま送付し、退学を迷う受講生にも同じ手順を用います。", "B": "時間が足りないため、Claudeは使わず全員分を講師が手書きで作成し、品質を優先して提出期限を延ばします。", "C": "多くの受講生の下書きはClaudeが作成して講師が確認し、退学を迷う受講生への対応は講師が自ら担当します。", "D": "全員分の下書きをClaudeが作成し、退学を迷う受講生には、励ましの文面を足した上で講師が送付します。"}, "answer": "C", "select_count": 1, "explanation": "Cが正解です。通常のフィードバックは下書きをAIに任せ、講師がレビューすることで時間を節約できます。一方、退学を迷う受講生への対応は人の判断と共感が必要で、人が担当すべきステップです。Aは共感が必要な場面までAIに委ねており過度な委任です。Bは委任に向く作業まで人が抱え、時間の制約に応えていません。Dは、共感や判断が必要な受講生への対応の核心をAIの下書きに頼っており、人が担当する形になっていません。", "source": "https://assets.claude.com/4396730ed190e691a3712cf2fd6bfe35509deca2.pdf", "created": "2026-11-21"}, {"id": "A4-q010", "statement_id": "A4-2", "pack": "gen", "angle": "design-choice", "role": "プロジェクト管理", "scenario": "プロジェクトマネージャーが、毎週の定例会議後の業務を見直しています。現在のステップは「議事録の作成」「アクション項目の抽出」「遅延が発生した顧客への謝罪と再計画の提案」です。遅延した顧客は今回の対応次第で契約の継続を判断するとしています。", "question": "委任の基準に照らして、各ステップの割り当てとして最も適切なものはどれですか。", "choices": {"A": "議事録とアクション項目はClaudeが下書きして担当者が確認し、顧客への謝罪と再計画の提案は担当者が行います。", "B": "議事録はClaudeが作成し、謝罪と再計画の提案も下書きから送付までClaudeに任せて、結果だけ報告を受けます。", "C": "議事録の作成と顧客への対応はいずれも人が担当し、Claudeはアクション項目の抽出だけを実行します。", "D": "議事録とアクション項目は人が手作業で作り、顧客への対応文面の下書きだけをClaudeに依頼します。"}, "answer": "A", "select_count": 1, "explanation": "Aが正解です。議事録やアクション項目の整理は、人が確認すれば修正できる可逆的な作業で、AIの下書きとレビューの組み合わせに向いています。契約継続がかかった顧客への謝罪と再計画は、重要度が高く、共感や関係性に基づく判断と説明責任が求められるため、人が担当します。Bは重要な顧客対応までAIに任せる過度な委任です。Cは議事録まで人が行っており、委任できる作業を活かしていません。Dは委任の向きが逆で、低リスクな作業を人が抱え、重要な対応の核にAIを使っています。", "source": "https://assets.claude.com/4396730ed190e691a3712cf2fd6bfe35509deca2.pdf", "created": "2026-11-21"}, {"id": "A4-q011", "statement_id": "A4-2", "pack": "gen", "angle": "troubleshoot", "role": "ナレッジワーカー", "scenario": "ある部署では、Claudeが作成した契約条件の要約を「人がレビューする」ステップを置いて運用しています。ところが、レビュー担当者は数百件を連日処理するため、内容を読まずに承認するようになり、要約の誤りが取引先との交渉まで気づかれませんでした。責任者は、誰がその誤りに責任を負うのかも明確ではないと感じています。", "question": "このワークフローの問題として最も妥当な原因はどれですか。", "choices": {"A": "要約をClaudeに任せたこと自体が不適切で、契約に関わる作業はすべて人が担当する設計に戻すべきでした。", "B": "レビュー担当者の能力不足が原因であり、より経験の豊富な担当者に交代させれば同じ体制で問題は解消します。", "C": "Claudeの要約の精度が低かったことだけが原因で、要約の形式を指定すればレビューは不要になります。", "D": "「人がレビュー」の割り当てが形式だけで、確認できる量や責任の所在が設計されず、実質的な確認になっていません。"}, "answer": "D", "select_count": 1, "explanation": "Dが正解です。人がレビューするステップは、実際に内容を確認できる量と、結果に責任を負う人が定義されて初めて機能します。形式的な承認では、委任の説明責任を果たせません。Aは、AIの下書きと人のレビューという構成自体は妥当であり、全面的に人に戻すのは過剰です。Bは個人の能力の問題にしていますが、確認できない量という設計の問題が残ります。Cは、形式を指定しても誤りの可能性は残り、重要な内容では人による確認が引き続き必要です。", "source": "https://assets.claude.com/4396730ed190e691a3712cf2fd6bfe35509deca2.pdf", "created": "2026-11-21"}, {"id": "A4-q012", "statement_id": "A4-3", "pack": "gen", "angle": "design-choice", "role": "オペレーション", "scenario": "5人のチームが週次の稼働報告を作成していますが、各自が自分のプロンプトで依頼しているため、見出しの構成や判断基準が人によってばらつきます。リーダーは、全員が同じ手順と書式で作成できるようにし、手順の改善も一か所で反映したいと考えています。", "question": "最も適切な進め方はどれですか。", "choices": {"A": "各自のプロンプトのうち出来の良いものを共有ドキュメントに集め、メンバーが好みで選んで毎回貼り付けて使います。", "B": "報告書の書式と作成手順をカスタムスキルにまとめ、チームに共有または公開して、全員が同じ手順で作成できるようにします。", "C": "書式と判断基準をすべてカスタム指示に書き、各メンバーのアカウント全体の設定として、すべての会話に適用します。", "D": "出来の良かった過去のチャットのリンクを全員に配り、「この回答と同じようにまとめて」と毎回依頼するよう徹底します。"}, "answer": "B", "select_count": 1, "explanation": "Bが正解です。特定の反復タスクの手順と書式をカスタムスキルにまとめて共有・公開すれば、関連する場面でClaudeが同じ指示を読み込み、メンバー間の一貫性が保てます。手順を改善するときも、スキルを更新すれば全員に反映されます。Aは各自が選んで貼り付けるため、使うプロンプトが人によって変わり、ばらつきが残ります。Cのカスタム指示はすべての会話に広く適用されるため、報告書以外の依頼にも影響します。特定のワークフロー向けの手順はスキルのほうが適しています。Dは過去のチャットを手本にする運用で、手順が明文化されず、人によって「同じように」の解釈が異なります。", "source": "https://support.claude.com/ja/articles/12512176-スキルとは何ですか", "created": "2026-11-21"}, {"id": "A4-q013", "statement_id": "A4-3", "pack": "gen", "angle": "troubleshoot", "role": "マーケティング", "scenario": "マーケティング担当が「ブランドガイドライン適用」スキルを作成し、チームに共有しました。同僚は全員スキルを有効にしていますが、「資料を作って」と頼んでもスキルが使われる回と使われない回があります。スキルの説明（description）欄には「資料用」とだけ書かれています。", "question": "スキルが安定して使われない原因として、最も妥当なものはどれですか。", "choices": {"A": "共有されたスキルは閲覧専用のため、同僚は内容を編集できず、Claudeにも読み込ませられない状態になっています。", "B": "同僚が使っているモデルが作成者と異なるため、スキルを呼び出すかどうかの判断が不安定になっています。", "C": "同僚ごとにメモリの内容が異なるため、過去のチャットの記憶がスキルの呼び出し判断を上書きしています。", "D": "説明欄が「何をいつ使うか」を具体的に示しておらず、Claudeがスキルを呼び出す場面を判断しにくくなっています。"}, "answer": "D", "select_count": 1, "explanation": "Dが正解です。Claudeは説明欄を使ってスキルを呼び出すかどうかを判断します。「資料用」だけでは、どの資料にどのガイドラインを適用するスキルか分からず、呼び出しが不安定になります。適用する場面を具体的に書き、複数の異なるプロンプトでテストするのが基本です。Aは誤りです。共有されたスキルは閲覧専用ですが、受信者は有効にして使えます。Bは根拠がありません。スキルの呼び出しを左右するのは、まず説明の具体性です。Cも誤りです。メモリは背景情報であり、スキルの呼び出し判断を上書きする仕組みではありません。症状は説明欄の曖昧さと一致します。", "source": "https://support.claude.com/ja/articles/12512180-claude-でスキルを使用する", "created": "2026-11-21"}, {"id": "A4-q014", "statement_id": "A4-3", "pack": "gen", "angle": "find-error", "role": "プロジェクト管理", "scenario": "プロジェクト管理担当が異動することになり、自作の「議事録からタスク一覧を作る」スキルを後任に引き継ぎます。以後は後任がスキルの内容を保守する予定で、次のような引き継ぎ案を考えました。", "question": "この引き継ぎ案のうち、最も不適切な想定はどれですか。", "choices": {"A": "スキルを後任に共有すれば、後任は共有されたスキルの内容を直接編集でき、以後の改善もそのまま行えると想定しています。", "B": "手順・判断基準・入出力の例をスキルの本文に明記し、自分の頭の中にしかない暗黙のルールを残さないようにします。", "C": "引き継ぎ前に後任がスキルを有効にし、異なる議事録で試して、期待どおり呼び出されて動くことを確認してもらいます。", "D": "説明欄に、何をするスキルでいつ使うべきかを具体的に書き、後任が目的と使いどころをすぐ把握できるようにします。"}, "answer": "A", "select_count": 1, "explanation": "Aが不適切です。共有されたスキルは表示のみで、受信者は有効にして使えますが内容は編集できません。後任が以後の保守を担う場合は、コピーをダウンロードして後任が自分のスキルとしてアップロードするなど、後任が管理できる形で渡す必要があります。Bは適切です。暗黙のルールを本文に書き出すことが、担当者が変わっても同じ結果を保つ要点です。Cも適切です。複数のプロンプトでテストして動作を確認することは、スキル運用の基本です。Dも適切です。説明欄の具体的な記述はClaudeの呼び出し判断にも、後任の理解にも役立ちます。", "source": "https://support.claude.com/ja/articles/12512180-claude-でスキルを使用する", "created": "2026-11-21"}, {"id": "A4-q015", "statement_id": "A4-3", "pack": "gen", "angle": "tradeoff", "role": "コンサルタント", "scenario": "コンサルタントが毎月、クライアントの売上CSVを集計して前月比の表を作っています。毎回チャットに集計手順を書いて依頼していますが、計算結果の細部が月や担当者によって異なり、確認に時間がかかっています。今後は後任のメンバーも同じ作業を行う予定です。", "question": "正確さと一貫性を重視する場合、最も適切な設計はどれですか。", "choices": {"A": "集計手順をさらに詳しく文章でプロンプトに書き足し、毎回それをコピーして貼り付けてClaudeに計算を依頼します。", "B": "前月の集計結果の表をProjectに置き、Claudeに前月と同じ形式と同じ値の出し方をまねて作成させます。", "C": "集計ロジックをスクリプトとしてスキルに同梱し、コード実行で毎回同じ処理を走らせ、出力形式もスキルで定めます。", "D": "毎月Claudeの出力を担当者が電卓で全件検算し、ずれがあればその都度プロンプトを直して再依頼します。"}, "answer": "C", "select_count": 1, "explanation": "Cが正解です。スキルには実行可能なスクリプトを添付でき、コード実行で毎回同じ処理を走らせられるため、集計のばらつきを抑えられます。出力形式もスキルに定めておけば、担当者が変わっても同じ手順を再現できます。Aは手順を詳しく書いても、毎回Claudeが文章から計算を再解釈するため、結果の細部がぶれる問題が残ります。BのProjectは背景知識を提供するもので、前月の表をまねさせても計算の再現性は保証されません。Dは人手の検算に頼る運用で、時間がかかる問題が解消されず、反復可能なワークフローの設計にもなっていません。", "source": "https://support.claude.com/ja/articles/12512198-カスタムスキルの作成方法", "created": "2026-11-21"}, {"id": "A4-q016", "statement_id": "A4-3", "pack": "gen", "angle": "design-choice", "role": "教育", "scenario": "教務チームは課題管理ツールにコネクタで接続済みで、Claudeにタスク登録を頼めます。しかし、タスクの命名規則や優先度の付け方が担当者ごとにばらつき、チームの規約どおりに登録されません。", "question": "規約どおりの登録を全員で安定させるには、どうするのが最も適切ですか。", "choices": {"A": "同種のコネクタをさらに追加で接続し、Claudeがアクセスできるツールや選べる操作の数を増やします。", "B": "命名規則と優先度ルールをカスタム指示に書き、全員のすべての会話で常に適用されるようにします。", "C": "命名規則と優先度の付け方をスキルに手順として記載し、すでに接続済みのコネクタと組み合わせて使います。", "D": "規約の文面を各自がプロンプトの冒頭に毎回貼り付けて依頼する運用を、チームのルールとして徹底します。"}, "answer": "C", "select_count": 1, "explanation": "Cが正解です。コネクタはClaudeにツールへのアクセスを与え、スキルはそのツールを規約どおりに使う手順を教えます。両者は組み合わせて使えるため、規約をスキルにすれば既存の接続のまま登録のばらつきを減らせます。Aはアクセス手段を増やすだけで、どう登録すべきかという手順の問題は解決しません。Bのカスタム指示はすべての会話に広く適用されるため、タスク登録以外の会話にも規約が影響します。特定のワークフロー向けにはスキルが適しています。Dは貼り付けの漏れや版の違いが生じ、人によるばらつきが残ります。", "source": "https://support.claude.com/ja/articles/12512176-スキルとは何ですか", "created": "2026-11-21"}, {"id": "A4-q017", "statement_id": "A4-3", "pack": "gen", "angle": "troubleshoot", "role": "広報", "scenario": "レビュー必須の組織で、広報担当が「プレスリリース作成」スキルを組織に公開し、公開直後は他部署の利用者も問題なく使えていました。その後、書式の誤りに気づいて自分のスキルを修正しましたが、数日たっても他部署の利用者の出力は修正前の書式のままです。", "question": "原因として最も妥当なものはどれですか。", "choices": {"A": "利用者のメモリに旧書式が蓄積されており、スキルの指示よりも優先されて、以前の書式が再現され続けています。", "B": "修正は担当者の手元にしか反映されておらず、再度公開してレビューで承認されるまで、利用者は承認済みの版を使い続けます。", "C": "組織に公開したスキルは公開時点の内容で固定され、公開後はどのような修正を加えても反映できない仕様になっています。", "D": "利用者側でコード実行が無効になっているため、スキルが読み込まれず、Claudeが従来どおりのプロンプトだけで作成しています。"}, "answer": "B", "select_count": 1, "explanation": "Bが正解です。公開後のスキルは組織によって管理され、更新するには再度公開する必要があります。新しい版も同じレビュープロセスを経て、承認されるまで、利用者は承認済みの版のままです。Aは根拠がありません。公開直後は問題なく動いており、メモリがスキルの指示に優先する仕組みもありません。Cは誤りです。更新できないのではなく、再公開とレビューを経て反映されます。Dは公開直後は問題なく使えていたという状況と矛盾します。コード実行が無効なら、そもそもスキルが動きません。", "source": "https://support.claude.com/ja/articles/12512180-claude-でスキルを使用する", "created": "2026-11-21"}, {"id": "A4-q018", "statement_id": "A4-4", "pack": "gen", "angle": "design-choice", "role": "マーケティング", "scenario": "マーケティング部長が、「キャンペーン効果レポートはClaudeに丸ごと任せ、チームは内容を確認しなくてよいのではないか」と提案しています。導入担当のあなたは、売上CSVからの集計・図表・文章の下書きをClaudeが作成できることを知っています。", "question": "部長への説明として、機能を過大にも過小にも示さない最も適切なものはどれですか。", "choices": {"A": "「Claudeは高精度なので、作成から配布まで任せられます。確認工程は不要で、チームは別の業務に専念できます」", "B": "「Claudeに作れるのは文章の下書きだけです。集計と図表は従来どおり手作業で行い、校正にだけ使いましょう」", "C": "「集計・図表・文章の下書きは大幅に短縮できますが、数値と結論は担当者が確認し、配布の責任は人が負います」", "D": "「Claudeは確認なしでも十分正確です。念のため月に一度だけ抜き取りで確認し、問題が出たら運用を見直します」"}, "answer": "C", "select_count": 1, "explanation": "Cが正しい。AI活用の枠組み（4D）では、何をAIに任せ何を人が担うかを決める「Delegation」と、成果物を確認し責任を負う「Diligence」が求められ、Claudeは集計・図表・下書きを支援できる一方、出力の検証と配布の責任は人に残ると伝えるのが過大にも過小にもならない説明になる。Aは確認を不要とする過大な説明で、誤りを含む資料がそのまま配布される恐れがある。Bはコード実行によるデータ分析やファイル作成ができる点を伝えず、機能を過小に示している。Dは「確認なしでも正確」という過大な期待を与え、事後の抜き取りだけでは配布前の誤りを防げない。", "source": "https://assets.claude.com/4396730ed190e691a3712cf2fd6bfe35509deca2.pdf", "created": "2026-11-21"}, {"id": "A4-q019", "statement_id": "A4-4", "pack": "gen", "angle": "troubleshoot", "role": "人事", "scenario": "人事チームのリーダーが「Claudeは過去の会話をすべて記憶しているので、背景説明は不要」とメンバーに伝えました。その後、Aさんはシークレットチャットで面談準備を依頼し、Bさんは社員の健康上の事情を伝えましたが、どちらも後の会話に引き継がれませんでした。他のメンバーの通常のチャットでは、役割や進行中の案件が引き継がれています。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "メモリは会話の全記録ではなく、シークレットチャットでは使われず、健康などの機密トピックは既定で保存されない点が伝わっていなかった。", "B": "チームのプランではメモリ機能がそもそも提供されておらず、記憶は一切働かない仕組みなのに、リーダーが誤って機能が使えると案内してしまった。", "C": "Claudeの記憶容量が一杯になり、古い会話から順に忘れているため、メモリの上限を増やせば全会話を保持できるようになる。", "D": "AさんとBさんの質問が曖昧だったことが原因で、背景を詳しく書けば機密トピックも含めて自動的にすべて保存される。"}, "answer": "A", "select_count": 1, "explanation": "Aが正しい。メモリはチャット中に個別のトピックとして保存されるもので全記録ではなく、シークレットチャットやメモリをオフにしたチャットでは使われず保存もされない。健康などの機密トピックは既定では保存されない。つまり「すべて記憶している」という説明が過大で、できること・できないことの前提を共有していなかったことが原因である。Bは、他のメンバーのチャットでは引き継ぎが働いており、メモリが使えないという事実と合わない。Cは根拠のない「記憶容量」の説明で、メモリはトピック単位で管理され、設定で表示・編集・削除できる。Dは、背景を書き込んでも機密トピックは本人が設定でオプトインしない限り保存されないため誤り。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A4-q020", "statement_id": "A4-4", "pack": "gen", "angle": "find-error", "role": "プロジェクト管理", "scenario": "プロジェクト管理担当が、会議の議事録を共通の書式に整える「議事録整形Skill」をチームに共有することになり、全社員向けのお知らせ案を書きました。AIにあまり詳しくない部署の人にも読まれるため、Skillでできることとできないことを正しく伝える必要があります。", "question": "お知らせ案の記述のうち、不適切なものはどれですか。", "choices": {"A": "「整形の手順を一度Skillにまとめておけば、関連する依頼のときにClaudeが内容を読み込み、その手順を適用します」", "B": "「共有されたSkillは同僚が有効にして使えますが、内容を編集できるのは作成した人の側になります」", "C": "「出どころの分からないSkillは、有効にする前に、含まれるファイルの中身を読んで内容を確認してください」", "D": "「Skillを使えば議事録の誤りがなくなるため、整形後の内容を担当者が読み直す工程は省略して構いません」"}, "answer": "D", "select_count": 1, "explanation": "Dが不適切。Skillは手順や書式をそろえて一貫性と速度を高めるものだが、出力の正確さを保証するものではなく、内容の確認と責任は人に残る。Skillがあるから確認を省いてよいと伝えるのは機能の過大な説明になる。Aは正しい。Claudeは関連するタスクのときに利用可能なSkillを確認して読み込み、その指示を適用する。Bも正しい。共有されたSkillは受け取った側が有効にして使えるが、閲覧のみで編集はできない。Cも正しい。信頼度の低い出どころのSkillは、有効にする前にバンドルされたファイルの内容を確認することが推奨されている。", "source": "https://support.claude.com/ja/articles/12512180-claude-でスキルを使用する", "created": "2026-11-21"}, {"id": "A4-q021", "statement_id": "A4-4", "pack": "gen", "angle": "tradeoff", "role": "コンサルタント", "scenario": "コンサルタントが、顧客の売上CSVをClaudeのコード実行で分析し、図表入りのレポートを作る提案をしました。顧客側の担当役員は「そんなことまでできるのか。情報が外に漏れないか心配だ」と述べています。短い時間で、期待とリスクの両面を誤解なく伝える必要があります。", "question": "役員への説明として最も適切なものはどれですか。", "choices": {"A": "「分析は隔離された環境で行われるので、漏えいの可能性はゼロです。ネットワークの設定も気にせず全データを渡せます」", "B": "「集計と図表作成は可能です。外部通信を許可しない設定から始め、実行中は動作を見守り、結果は担当者が検証します」", "C": "「機密性が高いため、この提案は取り下げます。AIによるデータ分析は、どのような設定でも顧客データには向きません」", "D": "「予測モデルも作れるため、出た予測は役員会でそのまま結論として示せます。結果の検証は省いても問題ありません」"}, "answer": "B", "select_count": 1, "explanation": "Bが正しい。コード実行ではCSVの集計や図表の作成ができる一方、ネットワークアクセスが有効だとプロンプトインジェクションなどでデータが外部に送られる恐れがあるため、機密性の高い場合は外部通信をオフにして始める段階的な進め方が推奨され、実行中の監視と結果の確認も人が担う。できることとリスクと人の関与を併せて伝えている。Aは「漏えいゼロ」と言い切る過大な説明で、ネットワーク設定次第でリスクが残る。Cは対策を取れば使えるのに可能性を全否定する過小な説明。Dは分析結果の検証を省くよう勧めており、成果物の責任を人が負う前提を欠く。", "source": "https://support.claude.com/ja/articles/12111783-claudeでファイルを作成-編集する", "created": "2026-11-21"}, {"id": "A4-q022", "statement_id": "A4-4", "pack": "gen", "angle": "design-choice", "role": "広報", "scenario": "広報担当が、競合他社が先週行った発表を踏まえたプレスリリース案をClaudeに作らせようとしています。上司は「Claudeは何でも最新の情報まで知っているはずだ」と期待しています。担当者は上司にClaudeの得意なことと限界を説明することにしました。", "question": "上司への説明として最も適切なものはどれですか。", "choices": {"A": "「Claudeは最新情報まで把握しているので、競合の発表を含めた文面を任せられます。出力は一度読めば十分です」", "B": "「Claudeは最新情報を持たないため、プレスリリースの作成には向きません。文面はすべて人が一から書きましょう」", "C": "「内蔵の知識には期限があるので、競合の発表内容は人が手で打ち込む前提にします。資料の読み込みや調査機能による情報の検索はClaudeにはできません」", "D": "「内蔵の知識には期限があるため、最新の事実は資料を渡すか調査機能で調べさせます。文面案は作れても事実確認は人が行います」"}, "answer": "D", "select_count": 1, "explanation": "Dが正しい。Claudeの内蔵知識には知識のカットオフ日があり、それ以降の出来事は組み込まれていない。ただし、資料を渡したり、ウェブ検索をオンにした調査機能で情報を集めさせたりでき、文面の下書きも作れる。その上で、外部に出す文書の事実の確認と責任は人が負う。Aは最新情報を把握しているという過大な期待で、確認も不十分。Bは文面作成の支援や資料・調査の活用という強みを伝えない過小な説明。Cは、調査機能などで情報を集められるのにそれを否定しており、機能を過小に示している。", "source": "https://support.claude.com/ja/articles/11088861-claudeの調査機能を使用する", "created": "2026-11-21"}, {"id": "A4-q023", "statement_id": "A4-4", "pack": "gen", "angle": "troubleshoot", "role": "オペレーション", "scenario": "オペレーション部門でClaudeを導入して3か月が経ちましたが、利用はほとんど広がっていません。導入説明会では「Claudeは質問に文章で答えるチャット相手です」とだけ紹介されました。実際の現場では Excel の集計表や報告用の PowerPoint の作成が多く、コード実行とファイル作成は有効になっていますが、現場は「そういう用途には使えない」と考えています。", "question": "利用が広がらない原因として最も妥当なものはどれですか。", "choices": {"A": "Claudeの文章生成の品質が業務で使うには足りないことが、現場でのExcelやPowerPointの試用を通じて繰り返し確認された結果である。", "B": "導入時の説明が機能を過小に示しており、ファイル作成やデータ分析までClaudeが担えることが現場に伝わっていなかった。", "C": "人による監督の体制が弱く、現場が出力を信用できないため、機能を理解したうえで利用を控えている状態である。", "D": "利用が広がらないのは一時的な現象にすぎず、説明の内容を見直さなくても、時間とともに自然に定着していく。"}, "answer": "B", "select_count": 1, "explanation": "Bが正しい。コード実行とファイル作成が有効なら、ClaudeはExcel・PowerPoint・Word・PDFの作成やCSVのデータ分析を支援できる。それなのに「文章で答えるチャット相手」とだけ説明したため、現場は用途を過小に捉えている。機能を過大にも過小にも示さず、できること（ファイル作成や分析）と、出力の確認は人が行うことを併せて伝えるべきである。Aは試用で品質を確認したという根拠が状況にない。Cは、現場が使わない理由が機能の誤解であることと合わず、監督の弱さを示す事実もない。Dは原因の特定を放棄しており、誤解が解けないまま利用が広がらない。", "source": "https://support.claude.com/ja/articles/12111783-claudeでファイルを作成-編集する", "created": "2026-11-21"}, {"id": "A4-q024", "statement_id": "A4-2", "pack": "gen", "angle": "design-choice", "role": "人事", "scenario": "人事担当が、中途採用の一次選考の流れにClaudeを組み込む案を検討しています。ステップは「応募書類からの経歴の要約」「面接日程の連絡文の作成」「合否の判断と応募者への結果通知」の3つです。合否は応募者の将来に直結し、後から撤回しにくい判断で、社内外から理由の説明を求められることがあります。", "question": "委任の基準に照らして、各ステップの割り当てとして最も適切なものはどれですか。", "choices": {"A": "3つのステップをすべてClaudeが実行します。合否の基準は事前に指示済みなので、人は最終的な結果の件数報告だけを受け取ります。", "B": "要約は人が全件を手作業で担当し、日程連絡と合否の判断はClaudeに任せ、人は採用の最終可否の一覧だけをレビューします。", "C": "要約と日程連絡文はClaudeが実行して人が抜粋を確認し、合否の判断と結果の通知は人が担当し、理由も人が説明できるようにします。", "D": "要約と合否の判定はClaudeの評価点で自動で決め、人は不合格者へ送る通知文の言い回しだけをレビューする運用にします。"}, "answer": "C", "select_count": 1, "explanation": "Cが正解です。経歴の要約や連絡文の作成は、誤りがあっても修正しやすく影響も小さいため、Claudeが実行し人が抜粋で確認する形が適しています。一方、合否の判断は撤回しにくく重要度が高く、応募者への配慮と説明責任が伴うため、人が担当すべきです。Aは基準を指示しても責任を負えない判断までAIに委ねる過度な委任です。Bは、負担の小さい要約を人が抱え、重要な合否判断をAIに任せており、割り当てが逆になっています。Dは合否の実質をAIの点数で決め、人のレビューが通知文の表現に限られるため、判断と説明責任が人に残りません。", "source": "https://assets.claude.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf", "created": "2026-11-21"}, {"id": "A4-q025", "statement_id": "A4-2", "pack": "gen", "angle": "find-error", "role": "マーケティング", "scenario": "マーケティング担当者が、自社SNSアカウントの運用ワークフローにClaudeを組み込む案を作っています。案では、投稿の準備から顧客対応までの各ステップについて、Claudeが実行する範囲と人が担う範囲を割り当てています。投稿は公開された時点で多くの人の目に触れ、完全には取り消せません。", "question": "この案のうち、委任の基準に照らして不適切な割り当てはどれですか。（2つ選択）", "choices": {"A": "過去の投稿の反応データの集計をAIが実行し、担当者は主要な数値を抜き取って確認する", "B": "投稿文の複数案づくりをAIが実行し、担当者が選定して表現を調整してから公開する", "C": "強い不満を訴えるコメントへの返信を、AIが作成してそのまま公開アカウントから自動投稿する", "D": "来月の投稿カレンダーの下書きをAIが実行し、担当者が日程と内容を確認して確定する", "E": "返金や補償をするかどうかの判断をAIが実行し、結果をそのまま顧客に自動で返信する"}, "answer": "C,E", "select_count": 2, "explanation": "正解はCとEです。Cは、公開後に取り消せず、相手の感情への共感や状況に応じた判断が求められる返信を、人の確認なしに自動投稿する点が過度な委任です。下書きはAIに任せてよくても、公開前に人が見る必要があります。Eは、返金や補償の可否という重要で顧客に影響する判断を、AIに決めさせて確認なしに伝える点が誤りです。判断とその説明責任は人が負います。Aは、集計は定型的でやり直しがきき、人が主要な数値を確認しているため適切です。Bは、AIが案を出し、人が選んで調整してから公開するため、人がレビューする形になっていて適切です。Dは、下書きの作成をAIが担い、人が確認して確定するため、可逆性・重要度に見合った割り当てで適切です。", "source": "https://assets.claude.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf", "created": "2026-11-21"}, {"id": "A4-q026", "statement_id": "A4-2", "pack": "gen", "angle": "tradeoff", "role": "コンサルタント", "scenario": "コンサルタントが、顧客に明日の夕方までに提出する月次の販売分析レポートを作成します。作業は、販売データの集計、傾向の文章化、顧客に提案する施策の推奨の3つです。レポートは顧客の次月の予算判断に使われ、内容に誤りがあれば提出後の訂正は難しくなります。", "question": "時間の制約がある中で、委任の基準に照らして適切な進め方はどれですか。（2つ選択）", "choices": {"A": "集計と初稿の作成はAIに任せ、結論に使う主要な数値は人が元データと照合する", "B": "時間がないため初稿をそのまま提出し、誤りは顧客から指摘されたときに直す", "C": "品質を守るため、集計も含めて全工程を人が手作業で行い、Claudeは使わない", "D": "顧客への最終的な推奨内容の決定と、その根拠の説明は、コンサルタント自身が担う", "E": "Claudeに初稿の誤りを自己点検させ、問題なしと返ってきたら人の確認を省く"}, "answer": "A,D", "select_count": 2, "explanation": "正解はAとDです。Aは、集計や初稿づくりは定型的で時間を節約でき、AIに任せる価値が高い一方、顧客の判断に使われる主要な数値は人が元データと照合することで、速さと正確さを両立できます。Dは、推奨内容の決定は重要度が高く、顧客に対する説明責任を伴うため、人が担います。Bは、提出後の訂正が難しいレポートを未確認で出すことになり、人のレビューという責任を放棄しています。Cは、AIに任せてよい定型作業まで人が行う過少な委任で、期限に間に合わない恐れがあります。Eは、AI自身の自己点検は独立した確認にならず、人のレビューの代わりにはなりません。", "source": "https://assets.claude.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf", "created": "2026-11-21"}, {"id": "A4-q027", "statement_id": "A4-2", "pack": "gen", "angle": "design-choice", "role": "オペレーション", "scenario": "オペレーション担当者が、社内の経費精算ワークフローを再設計しています。現状は、経理担当が領収書の確認から費目の判断、承認、支払いまでをすべて手作業で行っており、時間がかかっています。Claudeを使って工数を減らしたいが、支払いは一度実行すると取り消しが難しく、承認には説明責任が伴います。", "question": "委任の基準に照らして、ステップの割り当てとして適切なものはどれですか。（2つ選択）", "choices": {"A": "不正の疑いがある申請について、調査結果から処分の内容までをAIが判断して決定する", "B": "少額で定型的な領収書の費目分類は、AIが実行し、経理担当が抜き取りで確認する", "C": "振込の実行までをAIが行い、取り消しが難しい支払いでも事前の人の確認は省く", "D": "承認者の欄はAIが処理するため空欄にし、問題が出ても責任はAIにあるものとする", "E": "規程に当てはまらない例外申請を認めるかの最終判断は、承認権限のある人が担う"}, "answer": "B,E", "select_count": 2, "explanation": "正解はBとEです。Bは、少額で定型的、かつ誤分類があっても修正しやすい作業で、AIに任せて工数を減らせます。人が抜き取りで確認することで、品質も保てます。Eは、規程にない例外の可否は、状況に応じた判断と説明責任を伴う重要な判断であり、人が担います。Aは、不正の調査や処分は重要度が高く、本人への影響も大きいため、AIに決定を委ねるのは過度な委任です。Cは、取り消しが難しい支払いの前に人の確認を省いており、可逆性の低さを無視しています。Dは、責任はAIには移せず、人が最終的な説明責任を負います。承認者を置かない設計は誤りです。", "source": "https://assets.claude.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf", "created": "2026-11-21"}, {"id": "A5-q001", "statement_id": "A5-1", "pack": "gen", "angle": "design-choice", "role": "広報", "scenario": "広報担当者は、毎回同じ社内ブランドガイド（PDF・40ページ）を参照しながらプレスリリースの下書きを作成しています。現在は作成のたびにチャットへPDFを添付し、トーンの希望も毎回入力しています。作業を繰り返し発生するユースケースとして整えたいと考えています。", "question": "Projectの設定として最も適切なものはどれですか。", "choices": {"A": "ブランドガイドをProjectのナレッジに追加し、指示には役割・文体の方針・出力の形式を書いて、リリースごとにチャットを分ける。", "B": "ブランドガイドの全文をProjectの指示欄に貼り付け、役割や文体の希望もすべて同じ欄にまとめて、ナレッジは使わない。", "C": "ブランドガイドとトーンの希望をアカウント全体の指示に設定し、すべての会話で自動的に参照されるようにする。", "D": "これまでどおり毎回ブランドガイドとトーンの希望をチャットに添付・入力し、Projectは過去の下書きを保管する場所としてのみ使うことにする。"}, "answer": "A", "select_count": 1, "explanation": "正解はA。Projectのナレッジは、チャットを始めるたびに背景として使われる静的な参考資料の置き場で、ブランドガイドのような繰り返し参照する文書に向いています。指示は役割・文体・出力方針といった動作の定義に使うため、役割分担として適切です。Bは参照文書を指示欄に詰め込むため、資料の差し替えや管理がしにくくなります。Cのアカウント全体の指示は無関係な会話にも適用されてしまい、プレスリリース用の設定をProject内に限定できません。Dはせっかくの繰り返しのユースケースにProjectの設定を活かしておらず、毎回の添付と入力の手間と抜け漏れが残ります。", "source": "https://support.claude.com/ja/articles/10185728-claudeのパーソナライゼーション機能を理解する", "created": "2026-11-21"}, {"id": "A5-q002", "statement_id": "A5-1", "pack": "gen", "angle": "troubleshoot", "role": "人事", "scenario": "人事担当者は、新卒採用の面接記録を整理するために、アカウント全体の指示へ「回答は面接評価シートの形式で、評価項目ごとに5段階で書く」と設定しました。その後、就業規則の解釈や社内報の文面について尋ねたところ、これらの回答まで評価シートの形式で返ってくるようになりました。", "question": "この現象の原因として最も妥当なものはどれですか。", "choices": {"A": "就業規則に関する質問は専門性が高いため、使用中のモデルの性能が不足して形式が崩れている。", "B": "ナレッジに保存した資料が多すぎてRAGが働き、評価シートの形式だけが優先して検索されている。", "C": "採用業務に固有の形式をアカウント全体の指示に書いたため、無関係な会話にも適用されている。", "D": "評価シート用のSkillが有効になっているため、他の質問にも自動で読み込まれて動作している。"}, "answer": "C", "select_count": 1, "explanation": "正解はC。アカウント全体の指示は、すべての会話に適用される設定です。特定の業務にだけ必要な形式は、その業務用のProjectの指示に書けば、そのProject内のチャットにだけ適用されます。Aは、形式が一貫して適用されているという症状が、モデルの性能不足とは合いません。BのRAGはナレッジが大きい場合の取得方法であり、指示の適用範囲とは関係がなく、そもそもナレッジを使っているという前提もありません。DのSkillはタスクに関連するときだけ読み込まれる設計のため、無関係な質問にまで形式が及ぶ原因としては妥当ではありません。", "source": "https://support.claude.com/ja/articles/10185728-claudeのパーソナライゼーション機能を理解する", "created": "2026-11-21"}, {"id": "A5-q003", "statement_id": "A5-1", "pack": "gen", "angle": "find-error", "role": "教育", "scenario": "教育機関の教務担当者が、授業準備にClaudeを活用するための運用ルールをチーム向けにまとめています。同僚が書いた4つのルール案のうち、Projectの設定の考え方として誤っているものが1つ含まれています。", "question": "誤りを含むルール案はどれですか。", "choices": {"A": "授業準備用のProjectには教材とルーブリックをナレッジとして置き、指示には役割と文体の方針だけを書く。", "B": "試験問題の作成と保護者面談の記録は作業の流れが無関係でも、履歴を共有できるよう1つのProjectにまとめる。", "C": "全教員が共通で使う採点の手順は、Skillとして整備し、必要なときだけ読み込まれるようにする。", "D": "教材を改訂したときは、Projectのナレッジに残っている古いファイルを新しいものに差し替える。"}, "answer": "B", "select_count": 1, "explanation": "正解はB（誤りを含む案）。Projectは、独自のチャット履歴とナレッジベースを持つ独立したワークスペースです。無関係な作業の流れは別のProjectに分けて分離を保つ必要があり、保護者面談の記録のような個人に関わる内容を試験問題の作成と同じProjectに混ぜるのは不適切です。Aはナレッジと指示の役割分担として適切です。Cは、共通の手順をSkillにして必要なときに読み込ませるという、Skillの使い方に合っています。Dはナレッジを最新に保つための基本的な管理として妥当です。", "source": "https://support.claude.com/ja/articles/9517075-プロジェクトとは何ですか", "created": "2026-11-21"}, {"id": "A5-q004", "statement_id": "A5-1", "pack": "gen", "angle": "design-choice", "role": "コンサルタント", "scenario": "コンサルタントは、競合関係にある3社のクライアントを同時に支援しています。各社には、他社に見せてはならない固有の資料と用語があります。3社に共通の提案書フォーマットと作成手順もあり、どの案件でも同じように使いたいと考えています。", "question": "Projectの構成として最も適切なものはどれですか。", "choices": {"A": "1つのProjectに3社の資料をすべて入れ、指示に「社名を指定されたらその会社の資料だけを参照する」と書く。", "B": "3社分の資料を毎回チャットに添付して案件ごとに入れ替え、共通の手順は毎回プロンプトに書いて指示する。", "C": "クライアントごとにProjectを分けて各社の資料をナレッジに置き、共通の提案書手順はSkillにまとめて使う。", "D": "3社の用語集と資料の要点をアカウント全体の指示に書き、どのチャットでも参照できる状態にしておく。"}, "answer": "C", "select_count": 1, "explanation": "正解はC。Projectは、独自のチャット履歴とナレッジベースを持つ独立したワークスペースなので、クライアントごとに分ければ関連のない作業の流れを分離できます。共通の手順はSkillに切り出せば、各Projectで同じ形式を保てます。Aは同じProject内に3社の資料が混在し、指示だけでは他社の情報の混入を防げません。Bは毎回の入れ替えで漏れや誤添付が起こりやすく、Projectを使う利点も失われます。Dはアカウント全体の指示に機密性の高い情報を書くことになり、すべての会話に3社の情報が混ざるおそれがあります。", "source": "https://support.claude.com/ja/articles/9517075-プロジェクトとは何ですか", "created": "2026-11-21"}, {"id": "A5-q005", "statement_id": "A5-1", "pack": "gen", "angle": "troubleshoot", "role": "オペレーション", "scenario": "オペレーション担当者は、社内マニュアルを50件ほど有料プランのProjectにアップロードしました。ファイル名は「最終版_v2」「新規ドキュメント(3)」などで、内容を示していません。返金手順を尋ねると、関係のないマニュアルの内容で答えることが増えました。", "question": "最初に見直すべき点として最も妥当なものはどれですか。", "choices": {"A": "内容が分かる明確なファイル名に付け直し、質問では特定のマニュアルを名前で指定して検索を絞り込む。", "B": "ナレッジの量が増えるとRAGにより応答品質が必ず下がるため、マニュアルの大半をProjectから削除する。", "C": "ナレッジだけでは手順が読み取れないため、50件のマニュアルをすべて1つのSkillに変換し直す。", "D": "Projectをやめて、各マニュアルの要点を毎回チャットに貼り付ける運用に切り替え、Projectは使わない。"}, "answer": "A", "select_count": 1, "explanation": "正解はA。Projectの知識が大きくなるとClaudeは必要な情報を検索して取得するため、内容が分かる明確なファイル名を付けると正しい情報を見つけやすくなります。質問で特定のドキュメントを名前で指定すれば、検索を絞り込めます。Bは、ナレッジの量が増えても応答品質は維持されるとされており、削除は根拠のない対応です。CのSkillは手順をまとめる仕組みで、大量の参考資料の置き場の問題を解決しません。Dは、繰り返し発生するユースケースに対するProjectの利点を捨てる対応で、原因にも対処していません。", "source": "https://support.claude.com/ja/articles/11473015-プロジェクト向けretrieval-augmented-generation-rag", "created": "2026-11-21"}, {"id": "A5-q006", "statement_id": "A5-2", "pack": "gen", "angle": "design-choice", "role": "オペレーション", "scenario": "運用担当者が、自分専用のProjectで業務の問い合わせに答えるアシスタントを作ろうとしています。参照させたい業務手順書は共有のGoogle Driveにあり、現場の変更に合わせて毎週のように内容が更新されます。", "question": "手順書をProjectのナレッジとして使う方法のうち、最新の内容を保つという点で最も適切なものはどれですか。", "choices": {"A": "手順書が更新されるたびに最新版をダウンロードし、Projectのファイルを差し替えてアップロードし直す。", "B": "Google Driveから手順書をProjectに直接追加し、Drive側の更新がそのまま反映される状態にする。", "C": "手順書の全文をProjectの指示欄に貼り付け、内容が変わるたびに担当者が貼り直して更新する。", "D": "Projectにはナレッジを登録せず、質問のたびに手元にある最新の手順書を新しいチャットへ添付し、その場で参照させて使う。"}, "answer": "B", "select_count": 1, "explanation": "正解はB。Google DriveコネクタでProjectに追加したGoogleドキュメントはDriveから直接同期されるため、頻繁に更新される文書でも常に最新版を参照でき、手作業の差し替えも不要です。Aのアップロードはその時点のコピーで、差し替え忘れが起きると古い手順で回答するリスクが残ります。Cは指示欄を文書の保管場所として使う方法で、手動更新が必要なうえ貼り直しの漏れも起きやすくなります。Dは毎回の添付作業が増えるだけで、Projectによる永続的な参照の利点を捨てており、更新の問題も解決しません。更新頻度が高い情報源はコネクタ、変更の少ない固定資料はアップロードという使い分けが基本です。", "source": "https://support.claude.com/ja/articles/10166901-google-workspace-コネクタを使用する", "created": "2026-11-21"}, {"id": "A5-q007", "statement_id": "A5-2", "pack": "gen", "angle": "troubleshoot", "role": "教育", "scenario": "学校法人の教育担当者が、組織のGoogle WorkspaceアカウントでClaudeにGoogle Driveを接続しようとしました。すると「アクセスがブロックされています：機関の管理者がClaudeをGoogle Driveで確認する必要があります」と表示され、同僚が試しても同じ結果になります。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "対象の研修資料がClaudeの扱えないファイル形式で保存されているため、Drive接続の際の形式チェックで弾かれてしまっている。", "B": "接続に使うClaudeアカウントが、Projectの共有設定でDriveへの編集権限を付与されていない。", "C": "研修資料を保存したフォルダが大きすぎて、Claudeが一度に読み込める量を超えてしまっている。", "D": "Google Workspaceの管理者が、サードパーティアプリであるClaudeを信頼済みアプリに設定していない。"}, "answer": "D", "select_count": 1, "explanation": "正解はD。このメッセージは、組織のGoogle Workspace側でClaudeが信頼済みアプリとして許可されていないときに表示されます。管理者が許可すれば、全員が接続できるようになります。Aはファイル形式の問題で、接続の承認とは別の話です。Bはプロジェクトの共有設定の問題で、Googleアカウントの接続段階で出るメッセージとは無関係です。Cはフォルダ内容の量の問題で、接続そのものが拒否される原因ではありません。個人ではなく全員が同じ症状になっている点も、組織レベルの設定を疑う手がかりです。", "source": "https://support.claude.com/ja/articles/10166901-google-workspace-コネクタを使用する", "created": "2026-11-21"}, {"id": "A5-q008", "statement_id": "A5-2", "pack": "gen", "angle": "find-error", "role": "プロジェクト管理", "scenario": "プロジェクト管理担当者が、仕様変更が頻繁に起きる案件向けのProjectについて、ナレッジの運用ルール案を作りました。目的は、ナレッジを最新で関連性が高く、ノイズのない状態に保つことです。", "question": "運用ルール案のうち、この目的に照らして不適切なものはどれですか。", "choices": {"A": "改訂前の仕様書も参考として残し、どの版が最新かは回答のたびにClaudeの判断に任せる。", "B": "ファイル名を文書の内容と版が分かるものにして、Claudeが正しい文書を見つけやすくする。", "C": "案件に関係する仕様書と議事録を同じProjectにまとめ、案件と無関係な文書は入れない。", "D": "仕様が変わったら旧版を削除して差し替え、ナレッジを見直す日を定期的に設ける。"}, "answer": "A", "select_count": 1, "explanation": "正解はA。旧版が残っていると、Claudeが古い仕様を根拠に回答するおそれがあり、ナレッジのノイズになります。廃止された情報は削除または差し替え、最新版だけを残すのが基本です。Bは明確で分かりやすいファイル名が適切な情報の取得に役立つという考え方に沿っています。Cは関連文書をまとめつつ無関係な内容を入れない運用で、関連性を保ちます。Dは古い情報を放置せず定期的に点検する運用で、最新性の維持に有効です。古い価格表を引用してしまうといった症状も、ナレッジが更新されていないことの典型的な兆候です。", "source": "https://support.claude.com/ja/articles/11473015-プロジェクト向けretrieval-augmented-generation-rag", "created": "2026-11-21"}, {"id": "A5-q009", "statement_id": "A5-2", "pack": "gen", "angle": "tradeoff", "role": "マーケティング", "scenario": "マーケティング担当者が、ある販促キャンペーンに関する顧客からの問い合わせメール十数件を、一度だけ分析したいと考えています。受信箱には他の顧客との機密性の高いやり取りが大量にあり、社内ポリシーはAIに渡すデータを必要最小限にするよう求めています。", "question": "ポリシーを守りながら分析を進める方法として、最も適切なものはどれですか。", "choices": {"A": "Gmailコネクタを接続し、受信箱全体から該当しそうなメールをClaudeに探させて分析する。", "B": "受信箱全体をエクスポートしてProjectにアップロードし、キャンペーン関連の部分を抽出させる。", "C": "対象の問い合わせメールだけを選んで書き出し、そのファイルを今回のチャットにアップロードする。", "D": "チーム全員が使えるようGmailコネクタを組織で有効にし、受信箱の継続的な検索を許可する。"}, "answer": "C", "select_count": 1, "explanation": "正解はC。対象が特定の十数件で一度きりの分析なら、必要なメールだけを選別してアップロードすれば、渡す情報を最小限にでき、無関係な機密情報も混ざりません。Aは接続自体が受信箱全体への手が届く状態を作るため、対象が決まっている一度きりの作業には範囲が広すぎます。Bは受信箱全体をアップロードしており、無関係な機密データとノイズを大量に渡してしまいます。Dは一度きりの作業のために組織全体へ広い権限を開く対応で、必要なサービスだけを接続するという原則から外れます。継続的に最新情報が必要ならコネクタ、範囲が決まった単発の作業なら選別したアップロードが向いています。", "source": "https://support.claude.com/ja/articles/11176164-コネクタを使用してclaudeの機能を拡張する", "created": "2026-11-21"}, {"id": "A5-q010", "statement_id": "A5-2", "pack": "gen", "angle": "design-choice", "role": "コンサルタント", "scenario": "コンサルタントが、クラウド上のNotionに蓄積した案件ノウハウを、PCのブラウザだけでなく通勤中のスマートフォンのClaudeからも検索して使いたいと考えています。Notionはサインインして使うクラウドサービスで、コネクタディレクトリにも掲載されています。", "question": "ノウハウをClaudeから使えるようにする方法として、最も適切なものはどれですか。", "choices": {"A": "Claude Desktopのデスクトップ拡張機能として接続し、ローカルで動かして利用する。", "B": "Notionのページを定期的にPDFで書き出し、Claudeにその都度アップロードして使う。", "C": "自分のPCでMCPサーバーを動かし、スマートフォンのClaudeから同じPCに接続する。", "D": "コネクタディレクトリからNotionのリモートコネクタを接続し、すべての環境で使えるようにする。"}, "answer": "D", "select_count": 1, "explanation": "正解はD。サインインして使うクラウドサービスや、ディレクトリに掲載されているものは、リモートコネクタで接続するのが既定の選択肢です。一度接続すれば、ウェブ、モバイル、Desktopなどどこでも追加設定なしで使えます。Aのデスクトップ拡張機能はDesktopとClaude Codeでのみ動き、ウェブやモバイルでは使えません。Bの書き出しは情報が古くなりやすく、更新のたびに手作業が必要です。Cのローカルで動かす構成もモバイルでは使えず、クラウドサービスをわざわざ手元で経由する理由がありません。デスクトップ拡張機能は、ローカルファイルやlocalhostのデータなど、PC上のものを扱う場合に選びます。", "source": "https://support.claude.com/ja/articles/11725091-デスクトップコネクタとウェブコネクタの使い分け", "created": "2026-11-21"}, {"id": "A5-q011", "statement_id": "A5-2", "pack": "gen", "angle": "troubleshoot", "role": "広報", "scenario": "広報担当者は、Slack、Google Drive、Gmail、カレンダー、社内SaaSなど十数個のコネクタを接続し、ツールアクセスを「常に利用可能」にしています。最近、資料を読み込ませた会話が以前より早く長さの制限に達するようになりました。ここ数か月の変更は、コネクタを追加したことだけです。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "Google Driveの資料が同期のたびに古い版へ戻り、Claudeが同じ内容を何度も読み直している。", "B": "すべてのコネクタが会話の開始時に読み込まれ、その合計が資料やコードに使える余地を圧迫している。", "C": "コネクタがユーザーの権限を超えて社内の情報を取得し、不要な内容が会話に混ざり込んでいる。", "D": "コネクタの数が増えたため、Claudeが処理能力の低い軽量なモデルへ自動的に切り替わっている。"}, "answer": "B", "select_count": 1, "explanation": "正解はB。各コネクタは会話内でスペースを占有し、「常に利用可能」では全コネクタが各会話の開始時に読み込まれます。接続数が増えると、ドキュメントや会話履歴に使える余地が狭まり、会話が長さの制限に早く達します。多くのコネクタを使うなら、必要なものだけを探して読み込むオンデマンドが向いています。Aは同期が最新版を保つ仕組みに反しており、長さの制限とも関係しません。Cはコネクタがユーザー自身の権限を継承する仕組みに反しています。Dはコネクタの数に応じてモデルが切り替わるという仕様はなく、根拠がありません。", "source": "https://support.claude.com/ja/articles/13730515-claudeのツールアクセスを管理する", "created": "2026-11-21"}, {"id": "A5-q012", "statement_id": "A5-3", "pack": "gen", "angle": "design-choice", "role": "オペレーション", "scenario": "カスタマーサポートのチームが、顧客への返信文の下書きをClaudeで作成するProjectを用意しています。どの返信も「お詫び→結論→対応手順→結びの挨拶」の構成と丁寧なトーンにそろえたい一方、問い合わせの内容や顧客の事情は毎回異なります。", "question": "指示の役割分担として最も適切なものはどれですか。", "choices": {"A": "構成とトーンも含めた全条件を、担当者が問い合わせごとにプロンプトへ毎回書き込み、Projectの指示は空のままにします。", "B": "構成・トーン・禁止事項はProjectの指示に書き、問い合わせの内容や顧客の個別事情は、リクエストごとのプロンプトで伝えます。", "C": "過去の顧客名と問い合わせ内容ごとの回答例を、Projectの指示へ個別案件として列挙し、新しい案件のたびに書き足します。", "D": "構成とトーンの指示は、アカウント全体の指示に登録し、Projectを使わないチャットも含めた全会話に適用させます。"}, "answer": "B", "select_count": 1, "explanation": "Bが正解です。Projectの指示は、そのProject内のチャットで常に適用される共通ルールの置き場所で、毎回変わらない構成・トーン・禁止事項に向いています。毎回変わる問い合わせ内容は、リクエストごとのプロンプトで渡すのが役割分担として自然です。Aは共通ルールを担当者が毎回書くことになり、書き漏らしや書き方の違いで出力がばらつきます。Cは案件固有の情報を指示に積み上げるもので、指示が肥大化し、別の顧客の情報が混ざる原因にもなります。Dのアカウント全体の指示はすべての会話に適用されるため、返信文と無関係な用途の会話にまで影響します。", "source": "https://support.claude.com/ja/articles/10185728-claudeのパーソナライゼーション機能を理解する", "created": "2026-11-21"}, {"id": "A5-q013", "statement_id": "A5-3", "pack": "gen", "angle": "troubleshoot", "role": "人事", "scenario": "人事チームが求人票の下書き用Projectを作り、指示には「あなたは経験豊富な採用担当として、良い求人票を作成してください」とだけ書きました。しかし、メンバーが生成した下書きは、見出しの構成、文体、記載項目がチャットごとに大きく異なっています。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "指示が抽象的で、想定する用途や守るべき構成・文体・記載項目といった制約が定義されていないため、出力を均一に保てません。", "B": "Projectに資料が増えてRAGモードに切り替わったため、応答の品質が下がり、形式にもばらつきが出ています。", "C": "チャットごとに会話履歴が別々なので、Projectの指示はメンバー本人のチャットには引き継がれず、適用されていません。", "D": "生成のたびに結果が変わるのはClaudeの仕様なので、指示で出力の形式をそろえようとすること自体が成り立ちません。"}, "answer": "A", "select_count": 1, "explanation": "Aが正解です。永続的な指示で出力を均一に保つには、想定するユースケースと、構成・文体・必須項目などの制約を具体的に書く必要があります。役割を与えただけの指示では、形式の判断がチャットごとの解釈に委ねられます。BのRAGは容量を拡張しつつ応答品質を維持する仕組みで、形式のばらつきの原因ではありません。CのProject指示は、そのProject内のすべてのチャットに適用されます。Dのとおり出力に多少の揺れはあっても、指示で構成や文体をそろえることは可能で、それがProject指示の目的です。", "source": "https://support.claude.com/ja/articles/10185728-claudeのパーソナライゼーション機能を理解する", "created": "2026-11-21"}, {"id": "A5-q014", "statement_id": "A5-3", "pack": "gen", "angle": "find-error", "role": "広報", "scenario": "広報担当者が、プレスリリース下書き用Projectの指示を作成するため、次の4つの記述を書き並べました。このProjectは今後1年間、さまざまな発表で繰り返し使う予定で、出力の形式や表記は常に同じにそろえたいと考えています。", "question": "Projectの指示に入れるべきではない記述はどれですか。", "choices": {"A": "リリースは結論を冒頭に置き、見出し付きの短い段落で構成する。社外の読者が初見でも理解できる平易な語を使う。", "B": "社名は正式名称で統一して表記する。競合他社への言及や、他社製品との優劣を断定する表現は使わない。", "C": "根拠が確認できていない事実は断定せず、文中に〔要確認〕と明記して、担当者が公開前に必ず裏付けを取れるようにする。", "D": "今月15日発表の新製品Xの仕様と価格を前提に、発表の背景や狙いを記述する。以降のリリースもこの内容に沿って書く。"}, "answer": "D", "select_count": 1, "explanation": "Dが正解（入れるべきでない記述）です。特定の発表に固有の日付・製品・仕様は、毎回変わるため、リクエストごとのプロンプトで渡す情報です。Projectの指示に書くと、後日の別の発表でも古い製品情報を前提にした下書きが出る原因になります。A・B・Cは、構成、表記の統一、禁止事項、未確認事項の扱いといった、どの発表でも変わらない共通ルールです。これらは永続的な指示に書くのが適切で、出力の均一性を保つ助けになります。", "source": "https://support.claude.com/ja/articles/9517075-プロジェクトとは何ですか", "created": "2026-11-21"}, {"id": "A5-q015", "statement_id": "A5-3", "pack": "gen", "angle": "tradeoff", "role": "マーケティング", "scenario": "マーケティングチームのProjectでは、全員が使うブランドのトーンと用語ルールをそろえたいと考えています。一方、月に1回だけ一部のメンバーが行う広告効果の分析レポート作成には、長く細かい手順があります。チームは、Projectの指示を簡潔に保ちたい意向です。", "question": "この状況で最も適切な設計はどれですか。", "choices": {"A": "トーンと用語に加えて月次レポートの長い手順もすべてProjectの指示に書き、どのチャットでも毎回読み込まれるようにします。", "B": "トーン・用語・月次手順のいずれも書かず、各メンバーが自分のプロンプトで必要なときに都度、思い出して書くようにします。", "C": "トーンと用語はProjectの指示に書き、月次レポートの手順はスキルにまとめて、該当する作業のときにだけ適用されるようにします。", "D": "月次レポートの長い手順はアカウント全体の指示に書き、チームの全員のすべての会話で、いつでも参照されるようにします。"}, "answer": "C", "select_count": 1, "explanation": "Cが正解です。Projectの指示はそのProjectのチャットで常に読み込まれるため、全員に共通のトーンと用語に向いています。一方、特定の作業だけに使う長い手順は、必要なときだけ読み込まれるスキルが適しており、指示を簡潔に保てます。Aは月に1回しか使わない長い手順を常時読み込ませ、他の作業の出力にも影響しかねません。Bは共通ルールまで個人の記憶と書き方に任せるので、出力の均一性が失われます。Dのアカウント全体の指示はすべての会話に広く適用されるため、特定のワークフロー向けの手順を置く場所としては不適切です。", "source": "https://support.claude.com/ja/articles/12512176-スキルとは何ですか", "created": "2026-11-21"}, {"id": "A5-q016", "statement_id": "A5-3", "pack": "gen", "angle": "design-choice", "role": "教育", "scenario": "高校教員が、Claudeの説明を「専門用語を避けて平易に、最後に確認問題を1問添える」という自分の好みにそろえたいと考えています。さらに、中学3年生向けの進路面談資料を作るProjectでは、学年に固有の注意点を守らせたいと考えています。", "question": "指示の置き場所として最も適切なものはどれですか。", "choices": {"A": "平易な説明スタイルも学年固有の注意点も、すべてのProjectの指示へ同じ内容をコピーして登録し、重複を許容して運用します。", "B": "学年固有の注意点も含め、すべての指示をアカウント全体の指示に集約し、どの用途の会話でも同じ内容が適用されるようにします。", "C": "平易な説明スタイルはリクエストごとのプロンプトだけで伝え、学年固有の注意点はアカウント全体の指示に登録します。", "D": "平易な説明スタイルはアカウント全体の指示に登録し、学年固有の注意点は進路面談資料のProjectの指示に登録します。"}, "answer": "D", "select_count": 1, "explanation": "Dが正解です。アカウント全体の指示はClaudeとのすべての会話に適用されるため、個人の一般的な好みや説明スタイルに向いています。Projectの指示はそのProject内のチャットだけに適用されるため、中学3年生向け資料に固有の注意点を置くのに適しています。Aは共通の好みを各Projectに重複して書くため、更新漏れで不一致が生じます。Bは学年固有の注意点が、無関係な会話にまで適用されてしまいます。Cは毎回変わらない好みをプロンプトに頼るため書き漏らしが起きやすく、さらにプロジェクト固有の注意点を全会話に広げる配置が逆になっています。", "source": "https://support.claude.com/ja/articles/10185728-claudeのパーソナライゼーション機能を理解する", "created": "2026-11-21"}, {"id": "A5-q017", "statement_id": "A5-3", "pack": "gen", "angle": "troubleshoot", "role": "プロジェクト管理", "scenario": "プロジェクト管理チームの議事録用Projectでは、複数のメンバーが半年かけて指示を書き足してきました。最近、同じ会議メモを渡しても、要約が数行で終わる日と、詳細に網羅した長文になる日が混在します。指示には「必ず3行以内に要約する」と「決定の経緯は漏れなく詳細に記録する」が併記されています。", "question": "出力が安定しない原因として最も妥当なものはどれですか。", "choices": {"A": "指示の文章が長くなったため、Claudeがその一部を無作為に読み飛ばしていて、特定の行だけが毎回無視されています。", "B": "Projectの指示は編集のたびに別バージョンとして保存されるので、過去の版がチャットごとに適用されています。", "C": "指示の中に両立しない制約が同居しており、どちらを優先するかが決まっていないため、チャットごとに解釈が分かれています。", "D": "議事録の用途では、要約の長さを指示で制御できないため、メンバーが毎回プロンプトで細かく指定する必要があります。"}, "answer": "C", "select_count": 1, "explanation": "Cが正解です。「3行以内」と「漏れなく詳細に」は両立しにくい制約で、優先順位も書かれていないため、チャットごとに解釈が揺れます。永続的な指示では、想定するユースケースと制約を整合させ、衝突しうる場合は優先順位や例外条件を明記する必要があります。Aは、指示が長いだけで無作為に読み飛ばされるという根拠がなく、症状の説明としても不自然です。Bは、Projectの指示が現在の内容でそのProjectのチャットに適用される点と合いません。Dは、長さや形式を指示で定めること自体が、Projectの指示の本来の役割です。", "source": "https://support.claude.com/ja/articles/10185728-claudeのパーソナライゼーション機能を理解する", "created": "2026-11-21"}, {"id": "A5-q019", "statement_id": "A5-4", "pack": "gen", "angle": "find-error", "role": "マーケティング", "scenario": "マーケティング担当者のProjectには、Google Driveから追加した「キャンペーン運用ガイド」のGoogleドキュメントが入っています。ガイドは先週Drive上で全面改訂されましたが、Claudeの提案には改訂前の運用ルールが混じるようになりました。チームは原因の切り分け案を出し合っています。", "question": "切り分けの進め方として、不適切なものはどれですか。", "choices": {"A": "Projectに旧版のPDFなど改訂前の資料が併存していないかを確認する。", "B": "Drive上で更新したため、追加済みのドキュメントは削除して追加し直す。", "C": "Projectの指示に、改訂前のルールを前提とした記述が残っていないか見直す。", "D": "出力を改訂後のガイドと照合し、どの層の情報が原因かを切り分ける。"}, "answer": "B", "select_count": 1, "explanation": "正解（誤り）はB。Google Driveから追加したGoogleドキュメントはDriveと同期され、更新後も最新版で参照されます。そのため追加し直しは不要で、原因の切り分けにもなりません。Aは旧版ファイルがナレッジに残っていれば古い内容を拾うため、有効な確認です。Cは指示に古い前提が残っていると出力に影響するため妥当です。Dは出力と現行ガイドの照合で、どのレイヤーが原因か特定する基本手順であり適切です。", "source": "https://support.claude.com/ja/articles/10166901-google-workspace-コネクタを使用する", "created": "2026-11-21"}, {"id": "A5-q020", "statement_id": "A5-4", "pack": "gen", "angle": "tradeoff", "role": "オペレーション", "scenario": "オペレーション担当者の週次レポート用Projectで、数週間前から出力の粒度や口調が安定しなくなりました。指示・ナレッジ・メモリのどこが原因か分からず、今週のレポートも早く仕上げる必要があります。担当者は、元のProjectは壊さずに原因を絞り込みたいと考えています。", "question": "時間とリスクの制約下で、最初の一手として最も適切なものはどれですか。", "choices": {"A": "新しいチャットでメモリをオフにして同じ依頼を実行し、元の出力と比較する。", "B": "すべてのメモリをリセットしたうえで、指示とナレッジも作り直す。", "C": "Projectを削除して作り直し、指示とナレッジを一から再登録する。", "D": "指示文を全面的に書き直し、出力が安定するかを数週間かけて観察する。"}, "answer": "A", "select_count": 1, "explanation": "正解はA。メモリを単一チャットだけオフにして同じ依頼を試せば、他のチャットや保存済みメモリに影響を与えずに、メモリが原因かどうかを切り分けられます。Bのメモリのリセットはプロジェクトメモリを含め元に戻せず、原因が不明な段階で行うのはリスクが高すぎます。Cは原因が分からないまま全体を作り直すため、時間もかかり再発の学びも残りません。Dは複数要因を同時に変えるうえ、観察に時間がかかり今週の締め切りに間に合いません。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A5-q021", "statement_id": "A5-4", "pack": "gen", "angle": "design-choice", "role": "プロジェクト管理", "scenario": "プロジェクト管理担当者は、顧客Aの契約案件専用のProjectを使っています。最近、他の案件で話した別顧客の方針や用語がこのProjectの回答に混ざるようになりました。このProjectの作業は、他の作業の文脈から切り離しておく必要があります。", "question": "回答の混在を解消するために、最も適切な対応はどれですか。", "choices": {"A": "Projectの指示に「他の案件の情報は使わないこと」と1行追記して様子を見る。", "B": "アカウント全体のメモリをリセットし、すべてのProjectの記憶を消去する。", "C": "Projectのメモリ設定で「アカウントメモリを使用」をオフにして分離する。", "D": "別顧客の案件に関する資料をナレッジからすべて削除して入れ直す。"}, "answer": "C", "select_count": 1, "explanation": "正解はC。Projectのメモリは他のProjectのメモリとは分離されますが、既定ではプロジェクト外のチャットのメモリが併用されます。「アカウントメモリを使用」をオフにすると、Projectのメモリを完全に分離できます。Aは指示で抑制しようとするだけで、混入元であるメモリのレイヤーを直しておらず確実性がありません。Bはプロジェクトメモリを含む全メモリが元に戻せず削除され、過剰な対応です。Dは混在の原因がナレッジではないため、的外れです。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A5-q022", "statement_id": "A5-4", "pack": "gen", "angle": "troubleshoot", "role": "コンサルタント", "scenario": "コンサルティングチームは、同僚が作成して共有した報告書作成Skillを全員で使っています。月曜から、誰も設定を変えていないのに、報告書の構成と文体が以前と変わったとの声が複数のメンバーから上がりました。共有されたSkillは受信者側では編集できません。", "question": "変化の原因として最も妥当なものはどれですか。", "choices": {"A": "各メンバーのProjectの指示が、Skillの設定によって上書きされた。", "B": "作成者がSkillを更新し、次回使用時に更新後のバージョンが適用された。", "C": "メンバーが過去のチャットを検索したため、古い報告書の文体を再現した。", "D": "Skillを使い続けるうちに、Skillの内容が利用者の入力から自動で学習された。"}, "answer": "B", "select_count": 1, "explanation": "正解はB。共有されたSkillは受信者には閲覧のみで、作成者が後から更新すると、受信者は次の使用時に自動で更新後のバージョンを取得します。全員に同時期に起きた変化は、共有元のSkillのバージョンを疑うべきです。Aは根拠がなく、SkillがProjectの指示を上書きするとは説明されていません。Cは全員に同時に起きる説明になりません。Dは利用者の入力でSkillが自動的に書き換わる仕組みはなく、誤りです。", "source": "https://support.claude.com/ja/articles/12512180-claude-でスキルを使用する", "created": "2026-11-21"}, {"id": "A5-q023", "statement_id": "A5-4", "pack": "gen", "angle": "find-error", "role": "人事", "scenario": "人事チームは、同僚が作成して共有した「入社案内文Skill」を使い、Projectで新入社員向けの案内文を作成しています。先週から案内文に必須の連絡先セクションが抜けるようになりましたが、Projectの指示とナレッジは編集されていません。チームは、出力が変化した原因のレイヤーを切り分けようとしています。", "question": "原因の切り分けに関する考え方として、誤っているものはどれですか。（2つ選択）", "choices": {"A": "Skillは更新しても利用者側に反映されないので、Skillは出力変化の原因候補から外して他のレイヤーだけを調べればよい。", "B": "共有されたSkillは、作者が更新すると利用者が次に使うときに更新版を取得するため、Skillの変更も出力変化の原因になりうる。", "C": "指示とナレッジが未編集でも、Skillの更新履歴と更新者を確認し、出力が変わった時期と照らし合わせるのは有効な切り分けである。", "D": "組織に公開されたSkillは、新しい版が承認されるまで利用者は承認済みの版を使い続けるため、公開の審査が版の切り替わりを管理する。", "E": "原因のレイヤーを特定する前に、指示・ナレッジ・メモリを一度にすべて作り直せば、どこが原因でも確実に回復できるので最も効率的である。"}, "answer": "A,E", "select_count": 2, "explanation": "Aは誤り。共有Skillは作者の更新が次の使用時に自動で反映されるため、未編集の指示やナレッジだけを見てSkillを除外すると原因を見逃します。Eも誤り。レイヤーを特定せず全部を作り直すと、何が原因だったか分からず、有用な設定まで失い、再発の防止にもなりません。Bは正しく、Skillの更新が出力変化の原因になりうる点を述べています。Cも正しく、更新履歴と変化の時期を突き合わせるのは妥当な切り分けです。Dも正しく、組織公開のSkillは更新の承認まで承認済みの版が使われ続けるため、版の変更は審査を通じて管理されます。", "source": "https://support.claude.com/ja/articles/12512180-claude-でスキルを使用する", "created": "2026-11-21"}, {"id": "A5-q024", "statement_id": "A5-4", "pack": "gen", "angle": "tradeoff", "role": "マーケティング", "scenario": "マーケティング担当者のProjectには、半年前にアップロードしたブランドガイドラインのPDFがあります。最近ガイドライン本体はGoogle Drive上のGoogle Docsで改訂されましたが、Claudeの下書きは改訂前の語調のままです。キャンペーン案の提出は明日で、指示は編集されておらずSkillも変更されていません。", "question": "時間が限られる中で、原因への対処と回復の確認として適切なものはどれですか。（2つ選択）", "choices": {"A": "旧PDFはProjectに残したまま、依頼のたびに「最新の語調を優先すること」とプロンプトに書き添えて、毎回指定して対応する。", "B": "改訂後の語調ルールの全文をProjectの指示に貼り付ける。ナレッジの旧PDFはそのまま残して、指示側を正とする運用に切り替える。", "C": "旧PDFをProjectから外し、改訂済みのGoogle DocsをDriveから追加して、Projectの情報源が最新版と同期される状態にする。", "D": "語調が古いのはメモリの蓄積が原因とみなして、すべてのメモリをリセットしたうえで、旧PDFの扱いは後日あらためて検討する。", "E": "設定の修正後に、改訂前後で差が出やすい代表的な依頼を数件再実行し、下書きが改訂後の語調に戻ったかを提出前に確認する。"}, "answer": "C,E", "select_count": 2, "explanation": "Cは正しく、古い情報源がナレッジに残っていることが原因なので、旧版を外して最新版と同期される文書に差し替えれば根本から解消します。Eも正しく、修正後に代表的な依頼で再実行し、回復を確認してから提出するのが期限内でも確実です。Aは誤り。旧PDFが残ったままでは古い情報が参照され続け、毎回の指定も漏れやすくなります。Bも誤り。同じ内容が指示とナレッジに分かれて二重管理になり、将来また食い違います。Dも誤り。症状はナレッジの鮮度を示しており、メモリを全消去しても原因は残り、必要な記憶も失います。", "source": "https://support.claude.com/ja/articles/10166901-google-workspace-コネクタを使用する", "created": "2026-11-21"}, {"id": "A5-q025", "statement_id": "A5-4", "pack": "gen", "angle": "design-choice", "role": "教育", "scenario": "研修部門の「講座資料作成Project」は、半年運用するうちに四半期ごとに出力の質が落ち、そのたびに担当者が場当たり的に直しています。Projectには指示、ナレッジ、Skill、メモリがあり、誰がいつ何を変更したかの記録はありません。部門は、劣化を早期に見つけて回復できる継続的な運用を整えたいと考えています。", "question": "運用の仕組みとして最も適切なものはどれですか。（2つ選択）", "choices": {"A": "品質が落ちるたびに新しいProjectを作り、過去の指示・ナレッジ・メモリをすべて破棄して、毎回ゼロから設定し直す運用にする。", "B": "指示・ナレッジ・Skill・メモリの各レイヤーに担当者と見直し時期を決め、変更の内容と日付を記録して、変化の原因をたどれるようにする。", "C": "メモリは多いほど精度が上がるので、あらゆる会話から蓄積させ、内容の確認や不要な項目の削除は行わない方針にする。", "D": "代表的な依頼を数件固定した評価用セットを用意し、設定の変更後と定期的に実行して、以前の良好な出力と比較する。", "E": "劣化はモデルの性能不足が原因とみなして、設定の見直しは行わず、品質が落ちたら上位のモデルへ切り替える運用にする。"}, "answer": "B,D", "select_count": 2, "explanation": "Bは正しく、レイヤーごとの担当と変更履歴があれば、出力が変化したときに原因のレイヤーを特定でき、定期的な見直しで劣化も防げます。Dも正しく、固定した評価用の依頼を実行して以前の出力と比べれば、劣化を早期に検知し、回復したかも確認できます。Aは誤り。設定を丸ごと破棄すると有用な指示やナレッジも失い、原因も分からないままです。Cも誤り。蓄積したメモリは古い情報や別の案件の内容を含んで劣化の原因になるため、確認と整理が必要です。Eも誤り。モデルの切り替えは、古いナレッジや蓄積したメモリなど設定レイヤーの問題を解決しません。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A6-q001", "statement_id": "A6-1", "pack": "gen", "angle": "design-choice", "role": "人事", "scenario": "人事担当者が、新卒採用の応募書類をClaudeに読み込ませて合格可能性の順位を出させ、上位の応募者だけを面接に進める運用を提案しています。下位の応募者の書類は、人が見ないまま不合格になります。", "question": "この提案を「適切」「安全策を講じれば適切」「不適切」に分類するとき、最も妥当な判断はどれですか。", "choices": {"A": "適切です。Claudeは書類を公平に読めるため、順位を根拠に下位の応募者を人が見ずに不合格とする運用でも問題ありません。", "B": "不適切です。採用業務でAIを使うこと自体が利用ポリシーで一律に禁じられており、書類の整理や要約にも使えません。", "C": "安全策を講じれば適切です。採用判断に責任を持つ担当者が順位を実質的に見直して変更でき、応募者にAI利用を伝えます。", "D": "安全策を講じれば適切です。選考基準をプロンプトに明記して順位を応募者に知らせれば、人による確認は省略できます。"}, "answer": "C", "select_count": 1, "explanation": "採用の選考・順位付け・不合格の決定は、利用ポリシーが定める高リスク用途（雇用）にあたり、一律に禁止ではなく、要件を満たせば使えます。要件は、資格や経験を持つ担当者が出力を実質的に確認し、変更する権限を持つこと、そして判断の対象となる人にAIが使われたことを明示することです。したがってCが正解です。Aは、人が見ないまま不合格にする点が要件を満たしません。Bは、採用業務でのAI利用を一律禁止と誤解しており、要件を満たせば利用できます。Dは、基準を明記しても、人による実質的な確認の代わりにはなりません。", "source": "https://www.anthropic.com/legal/aup", "created": "2026-11-21"}, {"id": "A6-q002", "statement_id": "A6-1", "pack": "gen", "angle": "troubleshoot", "role": "コンサルタント", "scenario": "経営コンサルタントが、個人事業主のクライアントについて、確定申告でどの経費を控除すべきかをClaudeに判断させ、出力をほぼそのままメールで送付しました。後日、税理士から、一部の控除は認められない可能性があると指摘されました。", "question": "今回の運用の問題点として最も妥当なものはどれですか。", "choices": {"A": "個人の税務に関する助言は高リスク用途にあたるのに、有資格者による実質的な確認と、AIを使った旨のクライアントへの開示がなかった。", "B": "Claudeに税務の質問をすること自体が利用ポリシーで全面的に禁じられており、一般的な制度の説明を求める使い方も含めて、どのような場合も許されない。", "C": "プロンプトにクライアントの業種や収入の情報が不足していただけで、詳しく入力すれば確認なしで送付しても問題はなかった。", "D": "原因は学習データが古いことだけであり、最新情報を検索させれば高リスク用途の要件は満たされ、人の確認は不要になる。"}, "answer": "A", "select_count": 1, "explanation": "特定の個人の税務について、何を控除・申告すべきかを助言することは、利用ポリシー上の高リスク領域（金融・税務）です。この場合、有資格者が出力を実質的に確認して責任を負うこと、助言を受ける人にAIが使われたことを開示することが求められます。Aはこのどちらもなかったことを指摘しており正解です。Bは誤りで、制度の一般的な説明は高リスクの対象外です。Cは、情報を増やしても確認の要件はなくなりません。Dは、情報の鮮度を上げても人による確認の要件は代替できません。", "source": "https://www.anthropic.com/legal/aup", "created": "2026-11-21"}, {"id": "A6-q003", "statement_id": "A6-1", "pack": "gen", "angle": "find-error", "role": "広報", "scenario": "広報担当者が、新サービスの発売に合わせ、「実際の利用者」を名乗る複数の架空の人物像でClaudeに好意的な口コミを書かせ、レビューサイトやSNSに投稿する案を出しました。投稿前には担当者が全文を確認する予定です。", "question": "この案のどこが最も問題ですか。", "choices": {"A": "口コミの文面が不自然になりやすい点が問題で、実在の口コミに近い表現に整えれば、安全策を講じたうえで実施できる。", "B": "投稿前の確認が担当者1人では不十分な点が問題で、複数名で内容を確認する体制にすれば適切な運用になる。", "C": "口コミがAI生成であると小さく注記していない点が問題で、注記を付ければ架空の利用者名での投稿も認められる。", "D": "実在の利用者を装い評判の広がりを偽る点が問題であり、人が確認しても解消されないため、この用途自体が不適切である。"}, "answer": "D", "select_count": 1, "explanation": "実在の人物や利用者を装った偽のレビューや、架空のアカウントによる評判の水増しは、利用ポリシーが禁じる欺瞞的な行為にあたります。問題は文面や確認体制ではなく、誰が言っているのかを偽る点にあるため、安全策では適切になりません。したがってDが正解です。Aは文面を整えても偽装という本質が変わりません。Bは、確認者を増やしても偽装は解消されません。Cは、注記を付けても、実在の利用者を装う点は変わりません。", "source": "https://www.anthropic.com/legal/aup", "created": "2026-11-21"}, {"id": "A6-q004", "statement_id": "A6-1", "pack": "gen", "angle": "tradeoff", "role": "オペレーション", "scenario": "カスタマーサポート部門が、製品の使い方や注文状況に関する一般的な問い合わせに自動で答える外部向けチャットボットをClaudeで構築します。契約変更や返金可否のような個別の判断は扱わず、人のオペレーターに引き継ぎます。リスクを抑えつつ、運用の負荷も小さくしたいと考えています。", "question": "利用ポリシーの観点で、この運用に最低限必要な安全策はどれですか。", "choices": {"A": "顧客への回答をすべて、送信前に人のオペレーターが1件ずつ読んで承認してから返す体制にする。", "B": "各チャットの冒頭、または画面上で、顧客に対してAIと対話していることを明示する。", "C": "親しみやすさを優先して人間のオペレーターの名前とアイコンを使い、AIかどうかは聞かれた時のみ答える。", "D": "顧客の個人情報を含む問い合わせはすべて、入力する前に社内で匿名化してから扱うようにする。"}, "answer": "B", "select_count": 1, "explanation": "顧客と直接やり取りするチャットボットは、利用ポリシー上、AIと対話していることを最低でも各チャットの冒頭か画面上で開示する必要があります。個別の判断を扱わない一般的な問い合わせ対応では、高リスク用途の人による事前承認は求められません。したがってBが正解です。Aは、必要以上に重い運用で、最低限の安全策ではありません。Cは、人と誤認させる設計で、開示の要件に反します。Dは、個人情報の扱いは別の検討事項であり、このユースケースで必ず必要な策とはいえません。", "source": "https://www.anthropic.com/legal/aup", "created": "2026-11-21"}, {"id": "A6-q005", "statement_id": "A6-1", "pack": "gen", "angle": "design-choice", "role": "教育", "scenario": "学校の教務担当者が、授業改善のため、オンライン授業中の生徒のカメラ映像から表情を分析し、集中度や感情の状態をClaudeに推定させて教員に通知するツールを検討しています。", "question": "この提案の分類として最も妥当なものはどれですか。", "choices": {"A": "安全策を講じれば適切です。保護者から書面で同意を得たうえで、授業改善の目的に限って使えば実施できます。", "B": "適切です。教員が通知を参考情報として確認するだけで、成績評価や指導には使わなければ、特に問題はありません。", "C": "安全策を講じれば適切です。映像は匿名化して氏名を伏せたうえで、集計した結果だけを教員に通知すれば実施できます。", "D": "不適切です。人の感情を推定するシステムは医療や安全の目的を除いて認められず、同意や運用の工夫では適切になりません。"}, "answer": "D", "select_count": 1, "explanation": "利用ポリシーは、医療または安全上の理由を除き、人の感情を推定する感情認識システムの構築や支援を禁じています。授業改善はこの例外にあたらず、同意の取得や匿名化、用途の限定といった安全策では適切になりません。したがってDが正解です。Aは、保護者の同意があっても禁止の対象であることは変わりません。Bは、結果の使い道を限定しても、感情を推定する行為自体が問題です。Cは、匿名化や集計をしても、感情推定という用途そのものは変わりません。", "source": "https://www.anthropic.com/legal/aup", "created": "2026-11-21"}, {"id": "A6-q006", "statement_id": "A6-1", "pack": "gen", "angle": "troubleshoot", "role": "プロジェクト管理", "scenario": "プロジェクト管理者が、Claudeに社内の共有ドライブとメールのコネクタを接続し、毎週の進捗報告を作成して取引先へ自動送信するよう設定しました。ある週、別案件の社外秘資料の内容が取引先に送られました。送信前の確認工程は設けていませんでした。", "question": "この問題の原因として最も妥当なものはどれですか。", "choices": {"A": "外部送信という取り消せない操作まで人の承認なしに委任し、Claudeが参照・送信できる範囲も絞っていなかった。", "B": "エージェントの動作の責任はAnthropicにあるため、Claudeの誤動作を報告すれば、利用者側の過失は問われない。", "C": "共有ドライブとメールのコネクタを同時に接続すること自体が利用ポリシーで禁じられており、設定が許されない。", "D": "週次報告のような定型業務をClaudeに任せること自体が不適切であり、そもそも委任の対象にすべきではなかった。"}, "answer": "A", "select_count": 1, "explanation": "利用ポリシーでは、エージェントがツールや接続先のシステムを通じて行う行動についても、構築・運用した利用者が責任を負います。外部への送信は取り消せない操作であり、人の承認や、参照・送信できる範囲の限定といった委任の限界を設けるべきでした。したがってAが正解です。Bは、責任の所在が逆です。Cは、コネクタの併用が禁じられているわけではありません。Dは、定型の報告作成自体は委任に適しており、問題は送信の権限と確認の設計にあります。", "source": "https://www.anthropic.com/legal/aup", "created": "2026-11-21"}, {"id": "A6-q007", "statement_id": "A6-3", "pack": "gen", "angle": "design-choice", "role": "人事", "scenario": "人事担当者が、応募者200人の履歴書をClaudeに読み込ませ、評価点の高い順に20人だけを面接に進める運用を始めました。評価点を見直す人はおらず、不採用の応募者にはAIを使ったことを伝えていません。組織のAIポリシーは、採用の判断にAIを使う場合、資格のある担当者によるレビューと本人への開示を条件としています。", "question": "ギャップを解消する是正措置として最も適切なものはどれですか。", "choices": {"A": "担当者が評価点を見直して変更できる手順を設け、応募者にはAIを選考に使ったことを伝えます。", "B": "評価基準をプロンプトに詳しく書き直し、Claudeの順位は従来どおりそのまま使い続けて運用を効率化します。", "C": "面接に進める人数を増やして不採用者を減らし、AIの評価による影響を小さくしたうえで運用を続けます。", "D": "氏名と年齢を削除した履歴書をClaudeに渡す運用にすれば、応募者へのAI利用の開示は省いても構いません。"}, "answer": "A", "select_count": 1, "explanation": "採用の可否に関わる判断は、Anthropicの利用ポリシーでも高リスクの用途とされ、権限を持つ資格のある担当者による実質的なレビューと、対象者へのAI利用の開示が求められます。組織のポリシーもこれと同じ条件を定めており、Aはレビューの欠如と開示の欠如の両方を解消します。Bは基準を精緻にしても人によるレビューがないままで、ギャップが残ります。Cは人数を増やしても、AIの順位に頼った判断と開示の欠如は変わりません。Dは識別情報を減らしても、AIが選考に関わったという事実の開示義務はなくならず、人によるレビューも欠けたままです。", "source": "https://www.anthropic.com/legal/aup", "created": "2026-11-21"}, {"id": "A6-q008", "statement_id": "A6-3", "pack": "gen", "angle": "troubleshoot", "role": "広報", "scenario": "広報部のポリシーは「AIが作成した文章は、事実と引用を人が確認してから公開する」と明確に定めています。ところが新任の担当者2名が、Claudeの下書きを確認せずにプレスリリースへ使いました。聞き取りでは「どう確認すればよいか分からなかった」と答えており、他のメンバーは手順どおりに確認しています。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "ポリシーに確認の義務を定めた条文が不足しているため、規定を追加して、内容を厳格にすることが最優先です。", "B": "担当者が意図的にポリシーへ違反しているため、広報部の全メンバーからClaudeの利用権限を取り上げるべきです。", "C": "ポリシーは明確で、確認の具体的な方法を学ぶ機会がなかったトレーニングのギャップであり、研修で補うべきです。", "D": "Claudeの下書きの質が低いことが原因なので、より高性能なモデルに切り替えれば人による確認は不要になります。"}, "answer": "C", "select_count": 1, "explanation": "ポリシーは確認義務を明確に定めており、他のメンバーは守れているため、ポリシーのギャップではありません。新任者は確認の方法が分からなかったと答えており、これはトレーニングのギャップです。研修やOJTで検証の手順を身につけてもらうのが適切な是正です。Aは、すでに明記されている義務を追加しても原因に対処できません。Bは、聞き取りから意図的な違反とは言えず、全員の権限を奪うのは過剰です。Dは、モデルを変えても公開前に人が責任を持って確認する必要性はなくならず、問題の原因でもありません。", "source": "https://assets.claude.com/4396730ed190e691a3712cf2fd6bfe35509deca2.pdf", "created": "2026-11-21"}, {"id": "A6-q009", "statement_id": "A6-3", "pack": "gen", "angle": "find-error", "role": "マーケティング", "scenario": "マーケティング部が、自社サイトの問い合わせ窓口にClaudeを使った対話ボットを導入する計画を立てました。社内ポリシーは、外部の顧客と直接やり取りするAIには、AIであることの明示を求めています。ポリシー担当者が計画案をレビューしています。", "question": "計画案のうち、ポリシーに照らして不適切なものはどれですか。", "choices": {"A": "回答の品質を確認するため、会話の一部を毎週無作為に抽出して、担当者が内容を点検し、結果を改善に反映する運用を行います。", "B": "親しみやすさを優先して人間のスタッフ「ミカ」と名乗らせ、AIであることは利用者に伝えないようにします。", "C": "利用者が希望した場合や苦情があった場合は、速やかに人間の担当者へ引き継げる導線を用意します。", "D": "偏りや不正確な回答を見つけたときに、社内で報告して改善につなげられる窓口を設けます。"}, "answer": "B", "select_count": 1, "explanation": "外部の利用者と直接やり取りするAIは、少なくとも会話の開始時または画面上でAIであることを開示する必要があります。人間のスタッフを装うBは、透明性の欠如という倫理的リスクであり、ポリシーにも反します。Aの定期的な点検、Cの人への引き継ぎ、Dの報告窓口は、いずれも人による監督とDiligenceを高める措置で、問題ありません。", "source": "https://www.anthropic.com/legal/aup", "created": "2026-11-21"}, {"id": "A6-q011", "statement_id": "A6-3", "pack": "gen", "angle": "design-choice", "role": "コンサルタント", "scenario": "コンサルタントが、クライアント向け報告書の一部をClaudeで下書きし、数値や出典はすべて自分で確認しました。クライアントとの契約と社内ポリシーは、成果物でのAI利用の報告を求めていますが、報告書にその記載はありません。提出は明日です。", "question": "Diligenceの観点から、提出前に最も適切な対応はどれですか。", "choices": {"A": "内容は自分で検証済みで品質に問題がないため、AI利用の記載は不要と判断し、報告書は現状のまま提出します。", "B": "自分で検証済みであることに加え、下書きにAIを使った旨を契約とポリシーに沿って明示してから提出します。", "C": "Claudeが書いた表現を自分の言葉に書き換え、AIが関わった痕跡が分からない状態にして、報告書を提出します。", "D": "AI利用の記録は社内だけで保管し、クライアントから質問があったときに限って、利用の事実を答えます。"}, "answer": "B", "select_count": 1, "explanation": "Diligenceには、AIの役割について、それを知るべき相手に正直であること（透明性）と、成果物に責任を持つこと（検証）が含まれます。検証は済んでいても、契約とポリシーが求める開示を行わなければ透明性が欠けます。Bは両方を満たします。Aは検証を理由に開示義務を省いており、Cは関与を隠す点でさらに透明性に反します。Dは、求められている報告を相手の質問待ちにしており、義務を果たしていません。", "source": "https://assets.claude.com/4396730ed190e691a3712cf2fd6bfe35509deca2.pdf", "created": "2026-11-21"}, {"id": "A6-q012", "statement_id": "A6-3", "pack": "gen", "angle": "troubleshoot", "role": "教育", "scenario": "学校の教員が、通知表の所見の下書きをClaudeに作らせています。校内ポリシーは教員が確認してから渡すことを定めており、全員が誤字と事実の誤りを点検しています。しかし後日、女子児童には「協力的」、男子児童には「意欲的で主体的」といった表現が偏って使われていたことが分かりました。", "question": "この偏りが見過ごされた原因として最も妥当なものはどれですか。", "choices": {"A": "確認の手順が誤字と事実のチェックだけで、表現の偏りや不公平さという倫理面の観点が含まれていなかったことです。", "B": "教員が下書きを確認せずにそのまま提出していたため、確認の手順を守らなかった個人の問題だったことです。", "C": "Claudeが児童の性別を知らなかったことが原因なので、性別を入力すれば偏りは完全に防げるということです。", "D": "所見の下書きにAIを使うこと自体がポリシー違反であり、確認手順の有無は偏りの原因に関係しないことです。"}, "answer": "A", "select_count": 1, "explanation": "バイアスはAIの出力に現れる、特定の集団を不利または有利に扱う系統的な傾向です。この学校では確認自体は行われていましたが、点検の観点が誤字と事実に限られ、バイアスの確認が手順に含まれていませんでした。これは確認の設計（Diligence）の欠如です。Bは、全員が点検していたという事実に反します。Cは、性別の入力は偏りの解消にならず、「完全に防げる」も誤りです。Dは、ポリシーが下書きへの利用を前提に確認を求めていることと矛盾します。", "source": "https://assets.claude.com/4396730ed190e691a3712cf2fd6bfe35509deca2.pdf", "created": "2026-11-21"}, {"id": "A6-q013", "statement_id": "A6-2", "pack": "gen", "angle": "troubleshoot", "role": "コンサルタント", "scenario": "コンサルタントが、クライアントの未公表の組織再編案を相談するため、最初のメッセージを送る前に「+」メニューで「メモリ」をオフにして新しいチャットを始めました。後日、別のチャットで以前の再編の議論を探すよう頼むと、そのチャットの内容が引用されました。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "メモリをオフにしたチャットでも、終了後にその内容が自動でメモリへ統合される仕組みのため、後日の別のチャットから過去の再編の議論として参照できた。", "B": "メモリをオフにしたチャットは履歴に残るため、他の会話の過去チャット検索で見つかる。履歴にも残さない場合はシークレットチャットが必要だった。", "C": "再編案が機密トピックに分類され、メモリをオフにしていても機密トピックだけは自動でメモリに保存されたため、参照できた。", "D": "過去チャットの検索はシークレットチャットを含むすべてのチャットが対象で、メモリの設定にかかわらず内容を引用できる仕様だった。"}, "answer": "B", "select_count": 1, "explanation": "正解はB。単一のチャットでメモリをオフにすると、Claudeはそのチャットでメモリを使わず、メモリにも何も保存しませんが、チャット自体は履歴に残るため、他の会話から過去チャットを検索したときに見つかります。履歴にも検索にも残さないのはシークレットチャットの役割です。Aは誤りで、メモリをオフにしたチャットの内容はメモリに保存されません。Cも誤りで、機密トピックはデフォルトでは保存されず、ユーザーが明示的にオンにした場合のみ保存の対象になります。Dも誤りで、Claudeは過去の会話を検索する際にシークレットチャットから情報を取得しません。機密性の高い相談は、用途に合わせてシークレットチャットとメモリオフを使い分けることが重要です。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A6-q014", "statement_id": "A6-2", "pack": "gen", "angle": "find-error", "role": "広報", "scenario": "広報担当が、個人のProアカウントで、未発表の新製品の資料PDFを添付して要約とリリース案を作成しました。担当者は「添付ファイルは共有リンクに含まれないから大丈夫」と考え、そのチャットを共有リンクにして外部の広告代理店へ送る案を上司に出しています。", "question": "この運用案の誤りとして最も適切なものはどれですか。", "choices": {"A": "共有リンクの作成後に同じチャットで送るメッセージも自動で代理店に見えるため、作成前に会話を整理しておく必要がある点。", "B": "添付したPDFの全文が共有スナップショットに含まれ、リンクを持つ人がファイルをそのまま閲覧・ダウンロードできてしまう点。", "C": "共有リンクは作成者本人しか開けないため、外部の代理店は内容を見られず、共有の目的自体が果たせない点。", "D": "添付ファイルが含まれなくても、会話とClaudeの回答に資料の内容が含まれ、リンクを知る誰でも閲覧できてしまう点。"}, "answer": "D", "select_count": 1, "explanation": "正解はD。共有リンクを持つ人は、共有時点までのメッセージ（アーティファクトを含む）を誰でも閲覧できます。添付ファイル自体はスナップショットに含まれませんが、会話や回答の中に要約・引用として機密の内容が出ていれば、それはそのまま見えてしまいます。したがって未発表情報を含むチャットを共有リンクで渡すのは不適切です。Aは誤りで、共有後に送ったメッセージはデフォルトでプライベートのままです。Bも誤りで、添付ファイル自体は共有スナップショットに含まれません。Cも誤りで、リンクを持つ人なら誰でも閲覧できるため、むしろ意図しない相手にも見える危険があります。", "source": "https://support.claude.com/ja/articles/10593882-チャットの共有と共有解除", "created": "2026-11-21"}, {"id": "A6-q015", "statement_id": "A6-2", "pack": "gen", "angle": "tradeoff", "role": "オペレーション", "scenario": "健康保険組合のオペレーション担当が、受診情報などの保護された健康情報（PHI）を含む問い合わせ記録の傾向を、今日中に集計する必要があります。組織はClaude Enterpriseを契約し、プライマリオーナーがHIPAAを有効にしてBAAに同意済みです。Google Driveコネクタを使えばファイルを手早く取り込めるため、手作業でアップロードするより時間を節約できそうです。", "question": "締切と情報の機密性を両立させる進め方として、最も適切なものはどれですか。", "choices": {"A": "BAAの対象となるチャットに必要なファイルだけをアップロードして分析し、対象外のコネクタやスキルにはPHIを通さない。", "B": "BAAを締結済みなら、Google Driveコネクタも組織のポリシー上の保護の対象になるため、時間を優先してコネクタでPHIを取り込む。", "C": "管理者が機能をオンにしたものはすべてBAAの対象になる扱いなので、スキルやコネクタも含めて使いやすいものを選ぶ。", "D": "シークレットチャットは履歴や保持が残らないため、BAAの対象かどうかを確認せずにPHIをシークレットチャットで処理する。"}, "answer": "A", "select_count": 1, "explanation": "正解はA。BAAが適用されるのは、対象と明記された機能だけです。チャット内のファイルアップロードとコード実行による分析は対象に含まれます。一方、コネクタ（MCP）やスキルは利用できても、第三者へのデータフローや機能がBAAの対象外のため、PHIを近づけてはいけません。Bは誤りで、コネクタを通るデータは対象外です。Cも誤りで、機能をオンにできることと、BAAで対象になることは別の話です。Dも誤りで、シークレットチャットは履歴やメモリに残さない仕組みであり、BAAの対象かどうかとは無関係で、安全のため一定期間は保持もされます。締切があっても、対象範囲の確認を省略してはいけません。", "source": "https://support.claude.com/ja/articles/8114513-商用顧客向けビジネスアソシエイト契約書-baa", "created": "2026-11-21"}, {"id": "A6-q016", "statement_id": "A6-2", "pack": "gen", "angle": "troubleshoot", "role": "プロジェクト管理", "scenario": "ある企業の管理者が、プライバシー上の懸念から組織全体のメモリをオフにしました。数か月後、業務上の理由で再びオンにしたところ、すでに終了した案件の機密の詳細が、メンバーの新しい会話に再び反映されました。メンバーは、その間に何も新しく入力していません。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "組織のメモリをオフにしている間も、メンバーの新しい会話から新たなメモリが裏で作られ続けており、再開時にそれらがまとめて反映された。", "B": "再開時に、メンバーのシークレットチャットの内容が自動でメモリへ統合され、案件の詳細が反映された。", "C": "メモリを再びオンにした時点で、機密トピックを含める設定が全メンバーで自動的に有効になり、過去の内容が保存された。", "D": "組織でメモリをオフにしても既存のメモリは削除されず、再びオンにすると、Claudeが以前のエントリを再び使えるようになった。"}, "answer": "D", "select_count": 1, "explanation": "正解はD。組織レベルでメモリをオフにしても、既存のメモリエントリは削除されません。所有者が再びオンにすると、Claudeは以前のエントリを再び使えます。しかもオフの間は、ユーザーが設定でエントリを表示・削除することもできません。機密情報を消したい場合は、オフにするのではなく、メモリを再開する前にエントリを削除する必要があります。Aは誤りで、オフの間はメモリの使用も保存も止まります。Bは誤りで、シークレットチャットはメモリに寄与しません。Cは誤りで、メモリを有効にしても機密トピックは有効にならず、各ユーザー自身が選択した場合のみ保存されます。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A6-q017", "statement_id": "A6-2", "pack": "gen", "angle": "design-choice", "role": "コンサルタント", "scenario": "コンサルタントが、守秘義務契約の対象である未公開の買収案件について、Claudeで論点整理をしたいと考えています。先週、同じ案件の概要を通常のチャットで相談し、そのチャットはすでに削除しましたが、Claudeのメモリは日常的に利用しています。", "question": "データ保護の観点から適切な進め方はどれですか。（2つ選択）", "choices": {"A": "今後の案件相談はProject外のシークレットチャットで行い、メモリやチャット履歴に内容が残らないようにします。", "B": "先週のチャットは削除済みなので、そこから作られたメモリエントリも自動的に消えているとみなして何もしません。", "C": "案件専用のProjectを作ってその中でシークレットチャットを開始し、関連資料もProjectのナレッジに保存します。", "D": "メモリの設定画面で保存内容を確認し、案件に関する既存のエントリがあれば個別に編集または削除します。", "E": "機密トピックをメモリに含める設定をオンにして、案件の固有名詞もClaudeに覚えさせ、情報管理を一元化します。"}, "answer": "A,D", "select_count": 2, "explanation": "Aは正しい。シークレットチャットはチャット履歴にもメモリにも保存されず、既存のメモリも使われないため、今後の機密性の高い相談に適しています。Dは正しい。会話を削除しても、そこから生成されたメモリエントリは削除されないため、メモリの設定で内容を確認し、個別に編集・削除する必要があります。Bは誤り。会話の削除ではメモリエントリは消えません。Cは誤り。シークレットモードはProject外のチャットでのみ使え、Project内では開始できません。またProjectに機密資料を保存することは保護になりません。Eは誤り。機密トピックの設定は健康や宗教などの個人的な話題をメモリに保存可能にするもので、業務上の機密を守る機能ではなく、むしろ保存される情報を増やします。", "source": "https://support.claude.com/ja/articles/12260368-シークレットチャットを使用する", "created": "2026-11-21"}, {"id": "A6-q018", "statement_id": "A6-2", "pack": "gen", "angle": "find-error", "role": "広報", "scenario": "広報担当者が、未発表の新製品に関するプレスリリース案の推敲にClaudeを使うため、チーム向けの運用メモを作成しました。メモには、情報の扱いについて次のような記述が含まれています。", "question": "運用メモの記述のうち、誤りまたは不適切なものはどれですか。（2つ選択）", "choices": {"A": "未発表情報は社内の分類ラベルを確認し、AI利用が認められた区分のものだけをClaudeに入力します。", "B": "モデル改善への利用を許可していても、後で会話を削除すれば、すでに学習済みのモデルからも内容は消えます。", "C": "取引先名や未発表の製品名は入力前に仮称へ置き換え、元の対応表は社内の管理場所にだけ保管します。", "D": "メモリは健康や政治などの機密トピックを初期設定では保存しないため、必要な人だけが自分で保存を有効にします。", "E": "Teamプランのシークレットチャットは組織の保持設定やデータエクスポートの対象外なので、管理者には見えません。"}, "answer": "B,E", "select_count": 2, "explanation": "Bが誤り。会話を削除すると将来のモデルトレーニングには使われなくなりますが、すでに進行中のトレーニングや、学習済みのモデルにはデータが含まれる可能性があり、削除で消えるとは言えません。Eが誤り。TeamやEnterpriseでは、シークレットチャットはチャット履歴には残らなくても、組織のデータエクスポートや保持ポリシーの対象になります。Aは正しい。分類を確認してから入力する、というポリシーに沿った扱いです。Cは正しい。識別につながる固有名詞を仮称に置き換える墨消しの実践です。Dは正しい。機密トピックは初期設定では保存されず、利用者が自分でオプトインしたときだけ保存されます。", "source": "https://privacy.claude.com/ja/articles/10023548", "created": "2026-11-21"}, {"id": "A6-q019", "statement_id": "A6-2", "pack": "gen", "angle": "tradeoff", "role": "オペレーション", "scenario": "オペレーション担当者が、顧客問い合わせ履歴のスプレッドシート（顧客氏名、電話番号、注文番号、問い合わせ日、自由記述のコメント）をClaudeのコード実行による分析にかけ、月次の傾向を明日の会議で報告します。組織のポリシーでは、顧客情報は機密であり、AIによる分析は匿名化後のデータにのみ認められています。", "question": "期限とポリシー遵守を両立する進め方として適切なものはどれですか。（2つ選択）", "choices": {"A": "分析に不要な氏名と電話番号の列を除き、注文番号は件数の集計に使える仮のコードに置き換えてからアップロードします。", "B": "氏名と電話番号の列さえ削除すれば匿名化は完了とみなし、件数が多い自由記述欄は確認せずにそのまま使います。", "C": "自由記述欄には名前や連絡先が書かれていることがあるため、アップロード前に該当箇所を検索して確認し、墨消しします。", "D": "期限を優先して元データのままアップロードし、分析が終わった後で会話を削除して、結果の共有範囲は自分だけにします。", "E": "識別につながる恐れを避けるため、日付や注文番号も含めて全列を削除し、問い合わせ件数の合計だけを分析対象にします。"}, "answer": "A,C", "select_count": 2, "explanation": "Aは正しい。分析に不要な列を除き、識別子は仮のコードに置き換えることで、ポリシーを満たしつつ集計に必要な情報は残せます。Cは正しい。自由記述欄は個人情報が混入していても気づきにくいため、アップロード前に精査して墨消しする必要があります。Bは誤り。自由記述の中に残った個人情報を見落とすため、匿名化できていません。Dは誤り。ポリシーはアップロード前の匿名化を求めており、後から会話を削除しても共有済みの事実は変わらず、閲覧範囲の限定も個人データを渡すことの代わりになりません。Eは誤り。過剰に削除すると傾向分析という目的を果たせず、匿名化は分析の有用性を保ちながら行うものです。", "source": "https://support.claude.com/ja/articles/8325621", "created": "2026-11-21"}, {"id": "AOFF-1", "statement_id": "A2-2", "pack": "official", "angle": "design-choice", "role": "マーケティング", "scenario": "マーケティングマネージャーが、明日のクライアントとの会議に向けて1ページの競合分析資料の下書きをClaudeに依頼し、情報源として社内の調査PDFを2つアップロードしました。下書きは読みやすく、調査会社名を挙げた引用付きの市場シェアの割合3つ、競合企業のCEOによるものとされる発言、クライアント自身の製品ラインの概要が含まれています。マネージャーはまだPDFを開いていません。", "question": "この資料をクライアントに渡す前に、マネージャーはどうすべきですか。", "choices": {"A": "下書きのまま送付します。調査会社名を挙げた引用とアップロードした情報源があるため、初回の会議には十分信頼できる数値であり、修正が必要ならクライアントが依頼できます。", "B": "引用された各割合とCEOの発言を、アップロードしたPDFまたは信頼できる情報源と照合し、確認できないものは削除するかフラグを付けます。", "C": "資料内のすべての数値と発言が正確であることを確認するようClaudeに依頼し、内容が検証済みである旨の注記を追加させます。", "D": "誤りが含まれないように、資料からすべての数値と発言を削除し、定性的な概要のみを提示します。"}, "answer": "B", "select_count": 1, "explanation": "名前を挙げた引用付きの具体的な数値や、発言者を特定した発言は、まさに捏造された詳細や、もっともらしく作り出された詳細が現れやすいパターンです。また、この資料は社外向けの成果物であり、その責任は引き続きマネージャーにあります。アップロードした情報源または信頼できる外部の情報源と照らし合わせて独立に検証することで、確認済みの主張と未確認の主張を区別できます。確認せずに下書きを送付する（A）のは、引用の正確さではなく引用が存在することに頼っています。Claudeに自身の出力を確認させる（C）のは、独立した確認になりません。具体的な情報をすべて削除する（D）と、裏付けのある内容とない内容を区別しないまま価値を損なってしまいます。", "source": "https://anthropic-partners.skilljar.com/", "created": "2026-11-21"}, {"id": "AOFF-2", "statement_id": "A5-4", "pack": "official", "angle": "design-choice", "role": "コンサルタント", "scenario": "あるチームのClient Proposals Projectは、6か月間、一貫性のある整った形式の下書きを作成してきました。この3週間、下書きが前四半期に会社が廃止した価格表を引用するようになり、ときどき別のクライアントの案件の用語も使用しています。Projectの指示は編集されておらず、Projectに追加されている提案書フォーマット用のSkillも変更されていません。", "question": "チームがまず取るべき対応はどれですか。", "choices": {"A": "下書きの一貫性が失われる原因は通常、指示のドリフトであるため、より厳格なフォーマットと用語のルールでProjectの指示を書き直します。", "B": "フォーマット用のSkillを削除し、新しいバージョンのSkillが公開されるまでリクエストごとのプロンプトで対応します。", "C": "Projectのナレッジにある廃止済みの価格表を差し替え、別のクライアントに言及しているメモリを削除します。", "D": "より高性能なモデルに切り替え、エフォートレベルを上げ、最近の下書きを再生成して品質が戻るかを確認します。"}, "answer": "C", "select_count": 1, "explanation": "2つの症状は、2つの設定レイヤーを示しています。廃止された価格表を引用するのは、ナレッジソースが古くなっていることの典型的な兆候です。別のクライアントの案件の用語が現れるのは、ワークストリームをまたいでメモリが蓄積されていることの典型的な兆候です。文書を差し替え、クライアントをまたぐメモリを削除すれば、その両方に対処できます。指示（A）とSkill（B）は変更されていないため、出力の変化の原因にはなりえません。モデルやエフォートレベルの変更（D）は推論の品質に影響するものであり、Projectが最新かつ適切な範囲のナレッジにグラウンディングされているかどうかには影響しません。", "source": "https://anthropic-partners.skilljar.com/", "created": "2026-11-21"}, {"id": "AOFF-3", "statement_id": "A6-2", "pack": "official", "angle": "design-choice", "role": "人事", "scenario": "人事ビジネスパートナーが、Claudeのコード実行による分析を使って、スプレッドシートのエクスポートファイルから離職の傾向を特定したいと考えています。このファイルには、従業員の氏名、自宅住所、給与、人事評価、退職面談での自由記述のコメントが含まれています。組織のポリシーでは、従業員の個人データは機密情報に分類され、AIによる分析は匿名化されたデータに対してのみ認められています。", "question": "ポリシーに沿った方法はどれですか。", "choices": {"A": "シークレットチャットは会話履歴とメモリの対象外で、セッション後に記録が残らないため、ファイルをそのままシークレットチャットにアップロードします。", "B": "アップロード前にエクスポートファイルを匿名化し（氏名と住所を削除し、識別子をコードに置き換え、退職面談のコメントを精査します）、作業の機密性に応じてメモリの設定を調整します。", "C": "許可された同僚だけがデータと結果を閲覧できるように、人事チームに限定したProjectにファイル全体をアップロードします。", "D": "アップロード後にClaude自身にデータを匿名化させ、その後、元のファイルを会話から削除します。"}, "answer": "B", "select_count": 1, "explanation": "ポリシーではAIによる分析の前に匿名化が求められているため、データは共有する前に加工する必要があります。また、自由記述のコメントは個人を特定できる情報が含まれていて
