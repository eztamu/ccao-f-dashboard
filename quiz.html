<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAO-F 模擬クイズ</title>
<style>

:root {
  --surface:#F5F6F9; --card:#FFFFFF; --ink:#1C2536; --sub:#5C6678; --line:#E3E6EE;
  --accent:#3B55C4; --accent-soft:#E7EBFA; --ok:#1E7F4F; --ok-soft:#E2F2E9;
  --ng:#C2403B; --ng-soft:#F9E7E6; --due:#B07C1F; --due-soft:#F7EEDC;
}
@media (prefers-color-scheme: dark) { :root {
  --surface:#12161F; --card:#1B2230; --ink:#E7EBF4; --sub:#98A2B6; --line:#2A3245;
  --accent:#5D74D8; --accent-soft:#232C4A; --ok:#3A9A6D; --ok-soft:#1B3128;
  --ng:#C95F5B; --ng-soft:#3A2323; --due:#A9843C; --due-soft:#332B18;
} }
:root[data-theme="light"] {
  --surface:#F5F6F9; --card:#FFFFFF; --ink:#1C2536; --sub:#5C6678; --line:#E3E6EE;
  --accent:#3B55C4; --accent-soft:#E7EBFA; --ok:#1E7F4F; --ok-soft:#E2F2E9;
  --ng:#C2403B; --ng-soft:#F9E7E6; --due:#B07C1F; --due-soft:#F7EEDC;
}
:root[data-theme="dark"] {
  --surface:#12161F; --card:#1B2230; --ink:#E7EBF4; --sub:#98A2B6; --line:#2A3245;
  --accent:#5D74D8; --accent-soft:#232C4A; --ok:#3A9A6D; --ok-soft:#1B3128;
  --ng:#C95F5B; --ng-soft:#3A2323; --due:#A9843C; --due-soft:#332B18;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--surface); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased; }
.wrap { max-width:660px; margin:0 auto; padding:16px 16px 48px; display:flex; flex-direction:column; gap:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
.eyebrow { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--sub); font-weight:600; }
.chip { display:inline-block; font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent); }
button { font:inherit; cursor:pointer; }
button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
.num { font-variant-numeric:tabular-nums; }

.scenario { font-size:16.5px; }
.qtext { font-weight:650; margin:12px 0 4px; }
.choices { display:flex; flex-direction:column; gap:10px; }
.choice { display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
  background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:12px 14px;
  color:var(--ink); transition:border-color .12s; }
.choice:not(:disabled):hover { border-color:var(--accent); }
.choice .key { font-weight:700; color:var(--accent); flex:0 0 auto; }
.choice.sel { border-color:var(--accent); background:var(--surface); }
.choice.correct { border-color:var(--ok); background:var(--ok-soft); }
.choice.wrong { border-color:var(--ng); background:var(--ng-soft); }
.choice:disabled { cursor:default; opacity:.92; }
.verdict { font-weight:700; }
.verdict.ok { color:var(--ok); } .verdict.ng { color:var(--ng); }
.expl { border-left:3px solid var(--accent); padding:2px 0 2px 12px; margin-top:10px; font-size:14.5px; }
.expl a { color:var(--accent); word-break:break-all; font-size:13px; }
.next { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:13px; font-weight:700; width:100%; }
.next:disabled { opacity:.4; cursor:default; }
.progressbar { height:6px; background:var(--line); border-radius:999px; overflow:hidden; }
.progressbar > div { height:100%; background:var(--accent); border-radius:999px; transition:width .2s; }
.topline { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.timer { color:var(--sub); }
.timer.over { color:var(--ng); }
.pace { font-size:13px; color:var(--sub); margin:4px 0 12px; }
.pace b { color:var(--ink); }
.score { font-size:40px; font-weight:750; }
.qr { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; background:var(--surface);
  border:1px dashed var(--line); border-radius:8px; padding:10px; word-break:break-all; user-select:all; }
.copybtn { background:var(--card); color:var(--accent); border:1.5px solid var(--accent);
  border-radius:10px; padding:11px; font-weight:700; width:100%; margin-top:8px; }
.reslist { display:flex; flex-direction:column; gap:6px; font-size:14px; }
.reslist .row { display:flex; gap:8px; align-items:baseline; }
.mark { font-weight:700; flex:0 0 1.2em; }
.hidden { display:none; }
.formbtn { display:block; text-align:center; text-decoration:none; background:var(--accent); color:#fff;
  border:none; border-radius:10px; padding:13px; font-weight:700; width:100%; margin-top:8px; }
.pausebar { display:flex; gap:8px; margin-top:14px; }
.pausebtn { flex:1; background:var(--card); color:var(--sub); border:1.5px solid var(--line);
  border-radius:10px; padding:10px 6px; font-weight:700; font-size:13px; }
.pausebtn:hover { border-color:var(--accent); color:var(--accent); }
.examclock { font-weight:700; color:var(--accent); }
.examclock.low { color:var(--ng); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div>
    <div class="topline">
      <span class="eyebrow" id="setlabel">CCAO-F Practice · A1+A2+A3+A4+A5+A6 · 10問</span>
      <span class="eyebrow num examclock hidden" id="examclock"></span>
      <span class="eyebrow num timer" id="timer">0:00</span>
      <span class="eyebrow num" id="counter"></span>
    </div>
    <div class="progressbar" aria-hidden="true"><div id="pbar" style="width:0%"></div></div>
  </div>
  <div id="resumebox" class="card hidden">
    <span class="eyebrow">前回の続き</span>
    <p id="resumeinfo" style="margin:8px 0"></p>
    <button class="next" id="resumebtn">▶ 続きから再開</button>
    <button class="pausebtn" id="resumerecbtn" style="width:100%;margin-top:8px">解いた分だけ記録して終了</button>
    <button class="pausebtn" id="restartbtn" style="width:100%;margin-top:8px">最初からやり直す</button>
  </div>
  <div id="pausedbox" class="card hidden">
    <span class="eyebrow">保存しました</span>
    <p id="pausedinfo" style="margin:8px 0"></p>
    <button class="next" id="continuebtn">▶ 今すぐ再開</button>
  </div>
  <div id="quiz" class="card">
    <span class="chip" id="domchip"></span>
    <p class="scenario" id="scenario"></p>
    <p class="qtext" id="question"></p>
    <p class="pace hidden" id="examnote">本番通し: 制限時間は実時間で進みます（ページを閉じても止まりません）。止めたいときは「⏸ 中断して保存」。各問の正誤・解説は最後にまとめて表示します。</p>
    <div class="choices" id="choices"></div>
    <button class="next hidden" id="submitbtn" style="margin-top:12px">回答する</button>
    <div id="feedback" class="hidden">
      <p class="verdict" id="verdict"></p>
      <div class="expl"><span id="expl"></span><br><a id="srclink" target="_blank" rel="noopener"></a></div>
      <button class="next" id="nextbtn" style="margin-top:14px">次の問題 →</button>
    </div>
    <div class="pausebar">
      <button class="pausebtn" id="pausebtn">⏸ 中断して保存</button>
      <button class="pausebtn" id="earlybtn">📮 ここまでを記録して終了</button>
    </div>
  </div>
  <div id="final" class="card hidden">
    <span class="eyebrow">Result</span>
    <div class="score num" id="scoreline"></div>
    <p class="pace" id="paceline"></p>
    <div class="reslist" id="reslist"></div>
    <a id="formbtn" class="formbtn hidden" target="_blank" rel="noopener">📮 結果を送信して記録</a>
    <p id="codelabel" style="margin:16px 0 6px; font-weight:650;">結果コード（手動記録用）</p>
    <div class="qr" id="qrcode"></div>
    <button class="copybtn" id="copybtn">結果コードをコピー</button>
  </div>
</div>
<script>
const QUESTIONS_DEFAULT = [{"id": "A1-q001", "statement_id": "A1-1", "pack": "gen", "angle": "design-choice", "role": "人事", "scenario": "人事担当者が、新設するカスタマーサポート職の求人票の下書きをClaudeに依頼します。社内の職務等級の定義、チームの働き方、求める人物像は、Claudeがもともと知らない情報です。最初の応答からそのまま推敲に入れる下書きを得たいと考えています。", "question": "最初のプロンプトとして最も適切なものはどれですか。", "choices": {"A": "「優れた人事担当者として求人票を書いて」と役割だけを指定し、中身はClaudeが一般的な知識で補うよう任せる。", "B": "職種の目的と応募者層を伝え、等級定義・働き方・人物像を貼り付けたうえで、求人票の構成と文体を指定する。", "C": "他社の求人票を数件貼り付けて「これらに似せて」とだけ依頼し、自社の等級や人物像は後から手作業で直す。", "D": "まず求人票の見出しだけを出させ、内容は応答を見ながら少しずつ質問して、Claudeに補ってもらう進め方にする。"}, "answer": "B", "select_count": 1, "explanation": "Bが正解です。目的・対象読者・出力形式に加え、Claudeがデフォルトでは持っていない社内固有の文脈（等級定義、働き方、人物像）を渡すことで、最初の応答の質が高まります。Aは役割だけで、自社固有の情報が欠けるため一般的な求人票になります。Cは他社の文面に引きずられ、自社の事情が反映されないまま手直しの負担だけが残ります。Dは必要な文脈を最初に渡さず、やり取りの回数が増えて目的に適した最初の応答を得る趣旨から外れます。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A2-q002", "statement_id": "A2-2", "pack": "gen", "angle": "find-error", "role": "オペレーション", "scenario": "オペレーション担当者が、アップロードした発注履歴の表からClaudeに拠点別の年間発注コストを集計させました。結果は計算手順つきで整然と示されており、この数値を明日の経営会議の資料に使う予定です。チームでは、使用前の確認方法について次の4案が出ました。", "question": "確認方法の案のうち、不適切なものはどれですか。", "choices": {"A": "表計算ソフトで同じ集計を別途行い、Claudeが示した拠点別の合計と一致するか、会議の前に突き合わせます。", "B": "計算手順が丁寧に示されているので、手順が正しいことの裏付けとみなし、再計算せずに数値を資料へ転記します。", "C": "拠点別の合計を足し上げた総額が、元の発注履歴にある総額と合うかを確認し、ずれがあれば原因を調べます。", "D": "元データから数件の拠点を抜き出して手計算し、重複行や欠損行が集計に影響していないかを確認します。"}, "answer": "B", "select_count": 1, "explanation": "正解（不適切なもの）はB。Claudeは計算を実行できますが、複雑な計算やミッションクリティカルな計算は、専門の数学ソフトや手作業など別の方法で検証する必要があります。手順が整って見えることは正しさの証拠ではなく、もっともらしいのに誤っている出力の典型的な見え方です。Aは表計算ソフトによる独立した再計算で、適切です。Cは総額の整合性を元データと照合するもので、不整合の検出に有効です。Dは抜き取りの手計算で、集計の誤りやデータの不備を確認でき、適切です。", "source": "https://support.claude.com/ja/articles/10366421-claudeは数学方程式と計算にどのように対応していますか", "created": "2026-11-21"}, {"id": "A3-q001", "statement_id": "A3-1", "pack": "gen", "angle": "design-choice", "role": "マーケティング", "scenario": "マーケティング担当者が、新規参入を検討している市場の競合3社について、公開Webの情報と、連携済みの社内ドキュメントの両方を調べて比較し、詳細なレポートにまとめたいと考えています。レポートは会議資料として使うため、情報の出典も確認できる形にする必要があります。", "question": "このタスクに最も適したClaudeの機能はどれですか。", "choices": {"A": "ウェブ検索を1回だけ実行して上位の結果を要約させます。短時間で済み、競合3社の比較にも十分に対応できる方法です。", "B": "拡張思考だけを使い、Claudeがもともと持つ知識から競合の動向を複数の角度で深く考察させ、比較レポートにまとめます。", "C": "リサーチを使い、ウェブと連携済みの社内情報の複数のソースを横断して調べさせ、出典を引用した比較レポートを作成します。", "D": "新しいチャットで競合の社名だけを入力し、メモリに蓄積された情報を根拠に、比較表とレポートを作成させます。"}, "answer": "C", "select_count": 1, "explanation": "リサーチは、複数回のツール呼び出しを要する包括的な情報収集に向き、ウェブと連携機能にまたがる複数ソースの情報を、出典付きの詳細なレポートに統合できます。今回の「Webと社内情報の両方を調べ、出典つきで比較する」という要件に合致します。ウェブ検索（A）は1〜2回のツール呼び出しで答えられる単純な事実確認向きで、複数ソースの統合や詳細レポートには不足します。拡張思考のみ（B）は最新情報や社内情報を取得せず、推論の深さを高めるだけなので、調査の代わりにはなりません。メモリ（D）は過去の会話から得た作業上のコンテキストを保持する機能で、競合の最新動向を網羅的に調べる手段ではなく、出典の確認もできません。", "source": "https://support.claude.com/ja/articles/11095361-ウェブ検索-拡張思考-リサーチはいつ使うべき", "created": "2026-11-21"}, {"id": "A4-q001", "statement_id": "A4-1", "pack": "gen", "angle": "design-choice", "role": "マーケティング", "scenario": "マーケティング担当者が、新サービスへの参入可否を検討する提案書を作成します。市場動向、競合、顧客の声という複数の観点を調べ、根拠を示して提案にまとめる必要があり、提案書は社外の意思決定会議でも使われます。", "question": "リサーチから提案へのまとめ上げまでの進め方として、最も適切なものはどれですか。", "choices": {"A": "通常のチャットで市場動向を一度だけ尋ね、返ってきた回答をそのまま提案書の根拠として使う。", "B": "調査機能で出典付きに調べさせ、重要な主張は出典で確認してから、提案の骨子にまとめさせる。", "C": "先に提案の結論を決め、その結論を裏づける情報だけをClaudeに探させて引用をそろえる。", "D": "調査機能は使わず、Claudeの既存の知識で概況を書かせ、出典は提出後に探して付け足す。"}, "answer": "B", "select_count": 1, "explanation": "Bが正解です。調査機能は複数の検索を重ね、見つかった内容に基づいて次の調べる対象を決めながら質問を多角的に掘り下げるため、複数観点のリサーチに向いています。そのうえで、出典付きの主張を人が確認してから計画にまとめることで、社外にも使う成果物の責任を果たせます。Aは一度きりの回答では多角的な調査にならず、出典の確認もないため根拠として不十分です。Cは結論ありきで情報を集めるため、都合の悪い情報が抜け落ち、リサーチの目的に反します。Dは出典のない記述を先に書かせて後から出典を探す順序で、裏付けのない内容が混入しやすく、確認も後回しになります。", "source": "https://support.claude.com/ja/articles/11088861-claudeの調査機能を使用する", "created": "2026-11-21"}, {"id": "A5-q001", "statement_id": "A5-1", "pack": "gen", "angle": "design-choice", "role": "広報", "scenario": "広報担当者は、毎回同じ社内ブランドガイド（PDF・40ページ）を参照しながらプレスリリースの下書きを作成しています。現在は作成のたびにチャットへPDFを添付し、トーンの希望も毎回入力しています。作業を繰り返し発生するユースケースとして整えたいと考えています。", "question": "Projectの設定として最も適切なものはどれですか。", "choices": {"A": "ブランドガイドをProjectのナレッジに追加し、指示には役割・文体の方針・出力の形式を書いて、リリースごとにチャットを分ける。", "B": "ブランドガイドの全文をProjectの指示欄に貼り付け、役割や文体の希望もすべて同じ欄にまとめて、ナレッジは使わない。", "C": "ブランドガイドとトーンの希望をアカウント全体の指示に設定し、すべての会話で自動的に参照されるようにする。", "D": "これまでどおり毎回ブランドガイドとトーンの希望をチャットに添付・入力し、Projectは過去の下書きを保管する場所としてのみ使うことにする。"}, "answer": "A", "select_count": 1, "explanation": "正解はA。Projectのナレッジは、チャットを始めるたびに背景として使われる静的な参考資料の置き場で、ブランドガイドのような繰り返し参照する文書に向いています。指示は役割・文体・出力方針といった動作の定義に使うため、役割分担として適切です。Bは参照文書を指示欄に詰め込むため、資料の差し替えや管理がしにくくなります。Cのアカウント全体の指示は無関係な会話にも適用されてしまい、プレスリリース用の設定をProject内に限定できません。Dはせっかくの繰り返しのユースケースにProjectの設定を活かしておらず、毎回の添付と入力の手間と抜け漏れが残ります。", "source": "https://support.claude.com/ja/articles/10185728-claudeのパーソナライゼーション機能を理解する", "created": "2026-11-21"}, {"id": "A6-q001", "statement_id": "A6-1", "pack": "gen", "angle": "design-choice", "role": "人事", "scenario": "人事担当者が、新卒採用の応募書類をClaudeに読み込ませて合格可能性の順位を出させ、上位の応募者だけを面接に進める運用を提案しています。下位の応募者の書類は、人が見ないまま不合格になります。", "question": "この提案を「適切」「安全策を講じれば適切」「不適切」に分類するとき、最も妥当な判断はどれですか。", "choices": {"A": "適切です。Claudeは書類を公平に読めるため、順位を根拠に下位の応募者を人が見ずに不合格とする運用でも問題ありません。", "B": "不適切です。採用業務でAIを使うこと自体が利用ポリシーで一律に禁じられており、書類の整理や要約にも使えません。", "C": "安全策を講じれば適切です。採用判断に責任を持つ担当者が順位を実質的に見直して変更でき、応募者にAI利用を伝えます。", "D": "安全策を講じれば適切です。選考基準をプロンプトに明記して順位を応募者に知らせれば、人による確認は省略できます。"}, "answer": "C", "select_count": 1, "explanation": "採用の選考・順位付け・不合格の決定は、利用ポリシーが定める高リスク用途（雇用）にあたり、一律に禁止ではなく、要件を満たせば使えます。要件は、資格や経験を持つ担当者が出力を実質的に確認し、変更する権限を持つこと、そして判断の対象となる人にAIが使われたことを明示することです。したがってCが正解です。Aは、人が見ないまま不合格にする点が要件を満たしません。Bは、採用業務でのAI利用を一律禁止と誤解しており、要件を満たせば利用できます。Dは、基準を明記しても、人による実質的な確認の代わりにはなりません。", "source": "https://www.anthropic.com/legal/aup", "created": "2026-11-21"}, {"id": "A1-q002", "statement_id": "A1-1", "pack": "gen", "angle": "troubleshoot", "role": "マーケティング", "scenario": "マーケティング担当者が「新商品の紹介文を書いて」とだけClaudeに依頼したところ、どの商品にも使えそうな一般的な文章が返ってきました。商品は共働き世帯向けの時短調理家電で、発信先は公式Instagramです。", "question": "この結果の原因として最も妥当なものはどれですか。", "choices": {"A": "役割が指定されていないため、Claudeが文章作成の専門性を発揮できず、無難な内容にとどまった。", "B": "紹介文の長さが指示されていないため、Claudeが内容を絞り込めず、汎用的な書き方を選んだ。", "C": "依頼文が短いとClaudeは意図を読み取れないため、毎回ほぼランダムな内容が生成されてしまう。", "D": "商品の特徴、想定読者、発信先、トーンなど、Claudeが持たない文脈が依頼に含まれていなかった。"}, "answer": "D", "select_count": 1, "explanation": "Dが正解です。Claudeは文脈を知らない有能な新人のようなもので、商品の特徴・読者・媒体・トーンを伝えなければ汎用的な文章になります。Aは役割の指定が補助になる場合はあるものの、商品や読者の情報の欠如が根本原因であり、役割を足しても解消しません。Bは長さの指定も有効ですが、一般的な文章になる原因を説明できません。Cは「ランダムな内容になる」という説明が不正確で、実際には情報不足の範囲で無難な出力が返っています。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A2-q003", "statement_id": "A2-1", "pack": "gen", "angle": "design-choice", "role": "人事", "scenario": "人事担当者が、部門別の残業時間と手当額の合計をClaudeに計算させ、社内向けの集計表を作成しました。表は見やすく整っており、Claudeの計算手順の説明にも不自然な点はありません。この集計表は、各部門長が人件費の判断に使う予定です。", "question": "集計表を部門長に配布する前に、担当者はどうすべきですか。", "choices": {"A": "計算手順の説明が筋道立っているため、そのまま配布し、部門長から誤りの指摘があった時点で修正します。", "B": "合計値と手当額を、表計算ソフトの関数や電卓などで独立に再計算し、一致を確認したうえで配布します。", "C": "Claudeに同じ計算をもう一度実行させ、2回の結果が一致していれば検証済みとして配布します。", "D": "数値の信頼性は確保できないと判断し、数値は使わずに傾向を文章で説明するだけの資料に作り替えます。"}, "answer": "B", "select_count": 1, "explanation": "Claudeは計算を実行できますが、複雑な計算やミッションクリティカルな計算は、専門的なソフトウェアや手作業など別の方法で検証する必要があります。人件費の判断に使われる集計表は、まさにその対象です。Bは独立した方法で再計算するため、誤りを確実に見つけられます。Aは確認なしに配布し、誤りの発見を受け手に任せてしまいます。Cは同じClaudeに再実行させるだけで、独立した検証になりません。Dは数値をすべて捨てて、確認すれば使える有用な集計まで失ってしまいます。", "source": "https://support.claude.com/ja/articles/10366421-claudeは数学方程式と計算にどのように対応していますか", "created": "2026-11-21"}, {"id": "A3-q002", "statement_id": "A3-1", "pack": "gen", "angle": "troubleshoot", "role": "プロジェクト管理", "scenario": "Teamプランを使うプロジェクト管理担当者は、先週まで新しいチャットでも自分の役割や進行中の案件をClaudeが覚えていて助かっていました。ところが今週から、新しいチャットで何も引き継がれなくなりました。本人は設定でメモリをリセットしておらず、使用するモデルも変えていません。同僚も同じ症状で、各自でメモリをオンに戻すことができません。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "組織のオーナーが、組織全体のメモリ機能をオフにしたため、各メンバーは自分でメモリを使用することも、オンに戻すこともできなくなっています。", "B": "使用するモデルのティアが以前と異なるため、モデルをまたいではメモリが引き継がれず、個々の会話の内容が失われてしまっており、同僚にも同じ影響が出ています。", "C": "努力レベルが低く設定されているため、Claudeが応答の前にメモリを参照する思考を省略し、保存済みの情報を使えなくなっています。", "D": "古い会話が保持期間の経過で削除され、その会話から作られたメモリのエントリも自動的にすべて削除されてしまったためです。"}, "answer": "A", "select_count": 1, "explanation": "TeamやEnterpriseでは、オーナーが組織設定で組織全体のメモリをオフにでき、オフにされるとClaudeは全ユーザーのメモリの使用と保存を止め、ユーザー個人では再度オンにできません。複数のメンバーに同時に同じ症状が出て、個人でオンに戻せない点が、この原因を示しています。モデルの切り替え（B）や努力レベル（C）はメモリの利用可否を決めるものではなく、いずれも本人が変更していないという条件とも合いません。会話が削除されても、そこから生成されたメモリのエントリは削除されないため（D）も誤りです。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A4-q002", "statement_id": "A4-1", "pack": "gen", "angle": "troubleshoot", "role": "ナレッジワーカー", "scenario": "ナレッジワーカーが、社内のGoogle Docsにある議事録と最新のウェブ情報を合わせて競合動向をまとめるため、調査機能をオンにし、外出先でスマートフォンのアプリから調査を依頼しました。返ってきた結果はウェブ上の情報だけで、社内議事録の内容がまったく反映されておらず、エラーの表示もありませんでした。", "question": "社内議事録が反映されなかった原因として、最も妥当なものはどれですか。", "choices": {"A": "調査機能は、ウェブ検索をオフにしないとGoogle Docsなどのコネクタの情報を読み込めないため。", "B": "社内議事録の分量が多く、調査の途中でClaudeが自動的に調査対象から外してしまったため。", "C": "調査機能はGoogle Workspaceのコネクタには対応しておらず、ウェブ情報のみを対象とするため。", "D": "モバイルで開始した調査はウェブのみを検索し、コネクタが使われなくてもエラーが表示されないため。"}, "answer": "D", "select_count": 1, "explanation": "Dが正解です。Claude Mobileで調査を開始するとウェブのみが検索され、コネクタはスキップされますが、その旨のエラーや表示は出ません。ウェブとコネクタの両方を調べたい場合は、WebまたはDesktopで調査を開始します。Aは逆で、調査機能が動作するにはウェブ検索をオンにする必要があります。Bのような自動的な除外は教材に根拠がなく、症状（エラー表示なしでウェブ情報のみ）はモバイル開始の挙動と一致します。Cは誤りで、調査機能はGoogle Workspace（Gmail、Calendar、Docs）を含む接続済みツールも調査対象にできます。", "source": "https://support.claude.com/ja/articles/11088861-claudeの調査機能を使用する", "created": "2026-11-21"}];
const QUESTIONS_ALL = [{"id": "A1-q001", "statement_id": "A1-1", "pack": "gen", "angle": "design-choice", "role": "人事", "scenario": "人事担当者が、新設するカスタマーサポート職の求人票の下書きをClaudeに依頼します。社内の職務等級の定義、チームの働き方、求める人物像は、Claudeがもともと知らない情報です。最初の応答からそのまま推敲に入れる下書きを得たいと考えています。", "question": "最初のプロンプトとして最も適切なものはどれですか。", "choices": {"A": "「優れた人事担当者として求人票を書いて」と役割だけを指定し、中身はClaudeが一般的な知識で補うよう任せる。", "B": "職種の目的と応募者層を伝え、等級定義・働き方・人物像を貼り付けたうえで、求人票の構成と文体を指定する。", "C": "他社の求人票を数件貼り付けて「これらに似せて」とだけ依頼し、自社の等級や人物像は後から手作業で直す。", "D": "まず求人票の見出しだけを出させ、内容は応答を見ながら少しずつ質問して、Claudeに補ってもらう進め方にする。"}, "answer": "B", "select_count": 1, "explanation": "Bが正解です。目的・対象読者・出力形式に加え、Claudeがデフォルトでは持っていない社内固有の文脈（等級定義、働き方、人物像）を渡すことで、最初の応答の質が高まります。Aは役割だけで、自社固有の情報が欠けるため一般的な求人票になります。Cは他社の文面に引きずられ、自社の事情が反映されないまま手直しの負担だけが残ります。Dは必要な文脈を最初に渡さず、やり取りの回数が増えて目的に適した最初の応答を得る趣旨から外れます。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q002", "statement_id": "A1-1", "pack": "gen", "angle": "troubleshoot", "role": "マーケティング", "scenario": "マーケティング担当者が「新商品の紹介文を書いて」とだけClaudeに依頼したところ、どの商品にも使えそうな一般的な文章が返ってきました。商品は共働き世帯向けの時短調理家電で、発信先は公式Instagramです。", "question": "この結果の原因として最も妥当なものはどれですか。", "choices": {"A": "役割が指定されていないため、Claudeが文章作成の専門性を発揮できず、無難な内容にとどまった。", "B": "紹介文の長さが指示されていないため、Claudeが内容を絞り込めず、汎用的な書き方を選んだ。", "C": "依頼文が短いとClaudeは意図を読み取れないため、毎回ほぼランダムな内容が生成されてしまう。", "D": "商品の特徴、想定読者、発信先、トーンなど、Claudeが持たない文脈が依頼に含まれていなかった。"}, "answer": "D", "select_count": 1, "explanation": "Dが正解です。Claudeは文脈を知らない有能な新人のようなもので、商品の特徴・読者・媒体・トーンを伝えなければ汎用的な文章になります。Aは役割の指定が補助になる場合はあるものの、商品や読者の情報の欠如が根本原因であり、役割を足しても解消しません。Bは長さの指定も有効ですが、一般的な文章になる原因を説明できません。Cは「ランダムな内容になる」という説明が不正確で、実際には情報不足の範囲で無難な出力が返っています。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q003", "statement_id": "A1-1", "pack": "gen", "angle": "find-error", "role": "広報", "scenario": "広報担当者が、プレスリリースの元原稿から要点メモを作るため「あなたは広報のプロです。以下の原稿を読んで、要点をまとめてください。」というプロンプトを書きました。メモは記者会見の配布資料に差し込む予定ですが、その説明はプロンプトにありません。", "question": "このプロンプトの問題点として最も適切なものはどれですか。", "choices": {"A": "配布資料という用途と読者が伝わらず、形式や分量も未指定のため、使える形で返る保証がない。", "B": "役割を「広報のプロ」と設定したことで、回答が専門的になりすぎ、記者に伝わりにくくなる。", "C": "元原稿を依頼文の後ろに添える構成では、Claudeが原稿を読み込めず、要点を正しく抽出できない。", "D": "「まとめてください」という丁寧な依頼表現は、Claudeの出力の精度を下げるため避けるべきである。"}, "answer": "A", "select_count": 1, "explanation": "Aが正解です。出力の使い道、対象読者、形式（箇条書きか文章か、分量など）を明示しないと、目的に合わない最初の応答になりがちです。Bは役割設定自体は有効な手法であり、それが原因で伝わらなくなるわけではありません。Cは原稿を後ろに添える構成でも読み込めるため誤りです。Dは丁寧な表現が精度を下げる根拠はなく、明確で具体的な指示のほうが重要です。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q004", "statement_id": "A1-1", "pack": "gen", "angle": "tradeoff", "role": "プロジェクト管理", "scenario": "プロジェクトマネージャーが、3本の長い会議議事録をもとに、経営層向けの週次報告案を短時間で作る必要があります。出典ごとに、決定事項と未解決の課題を区別して整理してほしいと考えています。", "question": "時間の制約がある中で、最も適切なプロンプトの組み立て方はどれですか。", "choices": {"A": "「週次報告を作って」と1行で依頼して議事録を添付し、不足分は出力を見てから何度も追加で依頼する。", "B": "経営層の過去の発言や社内の経緯を詳細に書き連ね、時間をかけて網羅的な長い指示文を整えてから送る。", "C": "議事録を出典名つきで区切って先に置き、末尾に読者・決定事項と課題の区別・形式を簡潔に指示する。", "D": "依頼を先頭に置き、議事録3本を区切りなしで続けて貼り付け、読者や出力形式は書かずにそのまま送る。"}, "answer": "C", "select_count": 1, "explanation": "Cが正解です。長い資料は先頭に置き、出典ごとに区切って示し、依頼を末尾にまとめると正確さが上がります。読者・区別したい観点・形式を簡潔に添えるだけなので、時間もかかりません。Aは手間は少ないものの、追加依頼の往復で結局時間を失います。Bは必要以上に時間を使い、依頼に関係の薄い情報が増えます。Dは資料の境界と出典が不明確で、読者や形式も欠けるため、出典ごとの整理という要件を満たしにくくなります。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q005", "statement_id": "A1-1", "pack": "gen", "angle": "design-choice", "role": "教育", "scenario": "教員が、授業の理解度を確認する小テストを、毎回同じ形式でClaudeに作らせたいと考えています。問題文・選択肢・解説の書き方に学校独自の型があり、言葉だけの説明では伝えにくい状況です。", "question": "出力の形式とトーンを安定させるために、最も有効な進め方はどれですか。", "choices": {"A": "型に沿った問題例を内容を変えて2〜3問、<example>タグで囲んで示し、新しい問題の作成を依頼する。", "B": "毎回「前回と同じ形式で」とだけ伝え、過去の出力をどこまで再現するかはClaudeの判断に任せる。", "C": "例は示さず、形式のルールを多数の禁止表現として列挙し、守れていない出力はすべて破棄して再依頼する。", "D": "問題例を1問だけ示し、細部まで真似させるため、新しい問題の主題も例と同じものにして依頼する。"}, "answer": "A", "select_count": 1, "explanation": "Aが正解です。関連性が高く、内容に変化のある数問の例を、タグで指示と区別して示すと、形式・トーン・構造が最も安定します。Bは、新しい会話では前回の出力を参照できず、基準が曖昧なままです。Cは禁止事項の列挙だけでは望ましい形が伝わらず、破棄の手間も増えます。Dは例が1問で主題まで同じだと、例の細部を過度に写し取り、意図しない偏りが生じやすくなります。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q006", "statement_id": "A1-1", "pack": "gen", "angle": "troubleshoot", "role": "コンサルタント", "scenario": "コンサルタントが、顧客の議事録を貼り付けた同じ文面の末尾に「3つの観点で要約して」と書いて依頼しました。すると、議事録内の「次回までに資料を送付」という一文に応じた返答が混ざり、要約になっていません。", "question": "この結果の原因として最も妥当なものはどれですか。", "choices": {"A": "観点の数を限定したことで、Claudeが議事録の全体を読む余裕を失い、一部の文だけに反応した。", "B": "議事録と依頼が区切りなく同じ文面に混在し、資料内の文と指示の境界が曖昧になっていた。", "C": "役割が指定されていないため、Claudeが議事録の書き手の立場に合わせた返答をしようとした。", "D": "議事録が長い場合、Claudeは要約を断り、代わりに議事録内の依頼事項を実行する仕様である。"}, "answer": "B", "select_count": 1, "explanation": "Bが正解です。指示・資料・入力が混在するときは、<document>や<instructions>などのタグで種類ごとに区切ると、誤解釈が減ります。Aは観点数の限定が全体を読む妨げになる根拠がなく、指示と資料の取り違えを説明できません。Cは役割の有無が原因ではなく、役割を足しても境界の曖昧さは解消しません。Dは、長い資料を断って資料内の依頼を実行するという仕様は存在しません。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q007", "statement_id": "A1-2", "pack": "gen", "angle": "design-choice", "role": "マーケティング", "scenario": "マーケティング担当者が、新商品の発売に向けて、市場調査の要約、ターゲットのペルソナ、告知メール、SNS投稿文、ランディングページの文面を一式で用意する必要があります。担当者は、これらすべてを1回のリクエストでClaudeに依頼しようと考えています。", "question": "成果物の質を保つうえで、最も適切な進め方はどれですか。", "choices": {"A": "全成果物を1回で依頼し、出来上がった一式を最後にまとめて確認して、問題があれば全体を最初から再依頼します。", "B": "調査要約、ペルソナ、各チャネルの文面の順に依頼し、各段階の出力を確認・修正してから次の段階へ進みます。", "C": "全成果物を1回で依頼し、品質の確認はClaude自身に自己点検させて、問題なしと答えたものを承認とします。", "D": "チャネルごとに別々の新しいチャットで並行して依頼し、前段階の内容は共有せず、それぞれ独立に作成させます。"}, "answer": "B", "select_count": 1, "explanation": "B が正解です。成果物が多面的で大きい場合は、前の段階の成果（調査要約やペルソナ）を土台に次の段階を進める段階的な分解が有効で、段階ごとに人が確認することで、誤りや方向のずれが後続に広がる前に直せます。A は最後にまとめて確認するため、問題の原因が特定しにくく、全体のやり直しになりやすい進め方です。C は Claude 自身の自己点検を承認の代わりにしており、独立した確認になりません。D は前段階の成果を共有しないため、ペルソナと各文面の一貫性が失われます。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q008", "statement_id": "A1-2", "pack": "gen", "angle": "troubleshoot", "role": "プロジェクト管理", "scenario": "プロジェクトマネージャーが、進捗データの集計、リスク分析、経営層向け要約、翌週の計画案を含む週次報告書を、1つのプロンプトでClaudeに依頼しました。出力は後半ほど内容が薄く、集計表の数値にも誤りがありましたが、そのまま要約と計画案に反映されていました。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "Claudeは日本語の長文報告書を扱えないため、最初から英語で依頼し、あとで翻訳する進め方にすべきでした。", "B": "プロンプトに役割や口調の指定が足りず、Claudeが報告書の読み手を想定できなかったことが主な原因で、指定を加えれば集計の誤りも防げたはずです。", "C": "性質の異なる複数の成果物を一度に詰め込み、集計の確認も挟まなかったため、誤りが後続の内容にそのまま引き継がれました。", "D": "集計を依頼したこと自体が誤りで、数値を扱う作業は、Claudeに任せず、すべて人が手作業で行うべきでした。"}, "answer": "C", "select_count": 1, "explanation": "C が正解です。集計、分析、要約、計画という性質の違う作業を1回に詰め込むと、後半が薄くなりやすく、途中の集計誤りを確認する機会もないまま後続へ伝わります。集計→確認→分析→要約のように分解し、段階間で検証するのが適切です。A は日本語の長文を扱えないという前提が誤りです。B は口調や読み手の指定の不足であり、数値の誤りや内容の薄さの説明になりません。D は数値作業をすべて人手にする極端な結論で、確認を挟めば Claude を活用できます。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q009", "statement_id": "A1-2", "pack": "gen", "angle": "find-error", "role": "人事", "scenario": "人事担当者が、新しい職種の求人票を作るために、次の手順案を考えました。「①社内の職務記述書を要約させる、②要約から求める人材像を整理させる、③その人材像をもとに求人票を作成させる」。各ステップは、前のステップの出力を貼り付けて依頼します。", "question": "この手順案の運用で、最も不適切な点はどれですか。", "choices": {"A": "最初のステップで職務記述書の要約を依頼している点です。要約を省いて、最初から求人票を作らせるべきです。", "B": "各ステップで前の出力を次の依頼に貼り付けている点です。毎回まったく新しい情報だけで依頼する必要があります。", "C": "作業を3つに分けている点です。求人票のような文書は、分割せずに1回で依頼するのが最も効率的です。", "D": "①②の出力を人が確認する場面がなく、最後の求人票だけをチェックする点です。途中の誤りが引き継がれてしまいます。"}, "answer": "D", "select_count": 1, "explanation": "D が正解です。段階的に進める場合、ステップ間に検証チェックポイントを置かないと、要約や人材像の誤りが最終の求人票まで引き継がれ、原因の特定も難しくなります。A は職務記述書の内容を土台にするための要約で、適切な最初の段階です。B は前の出力を次の依頼に引き継ぐのが段階的なプロンプトの基本であり、誤りではありません。C は、求人票作成が複数の判断を含むため、分けた進め方のほうが確認しやすく、1回で行う必要はありません。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q010", "statement_id": "A1-2", "pack": "gen", "angle": "tradeoff", "role": "コンサルタント", "scenario": "コンサルタントが、明日の午前の打ち合わせまでに、競合5社の最新の動向を比較し、クライアントへの提言をまとめる必要があります。ウェブ上の最新情報が必要で、時間は限られていますが、誤りのある内容を社外に出すことはできません。", "question": "時間と正確さの両方を考えたとき、最も適切な進め方はどれですか。", "choices": {"A": "リサーチで5社の情報を集めて比較し、主要な主張を引用元で確認してから、提言づくりを別の依頼として進めます。", "B": "リサーチの結果を、そのままクライアントへの提言に使い、引用元の確認は、打ち合わせの後に余裕があれば行います。", "C": "最新情報が必要なため、拡張思考のみで5社の比較と提言を1回で依頼し、深く考えさせて、確認を省略します。", "D": "時間がないため、5社の調査と提言を1回の簡単な質問にまとめ、気になった点だけ、あとで人が個別に調べ直します。"}, "answer": "A", "select_count": 1, "explanation": "A が正解です。複数のソースにまたがる情報収集はリサーチが向いており、収集と提言の作成を分けることで、提言の土台となる主張を引用元で確認する検証チェックポイントを置けます。確認は短時間でも、社外に出す前に必要です。B は確認を後回しにしており、誤りが社外に出るリスクがあります。C の拡張思考は、ウェブの最新情報を必要としない複雑な推論に向くもので、最新動向の調査には合わず、確認の省略も不適切です。D は調査と提言を1回に詰め込み、確認も場当たり的です。", "source": "https://support.claude.com/ja/articles/11095361-ウェブ検索-拡張思考-リサーチはいつ使うべき", "created": "2026-11-21"}, {"id": "A1-q011", "statement_id": "A1-2", "pack": "gen", "angle": "design-choice", "role": "教育", "scenario": "大学の講師が、全15回の講座について、シラバス、各回の講義スライドの構成案、確認小テストを作成します。形式や用語を全回で統一したく、作業は数日にわたって行う予定です。", "question": "分解と順序付けの観点で、最も適切な進め方はどれですか。", "choices": {"A": "15回分のスライド構成案と小テストを、1回のプロンプトでまとめて依頼し、仕上がった全体を最後に一度だけ確認します。", "B": "回ごとに、毎回新しいチャットで必要な前提をその都度ゼロから伝え、各回の形式や用語は、Claudeの判断に任せます。", "C": "講座の方針と用語集をProjectに置き、シラバス、第1回、以降の回の順に依頼して、各段階の出力を確認しながら進めます。", "D": "最初に小テストを15回分すべて作らせ、そこから逆算して、スライド構成案とシラバスを、最後にまとめて作成させます。"}, "answer": "C", "select_count": 1, "explanation": "C が正解です。複数日にわたる大きな成果物は、共通の方針や用語集をProjectに置いたうえで、シラバス→各回と順序立てて分解すると、形式や用語が揃い、各段階で確認もできます。A は大きすぎる依頼を1回で行い、確認も最後だけで、不十分です。B は毎回ゼロから伝えるため、全回で共通の形式や用語を保てません。D は、土台となるシラバスや構成案より後に小テストを作る順序ではなく、確認も先送りになります。", "source": "https://assets.claude.com/b383cf6baddbfc72fdf8b0ed533a518e2872d531.pdf", "created": "2026-11-21"}, {"id": "A1-q012", "statement_id": "A1-2", "pack": "gen", "angle": "troubleshoot", "role": "オペレーション", "scenario": "オペレーション担当者が、1か月分の問い合わせ記録をClaudeに渡し、「内容の分類→分類別の件数集計→改善提案」の順に同じ会話で依頼しました。最終的な改善提案は、現場の実感とずれた内容でした。後から確認すると、最初の分類で、いくつかの問い合わせが別のカテゴリに誤って分けられていました。", "question": "改善提案がずれた原因として、最も妥当なものはどれですか。", "choices": {"A": "作業を3つの段階に分けたことが原因です。改善提案のような判断を含む作業は、分解せずに1回で依頼するべきでした。", "B": "分類の段階で出力を確認するチェックポイントを置かなかったため、誤分類が集計と提案にそのまま引き継がれました。", "C": "同じ会話で続けて依頼したため、Claudeが前の段階の分類結果を覚えておらず、集計の根拠を見失ったことが原因です。", "D": "改善提案の依頼文が短すぎたことが原因です。分類の精度は提案の質に影響せず、依頼文を詳しく書けば解決します。"}, "answer": "B", "select_count": 1, "explanation": "B が正解です。段階的に進める作業では、前の段階の出力が次の段階の入力になるため、分類のような土台の段階に検証チェックポイントがないと、誤りが集計と提案まで引き継がれます。分類の抜き取り確認を挟めば防げます。A は分解そのものではなく、検証の欠如が問題です。C は同じ会話内では前の出力を参照できるため、前提が誤っています。D は分類の精度が提案の質に直結するため、誤りです。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q013", "statement_id": "A1-3", "pack": "gen", "angle": "design-choice", "role": "マーケティング", "scenario": "マーケティング担当者が、新商品の案内メールの下書きをClaudeに依頼しました。出力は構成も内容も狙いどおりでしたが、文体が硬すぎて、読み手である既存顧客に向けた親しみやすさがありません。同じ会話の中で、次の対応を検討しています。", "question": "この状況で最も適切な進め方はどれですか。", "choices": {"A": "方向性は合っていても、プロンプトが根本的に悪いと考え、会話を閉じて最初から全く別の書き方でやり直します。", "B": "同じ会話で、読み手は既存顧客であることと、望む文体を具体的に伝え、直したい点を絞って修正を依頼します。", "C": "同じ依頼文を何度も送って再生成を繰り返し、偶然、文体が親しみやすい下書きが出るまで待ちます。", "D": "文体の調整はClaudeには難しいと判断して、下書きを破棄し、最初から人が文章をすべて書き直します。"}, "answer": "B", "select_count": 1, "explanation": "構成と内容が合っていて、不足しているのは読み手と文体という仕様だけです。この場合は、不足している文脈と望む文体を具体的に補い、直したい点に絞って反復改善するのが適切です（B）。方向性が合っている出力を捨てて全面的にやり直す（A）のは、うまくいっている部分まで失います。原因を特定せずに同じ依頼を繰り返す（C）と、仕様の不足は解消されません。文体の調整は具体的に指示すれば対応できるため、人が全面的に書き直す（D）必要はありません。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q014", "statement_id": "A1-3", "pack": "gen", "angle": "troubleshoot", "role": "人事", "scenario": "人事担当者がClaudeに「営業職の求人票を書いて」とだけ依頼したところ、どの会社にも当てはまるような一般的な文面が出力されました。自社の事業内容、求める人物像、働き方の特徴は一切伝えていません。担当者は、モデルの性能が足りないのではと考えています。", "question": "この出力が汎用的になった原因として最も妥当なものはどれですか。", "choices": {"A": "求人票という文書の種類がClaudeの得意な作業ではないため、モデルの能力そのものが不足していることが原因です。", "B": "「書いて」という依頼が丁寧さに欠けており、敬語を使った依頼文にしなかったことが、出力の質を下げた原因です。", "C": "営業職という職種の指定が広すぎたため、職種をさらに細かく分類して伝えなかったことだけが、出力の質を下げた原因です。", "D": "自社の事業、求める人物像、働き方といった背景情報が伝わっておらず、仕様の不足（文脈の欠如）が原因です。"}, "answer": "D", "select_count": 1, "explanation": "Claudeは、自社の規範や状況を知らない有能な新人のように、背景情報がなければ一般的な内容を返します。文脈の欠如が原因なので、事業・人物像・働き方を伝えるのが対処です（D）。文書作成はClaudeの得意分野であり、能力不足（A）は原因ではありません。依頼文の丁寧さ（B）は出力の具体性とは関係がありません。職種の粒度（C）より先に、自社固有の情報がないことが根本の不足です。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q015", "statement_id": "A1-3", "pack": "gen", "angle": "find-error", "role": "教育", "scenario": "研修担当者が「新人向けの研修資料を作って」と依頼したところ、内容が薄く、対象者のレベルに合わない資料が出力されました。担当者は改善の進め方を4つの案に整理しました。", "question": "この4つの案のうち、診断と改善の進め方として誤っているものはどれですか。", "choices": {"A": "原因は特定せず、同じプロンプトを何度か再生成して、その中から出来のよい出力を選べば、仕様の不足は解消されます。", "B": "対象者のレベル、研修の目的、扱う範囲が伝わっていたかを見直し、不足していた情報を追加したうえで再依頼します。", "C": "事情を知らない同僚にこのプロンプトを見せ、作業内容を理解できるかを確認し、迷う点があれば仕様を補います。", "D": "出力の不足点を具体的に挙げ、何を足し何を変えるかを伝える改善を重ね、成果を確かめながら少しずつ近づけます。"}, "answer": "A", "select_count": 1, "explanation": "出力が期待に合わないときは、まず仕様のどこが不足していたかを特定することが基本です。原因を特定しないまま再生成を繰り返す（A）と、仕様の不足は残ったままで、偶然に頼ることになるため誤りです。不足情報の見直し（B）、事情を知らない同僚に見せる確認（C）、不足点を具体的に伝える反復改善（D）は、いずれも適切な診断と改善の進め方です。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q016", "statement_id": "A1-3", "pack": "gen", "angle": "tradeoff", "role": "コンサルタント", "scenario": "コンサルタントが、クライアントへの提案に使う新興技術の最新動向をClaudeに質問しました。回答は読みやすいものの、古い情報が混ざり、根拠となる出典もありません。何度か言い回しを変えて質問しましたが、結果はほとんど変わりませんでした。提案の期限は明日で、正確さも求められます。", "question": "この状況で最も適切な判断はどれですか。", "choices": {"A": "ウェブ検索を使わずに拡張思考のみを使い、時間をかけて深く考えさせれば、最新の情報も得られると期待して質問します。", "B": "プロンプトに「最新の情報だけを使うこと」と太字で強調して加え、同じ質問を再度送って、結果が変わるかを確かめます。", "C": "言い回しの調整をやめ、最新情報を複数のソースから集めて引用付きでまとめるリサーチに切り替え、出典を確認して使います。", "D": "古い情報が混ざった回答を手作業で修正して、そのまま提案の資料に使い、足りない出典は後日、必要になった時点で補います。"}, "answer": "C", "select_count": 1, "explanation": "原因は言い回しではなく、最新情報の収集という作業にモデルの手持ちの知識だけで臨む、タスクの種類に合わない戦略にあります。複数ソースからの包括的な収集にはリサーチが向いており、出典を確認して使えば正確さも担保できます（C）。拡張思考は最新情報を必要としない複雑な推論に向いており、最新情報の取得にはなりません（A）。強調しても情報源は増えません（B）。出典を確認せずに使う（D）のは、正確さの要件を満たしません。", "source": "https://support.claude.com/ja/articles/11095361-ウェブ検索-拡張思考-リサーチはいつ使うべき", "created": "2026-11-21"}, {"id": "A1-q017", "statement_id": "A1-3", "pack": "gen", "angle": "design-choice", "role": "オペレーション", "scenario": "オペレーション担当者が、1つのプロンプトで「問い合わせ履歴の分類、傾向の分析、改善案の作成、経営層向けの要約」をまとめて依頼しています。出力の品質にばらつきがあり、どの段階で誤ったのかも、途中経過が見えず判断できません。", "question": "この状況で最も適切な見直しはどれですか。", "choices": {"A": "指示をさらに詳しく書き足して、1つのプロンプトに依頼内容を押し込み、1回の依頼ですべてが完結するようにします。", "B": "ばらつきの原因はモデルの性能にあるとみなし、より高性能なモデルに変えて、同じプロンプトを送り続けます。", "C": "最終の要約だけをClaudeに任せ、分類と分析と改善案の作成は、結果の確認が難しいため、すべて人が手作業で行います。", "D": "作業を段階ごとの依頼に分け、各段階の出力を人が確認してから次に進め、誤りが出た段階だけを見直します。"}, "answer": "D", "select_count": 1, "explanation": "複数の異なる作業を1つに詰め込んだ戦略が、タスクの性質に合っていません。段階ごとに依頼を分けて中間の出力を確認できるようにすれば、誤りの出た段階を特定して、その段階だけを改善できます（D）。指示を足して1回に押し込む（A）と、途中経過が見えない問題が解消されません。モデルの変更（B）は仕様の不足への対処になりません。全工程を人が行う（C）のは、問題の切り分けをせずに作業を放棄することになります。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q018", "statement_id": "A1-3", "pack": "gen", "angle": "troubleshoot", "role": "プロジェクト管理", "scenario": "プロジェクトマネージャーが、毎週の会議の議事録をClaudeに貼り付け、「まとめて」と依頼しています。週によって出力の形式や粒度が大きく異なり、担当者や期限が抜けることもあるため、チームへの共有に使えません。", "question": "出力が安定しない原因として最も妥当なものはどれですか。", "choices": {"A": "含める項目（決定事項、担当者、期限など）や形式といった制約を指定しておらず、曖昧な指示になっていることが原因です。", "B": "議事録の文章量が多すぎることが原因であり、会議を分割して議事録を短くしなければ、安定した出力は得られません。", "C": "「まとめて」という日本語の依頼がClaudeにとって難しい言い回しであることが原因で、英語での依頼に変える必要があります。", "D": "毎週同じ会話で依頼を続けていることが原因なので、会話を閉じて、新しい会話を作り直せば、形式の問題は解消します。"}, "answer": "A", "select_count": 1, "explanation": "何をどの形式でまとめるかが指定されていないため、毎回Claudeが解釈を変えます。これは曖昧な指示と制約の欠落という仕様の不足です。含める項目と形式を明示し、必要なら出力例を示すのが対処です（A）。議事録の分量（B）は、形式や項目が抜ける直接の原因ではありません。日本語の依頼が難しいという根拠はありません（C）。会話を新しくしても、仕様が曖昧なままなら同じ問題が起きます（D）。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q019", "statement_id": "A1-3", "pack": "gen", "angle": "find-error", "role": "人事", "scenario": "採用担当者が「魅力的な求人票を書いて」とだけClaudeに依頼したところ、どの会社にも当てはまりそうな汎用的な文面が返ってきました。依頼文には、職種の業務内容、求める人物像、掲載する媒体のいずれも書かれていませんでした。担当者は原因の診断と改善の進め方を検討しています。", "question": "診断と改善の進め方として不適切なものはどれですか。（2つ選択）", "choices": {"A": "「魅力的に」を「非常に魅力的に」と強調して再依頼し、表現の強さを上げる。", "B": "職種の業務内容と求める人物像、掲載する媒体を追記したうえで、同じ依頼を再度行って文面を確認する。", "C": "読者となる応募者層と、避けたい表現を指示に加えたうえで、文面をもう一度生成させて内容を比べる。", "D": "目指す文体の見本を添え、どの点を参考にしてほしいのかも併せて説明して、再度依頼し直してみる。", "E": "汎用的な文面になるのはモデルの限界と判断し、指示は変えずに人が全文を書き直す。"}, "answer": "A,E", "select_count": 2, "explanation": "A：汎用的になった原因は強調の不足ではなく、業務内容・人物像・媒体といった情報の欠如（コンテキスト不足）です。語調を強めても仕様は補われないため不適切です。E：出力が的外れな原因の多くはプロンプトの仕様不足であり、まず指示を診断して改善するのが基本です。モデルの限界と決めつけて手作業に移るのは不適切です。B：欠けていたコンテキストを補う、正しい改善です。C：読者像と避けたい表現という制約を加えるのは、曖昧さと制約の欠落への適切な対処です。D：見本は文体や構成を揃える有効な手段で、参考にしてほしい点を説明すれば一層効果的です。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q020", "statement_id": "A1-3", "pack": "gen", "angle": "tradeoff", "role": "教育", "scenario": "研修担当者が、情報セキュリティ資料の要点を新入社員向けに整理するようClaudeに依頼しました。返ってきた要約は構成も網羅性も良好ですが、専門用語が多く新入社員には難しい内容でした。依頼文には読者が新入社員であることを書いておらず、研修は明日で、修正に使える時間は限られています。", "question": "この状況で最も適切な対応はどれですか。（2つ選択）", "choices": {"A": "新しい会話を開いて資料を貼り直し、最初から全体を作り直して、一貫した内容に仕上げる。", "B": "読者が新入社員であることと資料の目的を、同じ会話の中で補足し、用語の扱い方を指示する。", "C": "構成と網羅性は良いのでその部分は維持するよう伝え、修正したい点だけに絞って指示する。", "D": "「もっとわかりやすく」とだけ繰り返し依頼し、望む出力になるまで同じ文言で再生成を続ける。", "E": "要約をやめてリサーチ機能に切り替え、外部の事例を集めて資料を作り直してもらう。"}, "answer": "B,C", "select_count": 2, "explanation": "B：原因は読者という文脈の欠如であり、不足した情報を補って反復するのが最短です。C：構成と網羅性は良好なので、直す点を限定して伝えれば、時間の制約のなかで良い部分を保てます。A：成果が良好な部分まで捨てることになり、同じ文脈不足のまま繰り返せば同じ結果になりかねません。D：曖昧な指示を繰り返しても仕様は増えず、改善しません。E：問題は情報収集ではなく読者に合わせた表現の水準であり、タスクに合わない手段への変更です。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A1-q021", "statement_id": "A1-3", "pack": "gen", "angle": "design-choice", "role": "プロジェクト管理", "scenario": "プロジェクトマネージャーが毎週、会議の議事録を貼り付けて「リスクをまとめて」とClaudeに依頼しています。回ごとに表の形式が異なり、懸念として話題に出ただけの発言がリスクに入る一方、実際のリスクが漏れることもあります。マネージャーは依頼文の見直し方を検討しています。", "question": "この状況で最も適切な見直しはどれですか。（2つ選択）", "choices": {"A": "表の列項目を指定し、記入例を1〜2件添えて、毎回の出力形式を揃えられるようにする。", "B": "「漏れなく正確に」と太字で書き足し、毎回の依頼で注意を促す表現を強めて依頼する。", "C": "議事録を人が事前に要点だけに短くまとめてから貼り付け、Claudeに渡す情報量を減らす。", "D": "このプロジェクトでの「リスク」の定義と拾う基準を明記し、判断に迷う項目は別枠に分けさせる。", "E": "拡張思考を使えば不足する仕様も補われるため、依頼文は据え置いて機能の設定だけ変える。"}, "answer": "A,D", "select_count": 2, "explanation": "A：形式のばらつきは出力形式の指定不足が原因で、列項目の指定と例示は形式と構造を揃える有効な手段です。D：何をリストに含めるかという基準が曖昧なことが取りこぼしと混入の原因なので、定義と判断基準を明記し、迷う項目を分けさせるのが適切です。B：強調は基準や形式という仕様を補わないため、改善になりません。C：判断の材料である議事録の情報を人が減らすと、リスクの根拠が失われかねず、仕様の不足も解消されません。E：機能を変えても、何をどの形式で出すかという仕様の欠落は補われません。", "source": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "created": "2026-11-21"}, {"id": "A2-q002", "statement_id": "A2-2", "pack": "gen", "angle": "find-error", "role": "オペレーション", "scenario": "オペレーション担当者が、アップロードした発注履歴の表からClaudeに拠点別の年間発注コストを集計させました。結果は計算手順つきで整然と示されており、この数値を明日の経営会議の資料に使う予定です。チームでは、使用前の確認方法について次の4案が出ました。", "question": "確認方法の案のうち、不適切なものはどれですか。", "choices": {"A": "表計算ソフトで同じ集計を別途行い、Claudeが示した拠点別の合計と一致するか、会議の前に突き合わせます。", "B": "計算手順が丁寧に示されているので、手順が正しいことの裏付けとみなし、再計算せずに数値を資料へ転記します。", "C": "拠点別の合計を足し上げた総額が、元の発注履歴にある総額と合うかを確認し、ずれがあれば原因を調べます。", "D": "元データから数件の拠点を抜き出して手計算し、重複行や欠損行が集計に影響していないかを確認します。"}, "answer": "B", "select_count": 1, "explanation": "正解（不適切なもの）はB。Claudeは計算を実行できますが、複雑な計算やミッションクリティカルな計算は、専門の数学ソフトや手作業など別の方法で検証する必要があります。手順が整って見えることは正しさの証拠ではなく、もっともらしいのに誤っている出力の典型的な見え方です。Aは表計算ソフトによる独立した再計算で、適切です。Cは総額の整合性を元データと照合するもので、不整合の検出に有効です。Dは抜き取りの手計算で、集計の誤りやデータの不備を確認でき、適切です。", "source": "https://support.claude.com/ja/articles/10366421-claudeは数学方程式と計算にどのように対応していますか", "created": "2026-11-21"}, {"id": "A2-q003", "statement_id": "A2-1", "pack": "gen", "angle": "design-choice", "role": "人事", "scenario": "人事担当者が、部門別の残業時間と手当額の合計をClaudeに計算させ、社内向けの集計表を作成しました。表は見やすく整っており、Claudeの計算手順の説明にも不自然な点はありません。この集計表は、各部門長が人件費の判断に使う予定です。", "question": "集計表を部門長に配布する前に、担当者はどうすべきですか。", "choices": {"A": "計算手順の説明が筋道立っているため、そのまま配布し、部門長から誤りの指摘があった時点で修正します。", "B": "合計値と手当額を、表計算ソフトの関数や電卓などで独立に再計算し、一致を確認したうえで配布します。", "C": "Claudeに同じ計算をもう一度実行させ、2回の結果が一致していれば検証済みとして配布します。", "D": "数値の信頼性は確保できないと判断し、数値は使わずに傾向を文章で説明するだけの資料に作り替えます。"}, "answer": "B", "select_count": 1, "explanation": "Claudeは計算を実行できますが、複雑な計算やミッションクリティカルな計算は、専門的なソフトウェアや手作業など別の方法で検証する必要があります。人件費の判断に使われる集計表は、まさにその対象です。Bは独立した方法で再計算するため、誤りを確実に見つけられます。Aは確認なしに配布し、誤りの発見を受け手に任せてしまいます。Cは同じClaudeに再実行させるだけで、独立した検証になりません。Dは数値をすべて捨てて、確認すれば使える有用な集計まで失ってしまいます。", "source": "https://support.claude.com/ja/articles/10366421-claudeは数学方程式と計算にどのように対応していますか", "created": "2026-11-21"}, {"id": "A2-q004", "statement_id": "A2-1", "pack": "gen", "angle": "troubleshoot", "role": "オペレーション", "scenario": "オペレーション担当者が、納期変更のお詫びメールを取引先へ送るようClaudeに依頼したところ、Claudeは「メールを送信しました」と返答しました。翌日、取引先から「メールは届いていない」と連絡がありました。この担当者のClaudeには、メール送信につながる連携は設定されていません。", "question": "この状況の原因として、最も妥当なものはどれですか。", "choices": {"A": "Claudeはメールに接続されていないのに、送信できたかのように答えた。使える機能を実際以上に述べる、典型的な誤りである。", "B": "取引先の迷惑メールフィルターが原因である。Claudeは実際にメールを送信しており、返答の内容自体は正確で、取引先側の受信設定だけが問題だった。", "C": "依頼文の宛先の指定が曖昧だったため、Claudeが取引先とは別の宛先へメールを誤送信してしまった。", "D": "Claudeの送信処理が混雑で遅れており、しばらく待てば取引先のメールボックスへ自動的に届く状態である。"}, "answer": "A", "select_count": 1, "explanation": "Claudeは、明示的に統合されていないメールなどの外部ツールにアクセスできません。それにもかかわらず、役に立とうとして、送信できたかのように主張することがあります。連携が設定されていない以上、Aが最も妥当です。Bは、そもそも送信が行われていないため成り立ちません。Cも、送信自体がされていないため誤送信は起こりえません。Dは、送信処理が存在しない以上、遅延して届くこともありません。Claudeが「実行した」と述べても、実際の成否は人が別途確認する必要があります。", "source": "https://support.claude.com/ja/articles/8241188-claudeは機能しないリンクを生成し-メールを送信したか外部ドキュメントを作成したと虚偽の主張をしています-何が起こっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q005", "statement_id": "A2-1", "pack": "gen", "angle": "find-error", "role": "マーケティング", "scenario": "マーケティングチームが、ウェブ検索を有効にしてClaudeに競合他社の新製品の動向を調べさせ、出典リンク付きの要約を受け取りました。この要約は、来週の社内戦略会議の資料に使われます。チームは出典の確認方法を話し合っています。", "question": "確認方法の案のうち、不適切なものはどれですか。", "choices": {"A": "発表内容の核となる主張については、引用されたページを開き、要約が原文の文脈を欠いたり歪めたりしていないかを確かめる。", "B": "引用元が公式発表なのか二次的な紹介記事なのかを見て、信頼性が低いものは根拠から外し、別の情報源で裏づけを取る。", "C": "最新の動向を扱う資料なので、要約中の日付や製品名などの具体的な記述が、引用元の記載と一致しているかを照らし合わせる。", "D": "出典リンクが付いていて根拠があるように見えるため、引用元の中身は開かず、要約をそのまま正として資料に転記する。"}, "answer": "D", "select_count": 1, "explanation": "ウェブ検索の結果を使う場合は、Claudeが引用した情報源を確認する必要があります。元のページには、要約に含まれていない重要な文脈や詳細があるかもしれません。回答の質は参照した情報源に左右されるため、原典を見ることで文脈なしでは誤解されやすい情報も見つけられます。Dはリンクがあることだけに頼り、内容の一致を確かめていないため不適切です。A、B、Cはいずれも、原文との照合や情報源の質の確認という、独立した検証になっています。", "source": "https://support.claude.com/ja/articles/8525154-claudeが不正確または誤解を招く回答を提供しています-どうなっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q006", "statement_id": "A2-1", "pack": "gen", "angle": "tradeoff", "role": "プロジェクト管理", "scenario": "プロジェクトマネージャーが、明日の定例会議で使う予算管理のExcelを、アップロードしたCSVデータをもとにClaudeに作成させました。会議までに使える時間は1時間ほどしかありません。ファイルには数式とグラフが含まれ、見た目は完成しています。", "question": "限られた時間の中で、最も適切な進め方はどれですか。", "choices": {"A": "Claudeが数式は自動で動くと説明しているため、内容の確認は省略し、ファイルを会議資料としてそのまま使用します。", "B": "時間をかけて確実を期すため、Excel内のすべての数式と数値を元のCSVから手作業で作り直し、置き換えます。", "C": "合計値や主要な数式を元のCSVと突き合わせて確認し、見つけた誤りは修正して、未確認の部分は会議で未確認と伝えます。", "D": "Claudeに「誤りはないか」と尋ね、問題ないとの返答があれば、確認済みの資料として会議で説明します。"}, "answer": "C", "select_count": 1, "explanation": "Claudeが作成したファイルは、要件を満たしているかを人が確認し、必要に応じて調整する前提で使うものです。時間が限られる場合は、判断に直結する合計値や主要な数式に確認を絞り、誤りは直し、未確認の範囲は正直に伝えるのが現実的です。Aは確認なしに使い、誤りのリスクを抱えたままにします。Bはすべてをやり直す必要はなく、時間内に終わらない可能性が高い過剰な対応です。Dは作成者自身に確認させるだけで、独立した確認になりません。", "source": "https://support.claude.com/ja/articles/12111783-claudeでファイルを作成-編集する", "created": "2026-11-21"}, {"id": "A2-q007", "statement_id": "A2-1", "pack": "gen", "angle": "design-choice", "role": "ナレッジワーカー", "scenario": "ナレッジワーカーが、長い会議の議事録をClaudeに要約させました。要約は読みやすく、書かれている内容はどれも議事録と一致しています。ただし、元の議事録で決まった「担当者の割り当て」の1件が、要約に入っていません。", "question": "この要約の扱いとして、最も適切なものはどれですか。", "choices": {"A": "書かれた内容はすべて正確なので、そのまま使用できると判断し、抜けた1件は読者が必要なときに尋ねる運用にします。", "B": "内容は正確でも完全性に欠けるため、元の議事録と照らして抜けを補う修正を加えたうえで、関係者に共有します。", "C": "抜けがある以上この要約は使えないとして全面的に破棄し、議事録の全文をそのまま全員に配布します。", "D": "要約をClaude自身に自己点検させ、抜けはないとの回答を得たため、元の議事録との照合は行わずに共有します。"}, "answer": "B", "select_count": 1, "explanation": "出力は、正確性だけでなく完全性や目的への適合性も、元資料に照らして評価します。この要約は正確ですが、担当者の割り当てという行動に直結する情報が欠けており、「修正が必要」に分類されます。Bは元資料と照合して抜けを補うため、要約の利点を保てます。Aは重要な抜けを放置し、読者に確認を委ねてしまいます。Cは、軽微な修正で使える要約を捨ててしまう過剰な対応です。Dは自己点検の結果に頼っており、元資料との独立した照合になっていません。", "source": "https://support.claude.com/ja/articles/8525154-claudeが不正確または誤解を招く回答を提供しています-どうなっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q008", "statement_id": "A2-1", "pack": "gen", "angle": "troubleshoot", "role": "教育", "scenario": "教員が、今学期に変わったばかりの制度についてウェブ検索を使わずにClaudeへ質問し、自信に満ちた説明を受け取りました。同僚が公式の資料と比べると、説明の一部に古い内容が混ざっていることが分かりました。Claudeの説明は文章として整っており、誤りに気づきにくいものでした。", "question": "この状況の原因として、最も妥当なものはどれですか。", "choices": {"A": "Claudeは最新の情報で学習されていない分野があり、直近の変更を尋ねられると、古い内容を自信ありげに述べることがある。", "B": "教員のアカウント情報から地域を誤って推測し、Claudeが別の地域の制度を、その地域の制度として説明してしまった。", "C": "質問の文章が丁寧すぎたため、Claudeが内容を過度に要約してしまい、最新の変更点だけが省かれてしまった。", "D": "教員の端末に古い回答のキャッシュが残っており、Claudeが生成した最新の回答が画面に反映されなかった。"}, "answer": "A", "select_count": 1, "explanation": "Claudeは、主題によっては最新の情報で学習されておらず、現在の出来事や直近の変更について、もっともらしいが不正確な回答をすることがあります。正しそうに読める文章でも、事実として誤っている場合があります。直近の制度の変更はまさにその典型です。B、C、Dは、この状況を説明する根拠がなく、原因として妥当ではありません。最新の情報が必要な場合は、ウェブ検索の利用や、公式資料との照合が必要になります。", "source": "https://support.claude.com/ja/articles/8525154-claudeが不正確または誤解を招く回答を提供しています-どうなっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q009", "statement_id": "A2-3", "pack": "gen", "angle": "design-choice", "role": "広報", "scenario": "広報担当者が、Claudeに社外向けプレスリリースの案を作成させました。案には業界統計の数値3つ、調査機関名付きの引用、提携先役員のコメントとされる文が含まれていますが、担当者はまだ根拠資料を確認していません。公開は明日の予定です。", "question": "公開前の対応として最も適切なものはどれですか。", "choices": {"A": "文章が整っており調査機関名も明記されているため、そのまま公開し、誤りが見つかれば後日訂正を出します。", "B": "Claudeに数値・引用・コメントの正確性を再確認させ、問題なしと回答を得たら確認済みとして公開します。", "C": "数値・引用・コメントをすべて削除して定性的な表現だけに書き換え、根拠の確認は省いて公開します。", "D": "数値・引用・コメントを原典と照合し、確認できない記述は削除したうえで、社外向けのため責任者の承認も得ます。"}, "answer": "D", "select_count": 1, "explanation": "プレスリリースは社外に出る成果物で、誤りは信用や説明責任に直結します。名前付きの引用や具体的な数値、特定の人物のコメントは、もっともらしく作られた内容が混ざりやすい箇所です。原典と独立に照合し、確認できないものを外し、責任者の承認を経るDが適切です。Aは引用が存在することに頼り、公開後の訂正という高いコストを前提にしています。BはClaudeに自分の出力を確認させるだけで、独立した検証になりません。Cは裏付けのある情報まで失い、価値を損ないます。", "source": "https://support.claude.com/ja/articles/8525154-claudeが不正確または誤解を招く回答を提供しています-どうなっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q010", "statement_id": "A2-3", "pack": "gen", "angle": "troubleshoot", "role": "オペレーション", "scenario": "オペレーション担当者が、Claudeのチャットに取引先への納期変更の連絡を依頼したところ、「メールを送信しました」と返答がありました。担当者はそれを信じて報告を済ませましたが、数日後、取引先から連絡が届いていないとの問い合わせがありました。この会話にはメール連携などの接続は設定されていません。", "question": "この問題の原因として最も妥当なものはどれですか。", "choices": {"A": "メール連携がないのに、Claudeが実行できない操作を実行したと誤って述べ、担当者が送信を確認しませんでした。", "B": "Claudeは正しくメールを送信しましたが、取引先のスパムフィルターが原因で、受信側で届かなかったと考えられます。", "C": "依頼文の指示が短すぎたため、Claudeが送信先や件名を正しく解釈できず、メールの送信が中断されました。", "D": "チャットの会話が長くなってメモリが不足し、送信処理の途中でClaudeが作業内容を忘れてしまいました。"}, "answer": "A", "select_count": 1, "explanation": "Claudeは明示的に統合されていないメールなどのツールにはアクセスできませんが、有用であろうとして機能を誤って主張する（幻覚する）ことがあります。送信という影響のある行為は、送信済みフォルダや相手の受信など、Claude以外の手段で確認すべき事項です。Bは送信自体が行われていない事実と合いません。Cは指示の解釈の問題ではなく、そもそも実行手段がないことが原因です。Dも同様に、メモリの問題ではなく、実行できない操作を実行したと述べたことが原因です。", "source": "https://support.claude.com/ja/articles/8241188-claudeは機能しないリンクを生成し-メールを送信したか外部ドキュメントを作成したと虚偽の主張をしています-何が起こっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q011", "statement_id": "A2-3", "pack": "gen", "angle": "find-error", "role": "コンサルタント", "scenario": "コンサルタントが、Claudeを使って顧客への提出用見積書の金額計算を行っています。チームは、成果物の用途に応じてレビューの深さを変える運用ルール案を検討しており、次の4つの案が出ました。", "question": "運用ルール案のうち、不適切なものはどれですか。", "choices": {"A": "社内で使うたたき台の概算は、担当者が内容に目を通して明らかな誤りがないかを確認すれば共有してよい。", "B": "顧客に提出する見積の金額計算は、Claudeの結果を表計算ソフトや手計算で別途検算してから提出する。", "C": "Claudeが「検算済みで誤りはない」と答えた見積の金額計算は、独立した検証を省略して顧客へ提出してよい。", "D": "誤りが契約や請求に影響する数値は、Claudeの結果を担当者が確認し、必要に応じて上長のレビューも受ける。"}, "answer": "C", "select_count": 1, "explanation": "複雑な計算や重要な計算は、専門のソフトウェアや手作業など別の方法で検証する必要があります。Claude自身の「検算済み」という回答は独立した検証ではなく、顧客提出物では誤りの影響が大きいため、Cが不適切です。Aは影響が小さい社内の下書きに見合った妥当な基準です。Bは重要な計算を別手段で検証する適切な方法です。Dは誤りの影響が大きい事項を、人によるレビューにエスカレーションする適切な運用です。", "source": "https://support.claude.com/ja/articles/10366421-claudeは数学方程式と計算にどのように対応していますか", "created": "2026-11-21"}, {"id": "A2-q012", "statement_id": "A2-3", "pack": "gen", "angle": "tradeoff", "role": "マーケティング", "scenario": "マーケティング担当者が、Claudeに自社サイトへ掲載するコラム記事の下書きを作らせました。記事には統計の数値、他社の事例、専門家の発言とされる文が多数含まれています。公開までの時間は限られており、全項目を同じ深さで確認することはできません。", "question": "時間の制約の中で、リスクを踏まえた最良の進め方はどれですか。", "choices": {"A": "文体と誤字だけを確認して公開し、事実関係はClaudeの文章が自然であることを根拠に問題ないものとして扱います。", "B": "誤りの影響が大きい統計・事例・発言を優先して原典と照合し、確認できないものは削除してから公開します。", "C": "Claudeに各主張の出典URLを付けさせ、URLが付いた記述はすべて確認済みとみなして、そのまま公開します。", "D": "確認の優先度を付けずに記事を頭から順に読み進め、時間切れになった箇所から先は未確認のまま公開します。"}, "answer": "B", "select_count": 1, "explanation": "社外に公開する記事では、誤りが説明責任に直結します。時間が限られる場合は、具体的な数値・事例・発言のように誤りの影響が大きく、作り話が混ざりやすい項目を優先して原典で確認し、確認できないものは外すのが適切です。Aは自然な文章であることを正確性と取り違えています。Cは出典として示されたURLが実在し内容を裏付けているかを確かめておらず、引用の確認になりません。Dはリスクに基づく優先付けがなく、未確認の箇所が公開されます。", "source": "https://support.claude.com/ja/articles/8525154-claudeが不正確または誤解を招く回答を提供しています-どうなっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q013", "statement_id": "A2-3", "pack": "gen", "angle": "design-choice", "role": "ナレッジワーカー", "scenario": "ナレッジワーカーが、来週の定例チーム会議のアジェンダ案と、前回議事録の要点整理をClaudeに作成させました。内容はチーム内だけで共有し、会議の場で参加者が修正できます。誤りがあっても、簡単に訂正できます。", "question": "共有前のレビューとして最も適切なものはどれですか。", "choices": {"A": "担当者が一読して前回議事録との食い違いがないかを確認し、必要な箇所を直したうえでチームに共有します。", "B": "社外の第三者による独立した検証と、部門長による承認を受けるまで、アジェンダ案をチームに共有しません。", "C": "作成者に確認の責任はなく、会議の場で参加者が誤りを指摘するまでは、Claudeの出力をそのまま正としておきます。", "D": "すべての記述を一次資料で逐一照合し、結果を文書化した検証記録を作成してから、チームに共有します。"}, "answer": "A", "select_count": 1, "explanation": "レビューの深さは、誤りが生じた場合の影響と用途に応じて決めます。社内限定で修正も容易な下書きなら、担当者による通読と修正で十分です。Bは影響の小さな成果物に対して外部検証と承認を求める過剰なレビューです。CはAIを使った業務の責任が使用者に残ることを無視しています。Dも同じく低リスクの用途に対して過剰で、業務の効率を損ないます。", "source": "https://support.claude.com/ja/articles/8525154-claudeが不正確または誤解を招く回答を提供しています-どうなっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q014", "statement_id": "A2-3", "pack": "gen", "angle": "troubleshoot", "role": "プロジェクト管理", "scenario": "プロジェクトマネージャーは、Claudeが作る週次の進捗メモが数か月間正確だったため、確認をやめて顧客向けの進捗報告書にも転記するようになりました。今回、報告書の完了日が実際の計画と異なっており、顧客から指摘を受けました。Claudeの使い方や設定は以前から変えていません。", "question": "この問題の根本的な原因として最も妥当なものはどれですか。", "choices": {"A": "過去の正確さを理由に、用途が社外提出に変わったのに、リスクに見合う確認やレビューの深さを維持しなかったことです。", "B": "進捗メモの作成に使うモデルの性能が突然低下したため、同じ使い方でも出力の品質が下がり、完了日に誤りが出たことが原因です。", "C": "週次メモの指示が短すぎたため、Claudeが完了日の記載ルールを把握できず、日付の誤りが生じたことです。", "D": "顧客向けの報告書にAIで作成した旨の注記を入れなかったため、誤りの責任が顧客側に移ったことです。"}, "answer": "A", "select_count": 1, "explanation": "Claudeは、正しく見えても誤ったことを書くことがあり、利用者はAIを唯一の情報源にせず、重要な内容を精査する責任を負い続けます。社内メモを社外の報告書に転用するなら、誤りの影響が大きくなるため、確認も深くすべきでした。Bは、使い方や設定を変えていないという状況から原因を特定できず、推測にとどまります。Cは数か月間は正確だった事実と合いません。Dは注記の有無にかかわらず、説明責任が作成者に残ることを誤解しています。", "source": "https://support.claude.com/ja/articles/8525154-claudeが不正確または誤解を招く回答を提供しています-どうなっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q015", "statement_id": "A2-4", "pack": "gen", "angle": "design-choice", "role": "オペレーション", "scenario": "オペレーション担当者が、部門の月次経費を管理する表をClaudeに作ってもらおうとしています。費目ごとの金額を入力するたびに合計と予算との差額が自動で再計算され、チームが毎月使い回せることが条件です。", "question": "この用途に最も適した出力の形式と進め方はどれですか。", "choices": {"A": "チャット内にマークダウンの表で金額と合計を書き出してもらい、毎月その表をコピーして数字だけを手で更新していきます。", "B": "費目ごとの合計の計算結果だけを文章で回答してもらい、毎月同じ依頼文を新しいチャットに貼り付けて再計算させます。", "C": "ファイル作成機能で、合計や差額を数式で自動計算するExcelスプレッドシートを作成してもらい、内容を確認して調整します。", "D": "費目の分類ルールを箇条書きで出力してもらい、計算は担当者が電卓で行って、結果を別の表に転記する運用にします。"}, "answer": "C", "select_count": 1, "explanation": "C が正解です。ファイル作成機能では、動作する数式を含むExcelスプレッドシートを生成でき、入力のたびに自動計算される再利用可能な表になります。ただし出力は要件どおりか確認し、必要に応じて調整します。A は静的な表で、毎回の更新と再計算が手作業になります。B は毎月の再依頼が必要で、再利用できる管理表になりません。D は計算と転記を人手に戻すもので、自動再計算という条件を満たさず、ミスも増えます。", "source": "https://support.claude.com/ja/articles/12111783-claudeでファイルを作成-編集する", "created": "2026-11-21"}, {"id": "A2-q016", "statement_id": "A2-4", "pack": "gen", "angle": "troubleshoot", "role": "広報", "scenario": "広報担当者がプレスリリース案の作成をClaudeに依頼したところ、「関係各社へメールを送信し、共有ドキュメントも作成しました。リンクはこちらです」と返答がありました。しかし、実際には誰にもメールが届いておらず、リンクを開いても何も表示されません。この担当者のClaudeには、メールやドキュメントのサービスは連携されていません。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "メールやドキュメント作成の手段が連携されていないのに、Claudeが実行できたかのような返答を生成した。実際には何も実行されていません。", "B": "Claudeのメール送信処理が混雑で遅れているだけで、しばらく待てば各社にメールが届き、ドキュメントのリンクも開けるようになります。", "C": "依頼文に宛先の情報が不足していたため、宛先と文面をより詳しく書いて再依頼すれば、Claudeがそのままメールを送信できるようになります。", "D": "セキュリティ設定が厳しく送信がブロックされているため、ネットワークの制限を緩めればClaudeがメールを送信できるようになります。"}, "answer": "A", "select_count": 1, "explanation": "A が正解です。Claudeは、明示的に連携されていないメールやワープロなどのツールにはアクセスできません。それでも有用であろうとして、できない操作を「やった」と述べたり、機能しないリンクを生成したりすることがあります。B は処理の遅延ではなく、そもそも実行されていません。C は、プロンプトを詳しくしても連携のないツールを使えるようにはなりません。D は、ネットワークの設定はコード実行のサンドボックスに関するもので、メール送信の手段を与えるものではありません。「送信した」という報告は鵜呑みにせず、実際の結果を確認します。", "source": "https://support.claude.com/ja/articles/8241188-claudeは機能しないリンクを生成し-メールを送信したか外部ドキュメントを作成したと虚偽の主張をしています-何が起こっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q017", "statement_id": "A2-4", "pack": "gen", "angle": "find-error", "role": "プロジェクト管理", "scenario": "Teamプランを使うプロジェクト管理担当者が、顧客から預かった機密の見積書PDFを添付して分析を依頼したチャットで、進捗ダッシュボードのアーティファクトを作成しました。このアーティファクトを、リンクを持つ人なら誰でも開ける設定で社外のパートナーに共有する準備をしています。", "question": "共有前の対応として、最も不適切なものはどれですか。", "choices": {"A": "まず組織内の特定のメンバーだけに共有範囲を絞り、表示内容を確認してから、社外へ広げるかどうかを判断します。", "B": "チャットに含まれる添付ファイルとダッシュボードの内容を見直して、社外に出してはいけない情報がないか確認します。", "C": "社外共有が組織の設定で許可されているかをオーナーに確認し、その結果をふまえて共有の方法を選びます。", "D": "共有されるのはダッシュボードだけで元の添付ファイルは見えないと判断し、内容を確認せずに社外向けリンクで共有します。"}, "answer": "D", "select_count": 1, "explanation": "D が不適切です。チャットで作成されたアーティファクトを共有すると、閲覧者はそのチャット内の添付ファイルとファイルにもアクセスできるようになります。機密の見積書を含むチャットを確認せずに社外へ共有すると、情報漏えいにつながります。A は範囲を絞って確認する慎重な進め方で適切です。B は共有前に機密文書を確認するという、まさに必要な対応です。C は、社外共有の可否はオーナーの設定に依存するため、事前確認として妥当です。", "source": "https://support.claude.com/ja/articles/9547008-アーティファクトを共有する", "created": "2026-11-21"}, {"id": "A2-q018", "statement_id": "A2-4", "pack": "gen", "angle": "tradeoff", "role": "コンサルタント", "scenario": "コンサルタントが、クライアントに本日中に提出する収益シミュレーションを作成しています。複数のシナリオで複利計算と費用の按分を行う必要があり、数値に誤りがあるとクライアントの投資判断に影響します。Claudeに計算を依頼できる時間は限られています。", "question": "時間の制約がある中で、正確さを確保する進め方として最も適切なものはどれですか。", "choices": {"A": "計算結果を文章で一度に回答してもらい、桁数や体裁が整っていることを確認できれば、そのまま資料に転記して提出します。", "B": "コード実行で計算させ、結果を表にまとめてもらったうえで、重要な数値は表計算ソフトなど別の手段で突き合わせてから提出します。", "C": "同じ計算を2回尋ねて答えが一致すれば、Claude自身の確認で十分とみなし、他の手段での検証は行わずに資料へ転記します。", "D": "計算の誤りを避けるため、資料から具体的な数値をすべて省き、「概ね改善する見込み」といった定性的な表現だけで提出します。"}, "answer": "B", "select_count": 1, "explanation": "B が正解です。正確さが求められる計算はコード実行で処理させるのが適切です。さらにClaudeは数学方程式や計算に対応できますが、複雑な計算やミッションクリティカルな計算は、専門的なソフトウェアや手動の方法で検証する必要があります。投資判断に影響する本件には、この独立した検証が欠かせません。A は体裁が整っていても正確とは限りません。C は同じ出どころの再確認で、独立した検証になりません。D は数値の価値を丸ごと捨てるもので、クライアントが求める分析を提供できません。", "source": "https://support.claude.com/ja/articles/10366421-claudeは数学方程式と計算にどのように対応していますか", "created": "2026-11-21"}, {"id": "A2-q019", "statement_id": "A2-4", "pack": "gen", "angle": "design-choice", "role": "教育", "scenario": "社内講師が、新入社員向けに10ページ程度の研修用の読み物をClaudeと作成しています。章ごとに何度も手直しし、同僚とも共有して、最終的には配布用にWordかPDFで出力したいと考えています。", "question": "この用途に最も適した出力の形式と進め方はどれですか。", "choices": {"A": "会話内の回答として本文を出力させ、手直しのたびに全文の再出力を依頼して、配布用の形式は自分で別のソフトに貼り付けて作ります。", "B": "データ形式で本文を出力してもらい、同僚が読める文書の形には、共有の直前に自分でまとめ直す作業を行い、章ごとの修正も、そのデータを自分で直接書き換えて対応します。", "C": "章ごとに新しいチャットを開始して本文を作り直し、完成した版を毎回コピーして、共有用の文書へ貼り替える運用にします。", "D": "ドキュメントのアーティファクトとして作成し、直したい箇所を選んでClaudeに修正を依頼し、共有したうえでWordやPDFへエクスポートします。"}, "answer": "D", "select_count": 1, "explanation": "D が正解です。アーティファクトは、会話の横で開き、編集や反復、共有、会話外での再利用を前提とした自己完結した成果物に向いています。ドキュメントでは、変更したいテキストを選んでClaudeに編集を依頼でき、Word、PDF、Markdownなどにエクスポートできます。A は会話内の回答のため、手直しや共有、配布用の出力が手作業になります。B は構造化データで、人が読む研修資料の形式として適していません。C は章ごとに作り直すため、全体の一貫性が保てず手間も増えます。", "source": "https://support.claude.com/ja/articles/17153992-アーティファクトとは何ですか-また-どのように使用しますか", "created": "2026-11-21"}, {"id": "A2-q020", "statement_id": "A2-4", "pack": "gen", "angle": "troubleshoot", "role": "マーケティング", "scenario": "マーケティング担当者が、接続した外部アプリから広告の成果データを取得して表示するダッシュボードのアーティファクトを作成し、「リンクを持つ誰でも」で社外の代理店に共有しました。担当者自身の画面では数値が表示されますが、代理店の担当者からは「枠は見えるがデータが表示されない」と連絡がありました。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "アーティファクトの共有が途中で解除されたため、代理店の担当者は最新版の内容にアクセスできなくなっており、枠だけが古い表示で残っています。", "B": "ダッシュボード作成時の依頼文に不備があり、Claudeが成果データを取得する処理を書き忘れて作成しています。", "C": "リンクだけで開いた組織外の閲覧者には、接続アプリやClaudeを使う部分が機能しないため、データ取得の部分が動作していません。", "D": "代理店の担当者が使うブラウザのバージョンが古く、アーティファクトの表示に必要な機能に対応できていません。"}, "answer": "C", "select_count": 1, "explanation": "C が正解です。「リンクを持つ誰でも」で組織外から開いた人は、アーティファクト自体は見られても、接続アプリやClaudeを使う部分は機能しません。閲覧者は自分の接続を使うため、作成者の接続のデータは表示されません。そのため、外部の相手に数値を見せたい場合は、数値を含む静的な形式で渡すなど、提供形式を変える判断が必要です。A は枠が見えており、共有は有効です。B は作成者の画面で数値が表示されており、取得処理は動いています。D は枠が表示されていることと合いません。", "source": "https://support.claude.com/ja/articles/9547008-アーティファクトを共有する", "created": "2026-11-21"}, {"id": "A2-q021", "statement_id": "A2-2", "pack": "gen", "angle": "troubleshoot", "role": "オペレーション", "scenario": "オペレーション担当者が、Claudeに「来週の倉庫メンテナンスの案内を主要な取引先10社にメールで送って」と依頼しました。Claudeは「10社への送信が完了しました」と返答しましたが、翌日になっても取引先から返信はなく、2社に確認すると「メールは届いていない」と言われました。この会話では、メールなどの外部サービスとの連携は設定されていません。", "question": "取引先にメールが届いていない原因として、最も妥当なものはどれですか。", "choices": {"A": "取引先側のセキュリティ設定が厳しく、送信されたメールがすべて迷惑メールとして自動的に隔離された。", "B": "依頼文に件名の指定がなかったため、Claudeが送信を保留し、その旨を担当者に伝え忘れた。", "C": "Claudeにはメールを送信する連携がなく、実際には行っていない送信を「完了した」と述べた。", "D": "会話が長くなって送信の記録が失われ、Claudeが過去の送信結果を正しく参照できなくなった。"}, "answer": "C", "select_count": 1, "explanation": "正解はC。Claudeは、明示的に統合されていないメールなどのツールにはアクセスできません。それでも有用であろうとするあまり、機能を持っているかのように「送信しました」と述べること（機能の幻覚）があります。連携が設定されていない状況で完了報告が出たこと自体が根拠のない内容であり、送信結果は送信側のログや受信側で独立に確認する必要があります。Aは、そもそも送信が行われていないため原因になりません。Bは、保留したのであれば完了と報告する理由がなく、状況と整合しません。Dは、記録が失われたとしても送信していない事実は変わらず、完了を報告した説明にもなりません。", "source": "https://support.claude.com/ja/articles/8241188-claudeは機能しないリンクを生成し-メールを送信したか外部ドキュメントを作成したと虚偽の主張をしています-何が起こっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q022", "statement_id": "A2-2", "pack": "gen", "angle": "tradeoff", "role": "広報", "scenario": "広報担当者が、Claudeのリサーチ機能で業界動向レポート（出典URL付き、約20ページ）を作成しました。このうち統計3件と専門家のコメント1件を、今日の午後に配信する社外向けプレスリリースに使う予定で、締め切りまで2時間あります。レポートの他の部分は社内メモとしてのみ使います。", "question": "時間の制約がある中で、最も適切な進め方はどれですか。", "choices": {"A": "リリースに使う統計3件と専門家コメントについて、引用元の原文を開いて内容と文脈が合っているか確認し、確認できないものは外す。", "B": "出典URLが付いたリサーチ結果なので信頼できるとみなし、そのまま原稿に使い、配信後に指摘があれば訂正を出す方針にする。", "C": "社内メモ用の部分も含むレポート全体を引用元と照合し終えるまで、リリースの配信を延期して関係先に連絡する。", "D": "Claudeに各主張の確からしさを自己評価させ、確信度が高いと答えた統計とコメントだけを原稿に採用する。"}, "answer": "A", "select_count": 1, "explanation": "正解はA。社外に公開される内容は誤りの影響が大きいため、使う主張に絞って、引用元の原文で内容と文脈を確認するのが、限られた時間で最も効果的です。引用元には、Claudeの要約に含まれていない重要な文脈が書かれていることがあり、確認できない主張は外す判断もできます。Bは、出典の記載があることと内容が正しいことを混同しており、公開後の訂正ではリスクを防げません。Cは、社内メモ用の部分まで確認の対象を広げており、リスクの高い箇所に時間を集中できず、配信も遅れます。Dは、Claude自身の自己評価は独立した裏付けにならず、確信を持って述べられた誤りを見逃します。", "source": "https://support.claude.com/ja/articles/8525154-claudeが不正確または誤解を招く回答を提供しています-どうなっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q023", "statement_id": "A2-2", "pack": "gen", "angle": "find-error", "role": "マーケティング", "scenario": "マーケティング担当者が、手元に資料を用意しないまま、競合分析の資料に使う次のプロンプトをClaudeに送ろうとしています。「国内の化粧品EC市場について、競合上位5社の直近の市場シェアを一覧にしてください。分からない場合でも、推測で具体的な割合を必ず示してください。」", "question": "このプロンプトで、根拠のない情報が出力されるリスクを最も高めている点はどれですか。", "choices": {"A": "回答の形式を一覧で求めており、一覧では各数値の出典や条件を示せなくなる点。", "B": "裏付けとなる資料を渡さず、分からない場合でも推測で具体的な割合を示すよう求めている点。", "C": "回答に根拠を示すよう求めており、存在しない出典の作成をClaudeに促してしまう点。", "D": "調査対象の期間を細かく指定しておらず、Claudeが比較する年度を選べなくなる点。"}, "answer": "B", "select_count": 1, "explanation": "正解はB。根拠となる資料がない状態で、分からなくても推測で具体的な数値を必ず出すよう求めると、Claudeはもっともらしい架空の割合を自信をもって示しやすくなります。分からない場合は分からないと答えてよいと伝え、使う前には出典で確認する必要があります。Aは、一覧にしても出典を併記できるため、リスクを高める主因ではありません。Cは、根拠を求めること自体は良い習慣で、問題はその出典を実際に開いて確認するかどうかです。Dは、期間の指定不足は結果の精度に影響しますが、根拠のない数値を作らせる圧力にはなりません。", "source": "https://support.claude.com/ja/articles/8525154-claudeが不正確または誤解を招く回答を提供しています-どうなっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q024", "statement_id": "A2-2", "pack": "gen", "angle": "design-choice", "role": "プロジェクト管理", "scenario": "プロジェクトマネージャーが、Claudeに12の作業パッケージの費用を部門別に按分させ、税と予備費を加えた総額を計算させました。Claudeは途中式を示した詳しい説明を付けて結果を出しました。この数値は、明日の運営会議で承認を得る予算案の根拠になります。", "question": "提出前の対応として、最も適切なものはどれですか。", "choices": {"A": "Claudeに同じ計算をもう一度実行させ、2回の結果が一致したため、検証済みとして運営会議に提出する。", "B": "途中式がていねいに示されていて論理に矛盾もないため、計算に誤りはないと判断し、そのまま提出する。", "C": "数値が多く確認に時間がかかるため、端数を丸めた概算に置き換えて、概算である旨を添えて提出する。", "D": "合計と部門別の按分の結果を、表計算ソフトの数式や手計算など別の手段で再計算し、一致を確認する。"}, "answer": "D", "select_count": 1, "explanation": "正解はD。Claudeは計算を実行できますが、複雑な計算や重要な意思決定を左右する計算は、専門のソフトウェアや手計算など別の手段で検証する必要があります。承認の根拠になる予算は、誤りの影響が大きい用途です。Aは、同じClaudeによる再計算は独立した検証ではなく、同じ誤りが繰り返されることもあります。Bは、説明がていねいで筋が通って見えても、計算が正しい保証にはなりません。Cは、確認を省くために精度を下げており、予算の根拠という用途に合いません。", "source": "https://support.claude.com/ja/articles/10366421-claudeは数学方程式と計算にどのように対応していますか", "created": "2026-11-21"}, {"id": "A2-q025", "statement_id": "A2-2", "pack": "gen", "angle": "troubleshoot", "role": "人事", "scenario": "人事担当者が、先月施行された労務関連の制度改正についてClaudeに質問したところ、条文番号と施行日まで具体的に示された回答が返ってきました。社内の就業規則改定案に使おうとしましたが、同僚から「公式の改正内容と食い違っている」と指摘されました。", "question": "この状況の分析として妥当なものはどれですか。（2つ選択）", "choices": {"A": "最近の出来事については、Claudeの情報が最新ではなく、改正後の内容を反映できていない可能性がある。", "B": "質問文が丁寧すぎたため、Claudeが回答を簡略化し、条文番号や施行日を不正確に書いてしまった。", "C": "条文番号と施行日が具体的に示されている回答は、法令データベースを照会した確定情報とみなせる。", "D": "権威的で説得力のある書き方であっても、事実に基づかない内容が含まれていることがある。", "E": "同じ質問を数回繰り返し、最も多く返ってきた回答を正しい内容として採用すれば問題ない。"}, "answer": "A,D", "select_count": 2, "explanation": "Aは正しい。Claudeは最新の情報で学習されていない分野があり、最近の出来事について不正確な回答をすることがある。Dは正しい。Claudeは説得力があるように見えても事実に基づかない内容を書くことがあり、具体性は正確さの証拠にならない。Bは誤り。質問の丁寧さが不正確さの原因になるという根拠はない。Cは誤り。具体的な数字や番号が出ていても、確定情報とは限らず、むしろ検証が必要な典型的なパターンである。Eは誤り。繰り返しの多数決は独立した裏付けではなく、同じ誤りが繰り返される可能性がある。公式の情報源で確認すべきである。", "source": "https://support.claude.com/ja/articles/8525154-claudeが不正確または誤解を招く回答を提供しています-どうなっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q026", "statement_id": "A2-2", "pack": "gen", "angle": "tradeoff", "role": "広報", "scenario": "広報担当者が、Claudeのウェブ検索を使って業界動向を調べ、プレスリリース案を作成しました。案には出典リンク付きの統計と、業界団体のコメントが含まれています。本日中の公開が予定されており、確認に使える時間は限られています。", "question": "公開前の確認として適切なものはどれですか。（2つ選択）", "choices": {"A": "Claudeに「この内容に誤りはないか」と再度尋ね、問題ないと回答が返れば確認済みとして扱う。", "B": "社外に出る統計と団体コメントを優先し、引用元の原文を開いて内容や文脈が一致するか確認する。", "C": "出典リンクが付いている主張は、Claudeが原典を正確にまとめたものとみなして確認を省略する。", "D": "確認に時間がかかるため、数値やコメントはすべて削除して一般的な表現だけに書き換える。", "E": "原文で確認できなかった主張は、別の信頼できる情報源で裏付けを取るか、記載を取り下げる。"}, "answer": "B,E", "select_count": 2, "explanation": "Bは正しい。Claudeの要約には元のサイトにある重要な文脈や詳細が含まれていないことがあるため、引用元の原文を確認する。Eは正しい。確認できない主張は独立した情報源で裏付けるか、載せないという判断が必要である。Aは誤り。Claudeに自分の出力を確認させても独立した検証にならない。Cは誤り。出典リンクがあることと、内容が正確であることは別である。Dは誤り。裏付けのある内容とない内容を区別せず削除すると、資料の価値を損なう。", "source": "https://support.claude.com/ja/articles/8525154-claudeが不正確または誤解を招く回答を提供しています-どうなっているのでしょうか", "created": "2026-11-21"}, {"id": "A2-q027", "statement_id": "A2-2", "pack": "gen", "angle": "design-choice", "role": "コンサルタント", "scenario": "コンサルタントが、クライアントの役員会で投資判断に使う収益シミュレーションの計算をClaudeに依頼しました。結果は表にまとめられ、計算の手順も丁寧に説明されています。役員会は来週で、この数値が意思決定の根拠になります。", "question": "この結果を使う前の対応として適切なものはどれですか。（2つ選択）", "choices": {"A": "意思決定に直結する計算結果は、表計算ソフトなど別の手段で再計算し、Claudeの結果と突き合わせる。", "B": "計算の手順が丁寧に説明されていれば結果も正しいとみなして、最終的な数値をそのまま資料に載せる。", "C": "合計と内訳など、資料内の数値同士に食い違いがないかを確認し、不整合があれば原因を調べる。", "D": "Claudeに同じ計算をもう一度やり直させ、結果が一致すれば検証が完了したものとして扱う。", "E": "数値は大まかに見て妥当そうなので計算の検証は省略し、文章表現の確認だけを丁寧に行う。"}, "answer": "A,C", "select_count": 2, "explanation": "Aは正しい。複雑な計算やミッションクリティカルな計算は、専門的なソフトウェアや手動の方法で検証すべきである。Cは正しい。出力内の不整合は根拠のない内容の兆候であり、使用前に確認して原因を調べる。Bは誤り。説明が丁寧でも正確さの保証にはならない。Dは誤り。同じClaudeによる再計算は独立した裏付けにならない。Eは誤り。見た目の妥当性だけで検証を省くと、誤りを見逃す。", "source": "https://support.claude.com/ja/articles/10366421-claudeは数学方程式と計算にどのように対応していますか", "created": "2026-11-21"}, {"id": "A3-q001", "statement_id": "A3-1", "pack": "gen", "angle": "design-choice", "role": "マーケティング", "scenario": "マーケティング担当者が、新規参入を検討している市場の競合3社について、公開Webの情報と、連携済みの社内ドキュメントの両方を調べて比較し、詳細なレポートにまとめたいと考えています。レポートは会議資料として使うため、情報の出典も確認できる形にする必要があります。", "question": "このタスクに最も適したClaudeの機能はどれですか。", "choices": {"A": "ウェブ検索を1回だけ実行して上位の結果を要約させます。短時間で済み、競合3社の比較にも十分に対応できる方法です。", "B": "拡張思考だけを使い、Claudeがもともと持つ知識から競合の動向を複数の角度で深く考察させ、比較レポートにまとめます。", "C": "リサーチを使い、ウェブと連携済みの社内情報の複数のソースを横断して調べさせ、出典を引用した比較レポートを作成します。", "D": "新しいチャットで競合の社名だけを入力し、メモリに蓄積された情報を根拠に、比較表とレポートを作成させます。"}, "answer": "C", "select_count": 1, "explanation": "リサーチは、複数回のツール呼び出しを要する包括的な情報収集に向き、ウェブと連携機能にまたがる複数ソースの情報を、出典付きの詳細なレポートに統合できます。今回の「Webと社内情報の両方を調べ、出典つきで比較する」という要件に合致します。ウェブ検索（A）は1〜2回のツール呼び出しで答えられる単純な事実確認向きで、複数ソースの統合や詳細レポートには不足します。拡張思考のみ（B）は最新情報や社内情報を取得せず、推論の深さを高めるだけなので、調査の代わりにはなりません。メモリ（D）は過去の会話から得た作業上のコンテキストを保持する機能で、競合の最新動向を網羅的に調べる手段ではなく、出典の確認もできません。", "source": "https://support.claude.com/ja/articles/11095361-ウェブ検索-拡張思考-リサーチはいつ使うべき", "created": "2026-11-21"}, {"id": "A3-q002", "statement_id": "A3-1", "pack": "gen", "angle": "troubleshoot", "role": "プロジェクト管理", "scenario": "Teamプランを使うプロジェクト管理担当者は、先週まで新しいチャットでも自分の役割や進行中の案件をClaudeが覚えていて助かっていました。ところが今週から、新しいチャットで何も引き継がれなくなりました。本人は設定でメモリをリセットしておらず、使用するモデルも変えていません。同僚も同じ症状で、各自でメモリをオンに戻すことができません。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "組織のオーナーが、組織全体のメモリ機能をオフにしたため、各メンバーは自分でメモリを使用することも、オンに戻すこともできなくなっています。", "B": "使用するモデルのティアが以前と異なるため、モデルをまたいではメモリが引き継がれず、個々の会話の内容が失われてしまっており、同僚にも同じ影響が出ています。", "C": "努力レベルが低く設定されているため、Claudeが応答の前にメモリを参照する思考を省略し、保存済みの情報を使えなくなっています。", "D": "古い会話が保持期間の経過で削除され、その会話から作られたメモリのエントリも自動的にすべて削除されてしまったためです。"}, "answer": "A", "select_count": 1, "explanation": "TeamやEnterpriseでは、オーナーが組織設定で組織全体のメモリをオフにでき、オフにされるとClaudeは全ユーザーのメモリの使用と保存を止め、ユーザー個人では再度オンにできません。複数のメンバーに同時に同じ症状が出て、個人でオンに戻せない点が、この原因を示しています。モデルの切り替え（B）や努力レベル（C）はメモリの利用可否を決めるものではなく、いずれも本人が変更していないという条件とも合いません。会話が削除されても、そこから生成されたメモリのエントリは削除されないため（D）も誤りです。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A3-q003", "statement_id": "A3-1", "pack": "gen", "angle": "find-error", "role": "コンサルタント", "scenario": "コンサルタントが、3社のクライアント案件を並行して支援しています。案件ごとに用語や文書のトーンが異なるため、Claudeに各案件の背景を安定して理解させ、情報が混ざらないようにする運用案を検討しています。", "question": "次の運用案のうち、不適切なものはどれですか。", "choices": {"A": "クライアントごとにProjectを作成し、その案件の関連資料をナレッジとして追加して、案件の背景をClaudeに参照させます。", "B": "各案件固有のトーンや文書の書き方の指示は、そのクライアントのProjectの指示に書き、その案件のチャットだけに適用します。", "C": "他の案件の情報を混ぜたくない単発の相談では、最初のメッセージを送る前にメモリをオフにして、新しいチャットを始めます。", "D": "3社それぞれの用語や文書のルールを、アカウント全体の指示にまとめて書き、すべての会話で3社分のルールを毎回適用させます。"}, "answer": "D", "select_count": 1, "explanation": "アカウント全体の指示は、Claudeとのすべての会話に適用される設定です。クライアントごとに異なるルールを書くと、どの案件の会話にも3社分が常に適用され、無関係な案件に別のクライアントのルールが入り込みます。案件固有の指示や背景は、その案件のチャットにだけ適用されるProjectの指示とナレッジに置くのが適切です（A・Bは適切）。単発の相談でメモリを使わせたくない場合は、最初のメッセージの前にそのチャットのメモリをオフにできます（Cは適切）。", "source": "https://support.claude.com/ja/articles/10185728-claudeのパーソナライゼーション機能を理解する", "created": "2026-11-21"}, {"id": "A3-q004", "statement_id": "A3-1", "pack": "gen", "angle": "tradeoff", "role": "人事", "scenario": "人事担当者が、ある従業員の処遇について、個人名を伏せずに一度だけClaudeに相談して考えを整理したいと考えています。この相談の内容は、Claudeのチャット履歴にも、メモリにも、他の会話からの過去チャット検索の対象にも残したくありません。普段はメモリを使って仕事の文脈を引き継がせています。", "question": "この要件を最もよく満たす方法はどれですか。", "choices": {"A": "通常のチャットでメモリをオフにして相談します。メモリには残りませんが、チャットは履歴に残り、他の会話からの検索で見つかる可能性があります。", "B": "ゴーストアイコンからシークレットチャットを開き、相談します。履歴にもメモリにも保存されず、過去チャット検索の対象にもなりません。", "C": "人事専用のProjectの中で通常どおり相談し、終わったらその会話を削除します。会話を削除すれば、生成済みのメモリも消えるためです。", "D": "通常のチャットで相談し、終わったらメモリの設定画面から「メモリをリセット」を選んで、保存された内容を消去します。"}, "answer": "B", "select_count": 1, "explanation": "シークレットチャットは、チャット履歴にもClaudeのメモリにも保存されず、Claudeが以前の会話を検索する際にも取得されません。要件の3点すべてを満たします。メモリをオフにしたチャット（A）はメモリを使いも保存もしませんが、履歴に残り、他の会話の検索で見つかります。会話を削除しても、そこから生成されたメモリのエントリは削除されないため、Projectで相談して後で消す案（C）は成立しません。メモリのリセット（D）はすべてのメモリを恒久的に消すため、普段使っている仕事の文脈まで失い、取り消しもできません。なお、組織の保持設定によっては、シークレットチャットも一定期間保持されることがあります。", "source": "https://support.claude.com/ja/articles/12260368-シークレットチャットを使用する", "created": "2026-11-21"}, {"id": "A3-q005", "statement_id": "A3-1", "pack": "gen", "angle": "design-choice", "role": "広報", "scenario": "Teamプランを使う広報チームでは、過去のプレスリリースと社内の文体ガイドを、複数のメンバーが今後数か月にわたり繰り返し参照しながら、新しいリリースの下書きをClaudeと作成する予定です。メンバーによって文体がばらつかないようにしたいと考えています。", "question": "この業務に最も適した機能の使い方はどれですか。", "choices": {"A": "チーム用のProjectを作成し、過去のリリースと文体ガイドをナレッジに、文体のルールをプロジェクト指示に設定して、メンバーと共有します。", "B": "メンバーが下書きのたびに、過去のリリースと文体ガイドを新しいチャットへ貼り付け、毎回同じ内容をClaudeに渡し、版の違いは各自の判断で調整します。", "C": "広報チームの文体ルールを各メンバーのアカウント全体の指示に書き、あらゆる会話でそのルールを適用させます。", "D": "各メンバーが「覚えておいて」とClaudeに頼んで、過去のリリースの全文をメモリに保存させ、個人のメモリで共有します。"}, "answer": "A", "select_count": 1, "explanation": "Projectは、独自のナレッジベースとプロジェクト指示を持つ独立したワークスペースで、TeamやEnterpriseでは権限を設定してメンバーと共有できます。資料と文体のルールを一か所に置けば、全員が同じ前提で作業でき、継続的に使う業務に向きます。毎回貼り付ける方法（B）は手間がかかり、版や内容のばらつきも生みます。アカウント全体の指示（C）は広報以外の会話にも適用されてしまい、チームでの共有も想定していません。メモリ（D）は個人ごとの作業上のコンテキストを覚える機能で、他のメンバーとは共有されず、文書の全文を保管して参照させる用途には向きません。", "source": "https://support.claude.com/ja/articles/9517075-プロジェクトとは何ですか", "created": "2026-11-21"}, {"id": "A3-q006", "statement_id": "A3-1", "pack": "gen", "angle": "troubleshoot", "role": "教育", "scenario": "教務担当者が、各年度の履修要項や学内規程を数多くアップロードしたProjectを使っています。ナレッジが大きくなって以降、今年度の要項について質問すると、ときどき前年度の記述に基づく回答が返ってきます。アップロードしたファイル名は「資料1」「最終」「最終_新2」のようなものが多く、質問も「要項の履修条件は？」と大まかです。", "question": "この問題の原因として最も妥当なものはどれですか。", "choices": {"A": "ナレッジの量が増えて検索を使うモードに切り替わったため、回答の品質が必ず下がります。ナレッジを減らして、元の処理方式に戻すべきです。", "B": "Projectのナレッジは前年度の資料を優先して読み込む仕様のため、毎年度の初めにProject自体を新しく作り直す必要があります。", "C": "ウェブ検索がオフになっているため、最新の履修要項をインターネットから取得できず、古い資料に基づいて回答してしまいます。", "D": "ファイル名からどの年度の資料か判別できず、質問も対象資料を特定していないため、関連する情報の検索で古い版が選ばれやすくなっています。"}, "answer": "D", "select_count": 1, "explanation": "ナレッジが大きくなると、Claudeは自動的にプロジェクト知識の検索（RAG）を使い、質問に関連する情報を取り出して回答します。このとき、わかりやすいファイル名を付けることや、質問で特定の資料を名前で指定することが推奨されています。名前から年度が判別できず質問も曖昧だと、古い版が取り出されやすくなります。RAGに切り替わっても応答品質はコンテキスト内処理と同等に保たれるため、品質が必ず下がるという前提（A）は誤りです。Projectが古い資料を優先する仕様はなく、作り直す必要もありません（B）。ウェブ検索は、Projectにアップロードした資料の取り違えとは関係がありません（C）。", "source": "https://support.claude.com/ja/articles/11473015-プロジェクト向けretrieval-augmented-generation-rag", "created": "2026-11-21"}, {"id": "A3-q007", "statement_id": "A3-2", "pack": "gen", "angle": "design-choice", "role": "オペレーション", "scenario": "カスタマーサポートの運用担当者が、毎朝届く約50件の問い合わせメールを「請求」「配送」「その他」の3種類に仕分け、担当チームへ振り分ける作業をClaudeで効率化しようとしています。件名と本文の冒頭を見れば判断でき、誤分類があっても担当者が当日中に気づいて直せる定型作業です。", "question": "この作業に最も適したモデルと努力レベルの方針はどれですか。", "choices": {"A": "取りこぼしを避けるため、常に最上位のモデルを最大努力で使い、分類の精度を最大限に高めます。", "B": "日常的な定型作業なので、低から中の努力レベルで十分とみなし、使用量と待ち時間を抑えて処理します。", "C": "毎回、思考の過程を展開して全件の根拠を読み、人がすべての分類結果を承認してから振り分けます。", "D": "件数が多く判断が重要なため、Claudeは使わず、担当者が手作業で仕分ける運用に切り替えます。"}, "answer": "B", "select_count": 1, "explanation": "B が正解です。低と中は日常的なタスクに適しており、使用量も節約できます。簡単で修正も容易な仕分けに高い努力は不要です。A は、タスクの複雑さと重要度に見合わない過剰な設定で、使用量と時間を無駄にします。C は、定型の仕分けに全件の思考過程レビューを課すことになり、効率化の目的に反します。D は、Claude に適した定型作業を使わない判断で、時間とコストの面で合理的ではありません。", "source": "https://support.claude.com/ja/articles/8664678-モデル-努力レベル-思考設定を変更する", "created": "2026-11-21"}, {"id": "A3-q008", "statement_id": "A3-2", "pack": "gen", "angle": "troubleshoot", "role": "プロジェクト管理", "scenario": "プロジェクトマネージャーは、毎週月曜に20行ほどの進捗メモを3行に要約する作業を、常に最大努力に設定したClaudeで行っています。最近、午後になる前に使用制限に達してしまい、重要な計画作業ができなくなることが続いています。要約の品質は以前から十分でした。", "question": "使用制限に早く達してしまう原因として最も妥当なものはどれですか。", "choices": {"A": "簡単な要約にも最大努力を使っており、応答ごとの思考とトークンの消費が増えて、制限に早く達している。", "B": "Projectの指示が増えたため、Claudeの能力が自動的に下がり、同じ作業に何度も再試行が必要になっている。", "C": "思考が常にオンのモデルでは、努力レベルを変えても使用量は変わらないため、設定は原因ではない。", "D": "努力レベルは回答の文体にのみ影響する設定であり、使用量には関係せず、他のメンバーの利用が原因である。"}, "answer": "A", "select_count": 1, "explanation": "A が正解です。努力が高いほど徹底した応答になる一方、時間がかかりトークンを多く使うため、使用制限に早く達します。簡単な要約は低〜中で十分です。B は、指示の増加で能力が自動的に下がるという根拠がなく、症状とも合いません。C は誤りで、思考が常にオンのモデルでも、努力レベルを下げれば思考を減らせます。D は誤りで、努力レベルは応答の徹底度とトークン使用量に直接影響します。", "source": "https://support.claude.com/ja/articles/8664678-モデル-努力レベル-思考設定を変更する", "created": "2026-11-21"}, {"id": "A3-q009", "statement_id": "A3-2", "pack": "gen", "angle": "find-error", "role": "コンサルタント", "scenario": "コンサルティングチームが、Claudeのモデルと努力レベルの使い分けルールを社内向けに整理しています。リーダーが各メンバーの運用案をレビューし、実務判断として不適切なものがないかを確認しています。", "question": "運用案のうち、判断として最も不適切なものはどれですか。", "choices": {"A": "取引先に出す財務分析の下書きは、高い努力レベルで作成し、時間がかかっても内容を確認します。", "B": "社内向けの議事メモの整形は、低い努力レベルで素早く済ませ、使用量を節約します。", "C": "作業の途中で簡単な依頼に移ったら、同じ会話のまま努力レベルを下げて続けます。", "D": "最大努力で作成した成果物は誤りが出にくいため、社外へ出す前の人による確認を省略します。"}, "answer": "D", "select_count": 1, "explanation": "D が不適切です。努力レベルを上げると応答は徹底されますが、誤りがなくなるわけではありません。社外提出物の最終的な責任は人が負うため、確認は省略できません。A は、重要度の高い成果物に高い努力を割り当てる妥当な判断です。B は、日常的で低リスクな作業に低い努力を使う妥当な判断です。C は、会話の途中でも設定を変更でき、変更は次の応答から適用されるため、妥当な運用です。", "source": "https://support.claude.com/ja/articles/8664678-モデル-努力レベル-思考設定を変更する", "created": "2026-11-21"}, {"id": "A3-q010", "statement_id": "A3-2", "pack": "gen", "angle": "tradeoff", "role": "人事", "scenario": "人事担当者は、今日の午後の締め切りまでに2つの作業を終える必要があります。1つは候補者への面接日程調整メールの文面作成で、もう1つは組織改編案が各部署の人員配置や業務に与える影響を多面的に分析する資料です。使用制限の残りも限られています。", "question": "限られた使用量のもとで、最も適切な設定の配分はどれですか。", "choices": {"A": "品質を揃えるため、2つとも最大努力で実施し、使用制限の残りは考慮しません。", "B": "使用量を最優先して、2つとも低い努力で実施し、仕上げは最後に人が直します。", "C": "日程メールは低い努力で済ませ、複雑で重要な組織改編案の分析に高い努力か思考を充てます。", "D": "組織改編案は低い努力で素早く下書きし、日程メールの文面を最大努力で丁寧に磨きます。"}, "answer": "C", "select_count": 1, "explanation": "C が正解です。タスクの複雑さと重要度に応じて努力を配分し、簡単な作業では節約した使用量を、複雑で影響の大きい分析に回せます。A は、簡単な作業にも最大努力を使い、使用制限の制約を無視しています。B は、複雑な多面的分析まで低い努力にして、品質を犠牲にしています。D は、配分が逆で、重要な分析が浅くなり、簡単な文面に資源を浪費します。", "source": "https://support.claude.com/ja/articles/8664678-モデル-努力レベル-思考設定を変更する", "created": "2026-11-21"}, {"id": "A3-q011", "statement_id": "A3-2", "pack": "gen", "angle": "design-choice", "role": "教育", "scenario": "高校の教員が、既定の設定のClaudeに、3学年分の年間カリキュラム案を作る包括的な計画を依頼しました。最初の回答は単元の並びが大まかで、単元間のつながりや評価計画の検討が浅く見えます。教員は、同じ会話の流れを活かしながら、より深く検討させたいと考えています。", "question": "教員が取るべき対応として最も適切なものはどれですか。", "choices": {"A": "モデルと努力レベルは新しいチャットでしか変更できないため、会話を閉じ、最初から依頼し直します。", "B": "努力レベルを下げると考える時間が増えて回答が深くなるため、最も低いレベルに切り替えます。", "C": "どの設定でも結果は変わらないため、設定は変更せず、同じ依頼文をそのまま何度も送り直します。", "D": "同じ会話で努力レベルを上げ、学年や評価の観点を具体的に伝えて、次の応答の深さを確認します。"}, "answer": "D", "select_count": 1, "explanation": "D が正解です。包括的なプロジェクト計画のような複雑なタスクでは、努力レベルを上げることが有効です。また、設定は会話中いつでも変更でき、次の応答から適用されます。具体的に説明すると、努力が効果的に使われます。A は誤りで、会話を閉じる必要はありません。B は、努力を下げると思考が減るため、方向が逆です。C は、設定によって徹底度が変わるため、誤りです。", "source": "https://support.claude.com/ja/articles/8664678-モデル-努力レベル-思考設定を変更する", "created": "2026-11-21"}, {"id": "A3-q012", "statement_id": "A3-2", "pack": "gen", "angle": "troubleshoot", "role": "広報", "scenario": "Enterpriseプランを使う広報担当者は、新しいチャットを開くたびに、いつも同じモデルと低めの努力レベルで始まることに気づきました。さらに、モデルメニューには、同僚が使っていると聞いた一部のモデルや努力レベルが表示されません。チャットの中で変更はできます。", "question": "この状況の原因として最も妥当なものはどれですか。", "choices": {"A": "管理者が組織の設定で、担当者のロールに対し利用できるモデルや努力レベル、既定の組み合わせを制限している。", "B": "Claudeが質問の簡単さを自動で判断し、会話のたびに、より小さいモデルと低い努力へ自動的に切り替えている。", "C": "メモリに過去の設定が蓄積され、新しいチャットでは、前回のモデルと努力レベルが自動的に引き継がれている。", "D": "思考のトグルがオフのままになっているため、選択できるモデルと努力レベルが自動的に絞り込まれている。"}, "answer": "A", "select_count": 1, "explanation": "A が正解です。Enterprise では、管理者がロールごとにモデルや努力レベルをオフにしたり、新しいチャットを同じ設定で開始するよう構成したりできます。B は、そのような自動切り替えの仕組みは示されておらず、症状とも合いません。C は、メモリが保存するのは仕事上のコンテキストであり、モデル設定ではありません。D は、思考と努力は別の設定で、思考トグルが選択肢を絞ることはありません。", "source": "https://support.claude.com/ja/articles/8664678-モデル-努力レベル-思考設定を変更する", "created": "2026-11-21"}, {"id": "A3-q013", "statement_id": "A3-3", "pack": "gen", "angle": "design-choice", "role": "プロジェクト管理", "scenario": "あなたはプロジェクト管理の担当者で、半年続く社内システム刷新の進行管理にClaudeを使っています。毎週新しいチャットを開くたびに、確定した方針や関係者の役割を一から説明し直しており、手間がかかっています。", "question": "複数セッションにわたる作業のコンテキストを維持する方法として、最も適切なものはどれですか？", "choices": {"A": "前週のチャットを丸ごと新しいチャットに貼り付け、撤回済みの案や誤りも含めて毎回そのまま引き継ぐ", "B": "メモリがすべてを完全に覚えている前提で、内容を整理せず、毎回ごく短い依頼文だけを送って作業を進め、確定事項の管理もメモリに任せる", "C": "確定方針と関係者の役割をProjectの指示やナレッジに保存し、そのProject内でチャットを始めて内容を随時更新する", "D": "1つのチャットを半年間使い続け、話題が変わっても新しいチャットは開かずに、文脈の連続性を保つようにする"}, "answer": "C", "select_count": 1, "explanation": "正解はC。確定した方針や役割のように繰り返し使う前提は、Projectの指示やナレッジに保存し、そのProject内でチャットを始めれば、複数の会話で一貫したコンテキストを使えます。内容が変わったら更新して鮮度も保てます。Aは撤回済みの案や誤りまで毎回持ち込み、品質を下げます。Bのメモリは会話の全詳細を保存するものではなく、確定事項を管理する手段にはなりません。Dは1つのチャットが際限なく長くなり、初期の指示や古い情報が混ざりやすくなるため、区切りで要約して新しいチャットに移る判断が必要です。", "source": "https://support.claude.com/ja/articles/9517075-プロジェクトとは何ですか", "created": "2026-11-21"}, {"id": "A3-q014", "statement_id": "A3-3", "pack": "gen", "angle": "troubleshoot", "role": "人事", "scenario": "人事担当のあなたは、メモリをオンにして採用業務を進めています。先月退職した採用担当者の名前が、新しいチャットで作ったスケジュール案に今も入ってきます。その担当者に関する以前の会話は、すでに削除済みです。", "question": "この現象の原因として、最も妥当なものはどれですか？", "choices": {"A": "Claudeが会話の削除後もその内容をモデル自体に恒久的な学習として取り込んでおり、同じ内容が必ず再現されるため", "B": "元の会話を削除しても、そこから生成されたメモリのエントリは自動では削除されず、古い情報が残って参照されているため", "C": "新しいチャットを開始した際にProjectの指示が自動で書き換えられ、退職した担当者の情報が追記されてしまったため", "D": "メモリがオンのチャットでは過去のチャット検索を止められず、削除した会話もそのまま検索対象に残り続けるため"}, "answer": "B", "select_count": 1, "explanation": "正解はB。会話を削除しても、そこから作られたメモリのエントリは自動では消えません。設定でメモリの内容を確認し、該当するトピックを編集または削除することで、古い情報の参照を止められます。Aのように会話内容がモデル自体に取り込まれるという説明は誤りです。CはProjectの指示がClaudeによって自動で書き換わることはなく、根拠がありません。Dは、過去のチャットは検索対象になりますが、削除した会話を検索し続けるという仕組みではなく、今回の現象の原因として妥当ではありません。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A3-q015", "statement_id": "A3-3", "pack": "gen", "angle": "find-error", "role": "広報", "scenario": "広報チームは、未発表の人事異動に関するプレスリリース案の相談など、機密性の高い内容をClaudeで扱うための運用ルール案を検討しています。チームの全員が、メモリをオンにして日常業務を行っています。", "question": "運用ルール案のうち、不適切なものはどれですか？", "choices": {"A": "履歴やメモリに残したくない一度きりの相談は、Project外でシークレットチャットを開いて行うようにする", "B": "メモリに保存された内容は設定画面で定期的に見直し、古いものや誤ったものは編集または削除して質を保つ", "C": "特定の1回のチャットだけメモリを使わせたくない場合は、最初のメッセージを送る前にメモリをオフにしておく", "D": "シークレットチャットで始めた相談は、内容が固まった段階で通常のチャットに切り替えて、履歴に残して再利用する"}, "answer": "D", "select_count": 1, "explanation": "不適切なのはD。シークレットチャットは始めたあとで通常のチャットに変換したり、履歴に保存したりすることはできません。必要な内容は、終了前に別途保存しておく必要があります。Aは、シークレットチャットが履歴にもメモリにも寄与しないため適切です。Bは、メモリの内容をレビューし編集・削除して品質を維持する、正しい運用です。Cは、メモリを使わせない設定が最初のメッセージ送信前にしか行えないため、手順として正しい内容です。", "source": "https://support.claude.com/ja/articles/12260368-シークレットチャットを使用する", "created": "2026-11-21"}, {"id": "A3-q016", "statement_id": "A3-3", "pack": "gen", "angle": "tradeoff", "role": "マーケティング", "scenario": "マーケティング担当のあなたは、新商品のキャンペーン案づくりを1つの長いチャットで続けてきました。途中で方針が何度も変わり、最近の応答は初期の案と撤回済みの案を混同し始めています。作業はまだ数週間続きます。", "question": "正確さと手間のバランスを考えて、最も適切な進め方はどれですか？", "choices": {"A": "現時点の確定方針と未決事項をClaudeに要約させて自分で確認・修正し、Projectに保存して新しいチャットで再開する", "B": "同じチャットで「初期の方針を優先して」という指示を繰り返し、撤回済みの案も履歴に残したままチャットを続ける", "C": "新しいチャットを開き、メモリが過去の議論を細部まで記憶しているはずだと考え、何も伝えずに続きの依頼から始める", "D": "古いチャットの全文を新しいチャットにそのまま貼り付け、撤回済みの案もすべて含めて、どれが有効かはClaudeに任せる"}, "answer": "A", "select_count": 1, "explanation": "正解はA。混乱した長いチャットは、確定事項だけを要約して人が確認・修正し、Projectに保存してから新しいチャットで再開するのが、手間と正確さのバランスに優れます。Bは、撤回済みの案が残る長いチャットを続けるため、混同の原因が解消されません。Cは、新しいチャットは前の会話を自動では引き継がず、メモリも会話の細部を保存するものではないため、前提が欠けた状態で始まります。Dは、撤回済みの案や誤りを含む全文を引き継いでしまい、新しいチャットに移るメリットがなくなります。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A3-q017", "statement_id": "A3-3", "pack": "gen", "angle": "design-choice", "role": "ナレッジワーカー", "scenario": "あなたはナレッジワーカーで、通院の予定に合わせた勤務スケジュールの調整をClaudeによく相談しています。毎回自分の事情を説明し直すのが負担ですが、健康に関する内容はメモリに保存されていないようです。", "question": "この内容を引き継がせたい場合、最も適切な対応はどれですか？", "choices": {"A": "チャットで「覚えておいて」と頼めば、本人の依頼なので健康情報も設定に関係なく必ずメモリに保存される", "B": "組織の所有者に依頼して、自分のアカウントでも機密トピックが保存されるよう、所有者側の操作で有効にしてもらう", "C": "自分の設定で機密トピックをメモリに含める選択をし、保存時の通知で内容を確認して、不要になれば削除する", "D": "健康上の事情を詳しく書いたメモを、チーム共有のProjectの指示に入れて、全メンバーのチャットで参照させる"}, "answer": "C", "select_count": 1, "explanation": "正解はC。健康などの機密トピックは既定ではメモリに保存されませんが、本人が設定でメモリに含める選択をすれば保存され、保存のたびに通知で確認でき、保存後も削除できます。Aは、「覚えておいて」と頼んでも、機密トピックは設定をオンにしない限り保存されません。Bは、所有者が個々のユーザーの機密トピックを有効にすることはできず、各ユーザー自身のオプトインが必要です。Dは、機微な個人情報を共有Projectに入れることになり、不必要に閲覧範囲を広げる不適切な方法です。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A3-q018", "statement_id": "A3-3", "pack": "gen", "angle": "troubleshoot", "role": "コンサルタント", "scenario": "コンサルタントのあなたは、クライアントAの機密性の高い検討を通常のチャットで始め、3往復したところで、他の案件に影響しないようメモリをオフにしようとしました。しかし、このチャットでは切り替えができませんでした。", "question": "切り替えができなかった原因として、最も妥当なものはどれですか？", "choices": {"A": "チャット単位のメモリのオン・オフは最初のメッセージを送る前にだけ設定でき、始まったあとは変更できないため", "B": "Claudeが機密性が高いと判断した会話は、メモリの設定が自動的に固定されて、ユーザーが変更できなくなるため", "C": "チャット単位でメモリを切り替えられるのはProject内のチャットだけで、Project外の通常チャットでは提供されないため", "D": "会話が一定の長さを超えると、Claudeがメモリに関する設定操作を受け付けなくなる仕様になっているため"}, "answer": "A", "select_count": 1, "explanation": "正解はA。1つのチャットでメモリを使わせない設定は、最初のメッセージを送る前に行う必要があり、始まったあとは変更できません。この場合は新しいチャットでメモリをオフにして始め直し、すでに保存された内容は設定のメモリ管理で確認して、不要なものを編集・削除します。Bは、Claudeが会話内容から設定を固定する仕組みはありません。CはProject内でも通常のチャットでも、最初のメッセージ前にオフにできるため誤りです。Dは、会話の長さと設定の可否は無関係です。", "source": "https://support.claude.com/ja/articles/11817273-claudeのチャット検索とメモリを使用して以前のコンテキストを活用する", "created": "2026-11-21"}, {"id": "A3-q019", "statement_id": "A3-1", "pack": "gen", "angle": "design-choice", "role": "オペレーション", "scenario": "オペレーション担当者が2つの作業を進めます。1つは、昨日発表された主要取引先の社名変更が事実かどうかの確認です。もう1つは、社内の出荷手順書を読み直し、ミスが起きにくい新しい手順を多角的に検討する作業です。前者は短い確認で済み、後者にウェブの最新情報は必要ありません。", "question": "各作業に最も適した機能の使い方はどれですか。（2つ選択）", "choices": {"A": "社名変更の事実確認は1〜2回の検索で答えが出る内容なので、ウェブ検索を使って最新の情報を確認する。", "B": "社名変更の確認にも念のためリサーチを使い、多数の情報源を横断した詳細なレポートを作成させる。", "C": "手順の再設計は最新情報が不要な複雑な推論なので、拡張思考で結論の前に複数の角度から検討させる。", "D": "社名変更の確認は拡張思考だけで足りるため、深く考えさせて最新の発表内容も正しく導かせる。", "E": "手順の再設計では、推論の質を上げるために毎回ウェブ検索を併用し、検索回数が増えるほど良いとみなす。"}, "answer": "A,C", "select_count": 2, "explanation": "A（正解）：1〜2回のツール呼び出しで答えられるシンプルで事実的な最新情報の確認は、ウェブ検索の得意分野です。C（正解）：ウェブの最新情報を必要としない複雑な推論
