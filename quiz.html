  const answered = [...new Set(results.map(r => r.id))];
  const newAnswered = answered.filter(id => MASTERY[id] && MASTERY[id].s === "new").length;
  done.ids = [...new Set(done.ids.concat(answered))];
  done.newCount += newAnswered;
  writeLS(REVIEW_DONE_KEY, done);
  delLS(REVIEW_SET_KEY);
}
let idx = 0; const results = [];
let picked = [];  // 複数選択問題で現在選ばれている選択肢
let finished = false;
const $ = (id) => document.getElementById(id);
// 本番は70問120分。1問あたりの目安は2分として、経過時間を常時出してペースを体に入れる。
const PACE_SEC = 120;
let qStart = 0, tickId = null;
const qTimes = [];
const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function tick() {
  const s = (Date.now() - qStart) / 1000;
  $("timer").textContent = mmss(s);
  $("timer").classList.toggle("over", s > PACE_SEC);
}
function startTimer() {
  qStart = Date.now();
  if (tickId) clearInterval(tickId);
  tick(); tickId = setInterval(tick, 1000);
}
function stopTimer() {
  if (tickId) { clearInterval(tickId); tickId = null; }
  return (Date.now() - qStart) / 1000;
}

// ---- 本番通しの全体カウントダウン（絶対時刻の締切。中断中だけ凍結）----
let examTickId = null;
function examLeft() {
  const st = EXAM_STATE;
  return st.frozenLeft !== null ? st.frozenLeft : (st.deadline - Date.now()) / 1000;
}
function saveExam(nextIdx) {
  Object.assign(EXAM_STATE, { idx: nextIdx, results: results.slice(), qTimes: qTimes.slice(), savedAt: Date.now() });
  writeLS(EXAM_STATE_KEY, EXAM_STATE);
}
function examShow() {
  const left = examLeft();
  $("examclock").textContent = (EXAM_STATE.frozenLeft !== null ? "中断中 " : "残り ") + mmss(Math.max(0, left));
  $("examclock").classList.toggle("low", left <= 600);
  $("examclock").classList.remove("hidden");
  return left;
}
function examTick() {
  if (examShow() <= 0) finish();  // 0 で自動終了 → 結果送信画面
}
function examStart() {
  if (!EXAM || !EXAM_STATE || examTickId || finished || EXAM_STATE.frozenLeft !== null) return;
  examTickId = setInterval(examTick, 1000);
  examTick();
}
function examStop() {
  if (examTickId) { clearInterval(examTickId); examTickId = null; }
}
function examFreeze() {
  EXAM_STATE.frozenLeft = Math.max(0, examLeft());
  examStop();
  examShow();
}
function examThaw() {
  if (EXAM_STATE.frozenLeft !== null) {
    EXAM_STATE.deadline = Date.now() + EXAM_STATE.frozenLeft * 1000;
    EXAM_STATE.frozenLeft = null;
  }
}

if (idsParam && QUESTIONS !== QUESTIONS_DEFAULT) {
  const doms = [...new Set(QUESTIONS.map(q => q.statement_id.split("-")[0]))].sort().join("+");
  $("setlabel").textContent = "CCAO-F Practice · " + doms + " · " + QUESTIONS.length + "問";
}
if (DOMAIN) {
  $("setlabel").textContent = "CCAO-F Practice · " + DOMAIN + " · " + QUESTIONS.length + "問";
}
if (EXAM) {
  $("setlabel").textContent = "CCAO-F 本番通し · " + QUESTIONS.length + "問 / " + EXAM_MINUTES + "分";
  $("examnote").classList.remove("hidden");
}
if (REVIEW && !REVIEW_EMPTY) {
  $("setlabel").textContent = "CCAO-F 習得ループ · " + QUESTIONS.length + "問（誤答は同じセッションで再出題）";
}
// 選択肢の「並び順」だけをセッションごとにシャッフルする（ラベルは元の記号のまま表示）。
// ラベルまで表示位置基準に振り直すと、解説が元の記号を前提に「Bが正解で…」と書かれているため
// 画面表示と解説が食い違う。ラベルは元の記号のまま位置だけ変えることで、解説との整合を保ちつつ
// 位置記憶での正答だけを防ぐ。記録される answer も元の記号のまま。
// 選択肢数は4とは限らない（複数選択問題は5択）ので問題ごとに数える。
function orderFor(q) {
  if (!q.__order) {
    const keys = Object.keys(q.choices).sort();
    for (let i = keys.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [keys[i], keys[j]] = [keys[j], keys[i]];
    }
    q.__order = keys;
  }
  return q.__order;
}
function render() {
  const q = QUESTIONS[idx];
  const order = orderFor(q);
  $("counter").textContent = (idx + 1) + " / " + QUESTIONS.length;
  $("pbar").style.width = (idx / QUESTIONS.length * 100) + "%";
  $("domchip").textContent = q.statement_id;
  $("scenario").textContent = q.scenario;
  $("question").textContent = q.question;
  $("feedback").classList.add("hidden");
  const n = selectCount(q);
  picked = [];
  const box = $("choices"); box.innerHTML = "";
  order.forEach((key) => {
    const b = document.createElement("button");
    b.className = "choice"; b.dataset.key = key;
    const k = document.createElement("span"); k.className = "key"; k.textContent = key;
    const t = document.createElement("span"); t.textContent = q.choices[key];
    b.append(k, t);
    b.addEventListener("click", () => { n > 1 ? toggle(key) : answer([key]); });
    box.appendChild(b);
  });
  // 複数選択（2つ選ぶ問題）は選んでから「回答する」で確定させる。
  $("submitbtn").classList.toggle("hidden", n === 1);
  if (n > 1) { $("submitbtn").disabled = true; $("submitbtn").textContent = "回答する（" + n + "つ選択）"; }
  startTimer();
  examStart();
}
// 正解キーの集合。単一選択は "B"、複数選択は "B,D" のようにカンマ区切りで持つ。
function answerKeys(q) { return String(q.answer).split(",").map(s => s.trim()).filter(Boolean); }
function selectCount(q) { return q.select_count || answerKeys(q).length || 1; }
function toggle(key) {
  const q = QUESTIONS[idx], n = selectCount(q);
  const i = picked.indexOf(key);
  if (i >= 0) picked.splice(i, 1);
  else if (picked.length < n) picked.push(key);
  for (const b of document.querySelectorAll(".choice")) {
    b.classList.toggle("sel", picked.includes(b.dataset.key));
  }
  $("submitbtn").disabled = picked.length !== n;
}
$("submitbtn").addEventListener("click", () => answer(picked.slice()));
function answer(keys) {
  const q = QUESTIONS[idx];
  const want = answerKeys(q);
  const correct = keys.length === want.length && want.every(k => keys.includes(k));  // 完全一致で採点
  const secs = stopTimer();
  qTimes.push(secs);
  results.push({ id: q.id, correct, keys: keys.slice() });
  if (REVIEW && !correct && (requeueCount[q.id] || 0) < 2) {
    requeueCount[q.id] = (requeueCount[q.id] || 0) + 1;
    delete q.__order;          // 再出題では並びを変える（位置記憶で正解しない）
    QUESTIONS.push(q);
  }
  if (EXAM) {  // 本番通しは1問ごとの正誤・解説を出さず、そのまま次へ進む
    saveExam(idx + 1);
    idx += 1;
    if (idx < QUESTIONS.length) { render(); window.scrollTo({top:0}); } else { finish(); }
    return;
  }
  $("submitbtn").classList.add("hidden");
  for (const b of document.querySelectorAll(".choice")) {
    b.disabled = true; b.classList.remove("sel");
    if (want.includes(b.dataset.key)) b.classList.add("correct");
    else if (keys.includes(b.dataset.key)) b.classList.add("wrong");
  }
  const v = $("verdict");
  const pace = " · " + mmss(secs) + (secs > PACE_SEC ? " ⏱ 目安(2:00)超過" : "");
  v.textContent = (correct ? "✓ 正解" : "✗ 不正解 — 正解: " + want.join(", ")) + pace;
  v.className = "verdict " + (correct ? "ok" : "ng");
  $("expl").textContent = q.explanation;
  const a = $("srclink");
  if (q.source && /^https?:[/][/]/.test(q.source)) { a.href = q.source; a.textContent = q.source; a.classList.remove("hidden"); }
  else { a.removeAttribute("href"); a.textContent = ""; a.classList.add("hidden"); }
  $("nextbtn").textContent = idx === QUESTIONS.length - 1 ? "結果を見る →" : "次の問題 →";
  $("feedback").classList.remove("hidden");
  $("feedback").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
$("nextbtn").addEventListener("click", () => {
  idx += 1;
  if (idx < QUESTIONS.length) { render(); window.scrollTo({top:0}); } else { finish(); }
});
function finish() {
  if (finished) return;
  finished = true;
  examStop();
  $("examclock").classList.add("hidden");
  clearProgress();
  if (EXAM) delLS(EXAM_STATE_KEY);
  if (REVIEW) markReviewDone();
  $("quiz").classList.add("hidden");
  $("resumebox").classList.add("hidden"); $("pausedbox").classList.add("hidden");
  stopTimer();
  $("timer").textContent = "";
  $("pbar").style.width = "100%";
  if (!results.length) {  // 回答ゼロでは結果コードを作らない（空の QR を送らせない）
    $("scoreline").textContent = "0 / 0";
    $("paceline").textContent = "回答がないため、記録する結果はありません。";
    for (const id of ["qrcode", "copybtn", "codelabel", "formbtn"]) $(id).classList.add("hidden");
    $("final").classList.remove("hidden");
    return;
  }
  const ok = results.filter(r => r.correct).length;
  $("scoreline").textContent = ok + " / " + results.length;
  if (qTimes.length) {
    const avg = qTimes.reduce((a, b) => a + b, 0) / qTimes.length;
    const over = qTimes.filter(s => s > PACE_SEC).length;
    $("paceline").innerHTML = "平均 <b>" + mmss(avg) + "</b> / 問（目安 2:00）· 超過 <b>"
      + over + "</b> 問"
      + (avg > PACE_SEC ? " — もう少しペースを上げましょう" : " — 本番ペースを維持できています");
  }
  if (EXAM && results.length < QUESTIONS.length) {
    $("paceline").innerHTML += "<br>（" + QUESTIONS.length + "問中 " + results.length + "問を回答。未回答は記録に含めません）";
  }
  const list = $("reslist");
  for (const r of results) {
    const q = BYID[r.id];
    const row = document.createElement("div"); row.className = "row";
    const m = document.createElement("span"); m.className = "mark";
    m.textContent = r.correct ? "✓" : "✗"; m.style.color = r.correct ? "var(--ok)" : "var(--ng)";
    const t = document.createElement("span");
    t.textContent = r.id + " (" + q.statement_id + ") " + (EXAM ? q.question : q.question.slice(0, 60) + "…");
    row.append(m, t); list.appendChild(row);
    if (EXAM) {  // 本番通し: 正誤・正解・解説は結果画面でまとめて見せる
      const d = document.createElement("div"); d.className = "expl";
      d.style.whiteSpace = "pre-wrap";
      d.textContent = "あなたの回答: " + ((r.keys || []).join(", ") || "-") + " / 正解: " + answerKeys(q).join(", ")
        + "\n" + q.explanation;
      list.appendChild(d);
    }
  }
  const recorded = REVIEW ? firstAnswers(results) : results;
  const code = "QR|" + TODAY + "|quiz-artifact|" + recorded.map(r => r.id + ":" + (r.correct ? "o" : "x")).join(",");
  if (REVIEW && recorded.length < results.length) {
    $("paceline").innerHTML += "<br>（再出題の解き直しは記録に含めず、最初の解答だけを記録します）";
  }
  $("qrcode").textContent = code;
  if (FORM_BASE && FORM_ENTRY) {
    const sep = FORM_BASE.includes("?") ? "&" : "?";
    $("formbtn").href = FORM_BASE + sep + FORM_ENTRY + "=" + encodeURIComponent(code);
    $("formbtn").classList.remove("hidden");
  }
  $("copybtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(code); $("copybtn").textContent = "コピーしました ✓"; }
    catch { const sel = window.getSelection(), rg = document.createRange();
      rg.selectNodeContents($("qrcode")); sel.removeAllRanges(); sel.addRange(rg);
      $("copybtn").textContent = "選択しました — 長押しでコピー"; }
  });
  if (REVIEW) {
    const a = document.createElement("a");
    a.className = "formbtn";
    a.href = location.pathname + "?mode=review&n=" + REVIEW_N;
    a.textContent = "▶ 次の" + REVIEW_N + "問へ（結果の送信を先に）";
    $("final").appendChild(a);
  }
  $("final").classList.remove("hidden");
}

// 中断・再開: 問題セットごとの進捗をlocalStorageに保存する。
// 保存先はその端末のブラウザだけ（別端末には引き継がれない）。解答前の1問の途中経過は保存しない。
const PROGRESS_KEY = "ccao_quiz_progress";
const setKey = QUESTIONS.map(q => q.id).join(",");
function readProgressMap() { return readLS(PROGRESS_KEY) || {}; }
function writeProgressMap(m) { writeLS(PROGRESS_KEY, m); }
function clearProgress() { const m = readProgressMap(); delete m[setKey]; writeProgressMap(m); }
function saveProgress(nextIdx) {
  if (EXAM) { saveExam(nextIdx); return; }
  const m = readProgressMap();
  m[setKey] = { idx: nextIdx, results: results.slice(), qTimes: qTimes.slice(),
    extra: QUESTIONS.slice(ORIG_LEN).map(q => q.id), savedAt: new Date().toISOString() };
  writeProgressMap(m);
}
function applySaved(s) {
  idx = s.idx; results.push(...s.results); qTimes.push(...s.qTimes);
  for (const id of (s.extra || [])) {
    if (BYID[id]) QUESTIONS.push(BYID[id]);
    requeueCount[id] = (requeueCount[id] || 0) + 1;
  }
}
function showReviewEmpty() {
  $("quiz").classList.add("hidden");
  const box = document.createElement("div");
  box.className = "card";
  box.innerHTML = '<span class="eyebrow">習得ループ</span>'
    + '<p style="margin:10px 0 0">今日の復習対象はありません（期日が来た誤答問題・新規枠とも空）。</p>';
  $("app").appendChild(box);
}
function showNoQuestions() {
  $("quiz").classList.add("hidden");
  const box = document.createElement("div");
  box.className = "card";
  box.innerHTML = '<p style="margin:0">出題できる問題がありません。</p>';
  $("app").appendChild(box);
}
function startQuiz() {
  $("resumebox").classList.add("hidden"); $("pausedbox").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  render(); window.scrollTo({ top: 0 });
}
$("pausebtn").addEventListener("click", () => {
  const answered = !$("feedback").classList.contains("hidden");
  const nextIdx = answered ? idx + 1 : idx;
  if (nextIdx >= QUESTIONS.length) { finish(); return; }  // 最終問題まで解き終えているなら結果画面へ
  stopTimer();
  if (EXAM) examFreeze();   // 中断を押したときだけ残り時間を凍結する（回答ゼロでも時計・問題セットは維持）
  idx = nextIdx;
  saveProgress(nextIdx);
  $("quiz").classList.add("hidden");
  $("pausedinfo").textContent = "ここまで " + results.length + "問回答済み。次は " + (nextIdx + 1) + "/" + QUESTIONS.length
    + "問目です。このURLを開き直すと続きから再開できます。"
    + (EXAM ? "（中断中は残り時間が進みません。再開すると続きから数えます）" : "");
  $("pausedbox").classList.remove("hidden");
});
$("continuebtn").addEventListener("click", () => {
  if (EXAM) { examThaw(); saveExam(idx); }
  startQuiz();
});
$("earlybtn").addEventListener("click", () => {
  if (!results.length) { $("earlybtn").textContent = "まだ1問も回答していません"; return; }
  finish();
});
function bootExam() {
  const s = EXAM_STATE;
  if (!EXAM_RESTORED) { saveExam(0); render(); return; }
  idx = s.idx; results.push(...s.results); qTimes.push(...s.qTimes);
  if (s.frozenLeft === null && examLeft() <= 0) { finish(); return; }  // 閉じている間に時間切れ
  if (s.frozenLeft === null && !results.length) { render(); return; }   // 1問も解く前のリロード: そのまま続行
  $("resumeinfo").textContent = (s.frozenLeft !== null ? "中断中（残り " + mmss(s.frozenLeft) + "）: " : "時間は進行中: ")
    + results.length + "問回答済み・次は " + (idx + 1) + "/" + QUESTIONS.length + "問目"
    + (s.frozenLeft !== null ? "。再開すると残り時間が動き出します。" : "。制限時間は実時間で進んでいます。");
  $("quiz").classList.add("hidden");
  $("resumebox").classList.remove("hidden");
  examShow();
  examStart();
  $("resumebtn").addEventListener("click", () => { examThaw(); saveExam(idx); startQuiz(); });
  $("resumerecbtn").addEventListener("click", () => { $("resumebox").classList.add("hidden"); finish(); });
  $("restartbtn").addEventListener("click", () => { delLS(EXAM_STATE_KEY); location.reload(); });
}
(function boot() {
  if (REVIEW_EMPTY) { showReviewEmpty(); return; }
  if (!QUESTIONS.length) { showNoQuestions(); return; }
  if (EXAM) { bootExam(); return; }
  const s = readProgressMap()[setKey];
  if (!s || !s.results || !s.results.length || s.idx >= QUESTIONS.length + (s.extra || []).length) { render(); return; }
  const d = new Date(s.savedAt);
  $("resumeinfo").textContent = (d.getMonth() + 1) + "/" + d.getDate() + " に中断: " + s.results.length
    + "問回答済み・次は " + (s.idx + 1) + "/" + (QUESTIONS.length + (s.extra || []).length) + "問目";
  $("quiz").classList.add("hidden");
  $("resumebox").classList.remove("hidden");
  $("resumebtn").addEventListener("click", () => { applySaved(s); startQuiz(); });
  $("resumerecbtn").addEventListener("click", () => { applySaved(s); $("resumebox").classList.add("hidden"); finish(); });
  $("restartbtn").addEventListener("click", () => { clearProgress(); startQuiz(); });
})();
</script>
</body>
</html>
